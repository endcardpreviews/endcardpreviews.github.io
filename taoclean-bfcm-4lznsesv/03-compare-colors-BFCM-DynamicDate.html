<script>
(function(){
  var EV=['pointerdown','pointerup','pointermove','mousedown','mouseup','click','touchstart','touchend','touchmove'];
  function mine(el){ try{ return !!(el&&el.closest&&el.closest('#bow,#cta,#hit')); }catch(e){ return false; } }
  /* 1. our own controls act first, while the event is still on its way down */
  window.addEventListener('click',function(e){ if(mine(e.target)&&window.__BFCLICK) window.__BFCLICK(e); },true);
  /* 2. nothing reaches the creative's own document-level tap-to-store handler */
  EV.forEach(function(ev){
    var stop=function(e){ e.stopImmediatePropagation(); };
    window.addEventListener(ev,stop,true);
    document.addEventListener(ev,stop,true);
  });
})();
</script>

html{background:#7E111C}
body{position:fixed !important;left:0 !important;top:0 !important;width:360px !important;
 height:640px !important;margin:0 !important;transform-origin:0 0;z-index:1}
#bfui{position:fixed;left:0;top:0;width:360px;height:640px;transform-origin:0 0;z-index:2;pointer-events:none}
#bfui>*{pointer-events:auto}
#bfpatch{position:absolute;left:29px;top:62px;width:360px;height:640px;transform-origin:0 0;
 transform:scale(0.84);z-index:29;pointer-events:none}
#bfpatch div{position:absolute;display:flex;align-items:center;justify-content:center;
 font-family:"BFOutfit",Arial,sans-serif;font-weight:700}
.bfwrapbg{position:fixed;inset:-50vmax;z-index:0;background:
 radial-gradient(120% 60% at 50% 30%,rgba(255,255,255,.06),transparent 60%),#7E111C;pointer-events:none}
/* black Black Friday bar - two clean rows */
.bfbar{position:absolute;left:0;right:0;top:0;height:62px;z-index:40;background:#0A0A0A;color:#F6F1E7;
 padding:10px 14px 0;text-align:center;overflow:hidden;border-bottom:2px solid #C8202F}
.bfbar>div{position:relative;z-index:1}
.bfbar .r1{display:flex;align-items:center;justify-content:center;gap:9px}
.bfbar .bf{font-family:"BFPlayfair",Georgia,serif;font-style:italic;font-weight:700;font-size:19px;line-height:1;
 letter-spacing:-.005em}
.bfbar .ea{font:400 8px/1 "BFOutfit",sans-serif;letter-spacing:.2em;color:#ADC8BE;
 border-left:1px solid rgba(246,241,231,.3);padding-left:9px}
.bfbar .r2{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px;
 font:400 11px/1 "BFOutfit",sans-serif;letter-spacing:.06em;white-space:nowrap}
.bfbar .r2 em{font-style:normal;font-weight:700;font-size:12.5px;letter-spacing:.04em;color:#EB9678}
.bfbar .r2 .plus{color:#ADC8BE}
.bfbar .r2 strong{font-weight:700;letter-spacing:.1em;color:#D8A657}
.bfbar .tm{display:flex;align-items:center;gap:1px;margin-left:3px;padding-left:9px;
 border-left:1px solid rgba(246,241,231,.22)}
.bfbar .tm b{font:400 12px/1 "BFNum",sans-serif;font-variant-numeric:tabular-nums;min-width:14px;color:#fff}
.bfbar .tm .c{font:400 10px/1 "BFNum";color:#ADC8BE}
/* ribbon frame around the creative */
.bfframe{position:absolute;left:29px;top:62px;width:302px;height:538px;z-index:30;pointer-events:none;
 border:2px solid #C8202F;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.bfframe:before,.bfframe:after{content:"";position:absolute;background:#C8202F}
.bfframe:before{left:50%;top:-3px;bottom:-3px;width:0}
.bfribbon{position:absolute;left:0;right:0;top:62px;height:0px;z-index:28;pointer-events:none;
 background:repeating-linear-gradient(135deg,#C8202F 0 9px,#7E111C 9px 18px);opacity:.9}
.bfribbon.bot{top:auto;bottom:0;height:40px}
/* bow */
.bow{position:absolute;left:275px;top:42px;width:70px;z-index:44;cursor:pointer;
 filter:drop-shadow(0 4px 9px rgba(0,0,0,.45));transition:transform .45s cubic-bezier(.3,1.5,.4,1)}
.bow svg{width:100%;height:auto;display:block}
.bow:after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid #D8A657;opacity:.5;
 animation:bfring 2.1s ease-out infinite}
@keyframes bfring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.18);opacity:0}}
html.done .bow{transform:scale(.82) rotate(-9deg)}
html.done .bow:after{display:none}
/* the gift tag that the bow reveals */
.tag{position:absolute;left:50%;top:603px;transform:translate(-50%,10px) scale(.92);z-index:46;
 display:inline-flex;align-items:baseline;gap:7px;background:#F6F1E7;color:#0A0A0A;border:1.5px solid #C8202F;
 border-radius:999px;padding:5px 13px 4px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.45);opacity:0;
 pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.3,1.4,.4,1)}
html.done .tag{opacity:1;transform:translate(-50%,0) scale(1)}
.tag b{font:400 13px/1 "BFPlayfair",Georgia,serif;font-style:italic;color:#C8202F}
.tag span{font:400 7.5px/1 "BFOutfit",sans-serif;letter-spacing:.15em;text-transform:uppercase}
/* hint chip */
.bfchip{position:absolute;left:50%;transform:translateX(-50%);top:604px;z-index:45;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 12px 0 10px;border-radius:999px;
 background:#0A0A0A;color:#F6F1E7;border:1px solid #D8A657;
 font:400 9px/1 "BFOutfit",sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
 animation:bfchip 1.9s ease-in-out infinite;transition:opacity .3s}
@keyframes bfchip{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.04)}}
html.done .bfchip{opacity:0;animation:none}
/* interaction layers */
#bfshield{position:absolute;left:0;right:0;top:62px;bottom:0;z-index:20}
#cta{position:absolute;z-index:42;cursor:pointer;background:transparent}
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:41;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
html.done .bow{pointer-events:none}
.bfcf{position:absolute;z-index:60;width:7px;height:7px;pointer-events:none;
 animation:bfcf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bfcf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
#cta{left:53px;top:530px;width:254px;height:51px}</style>
</head>

	<canvas id="canvas"></canvas>
