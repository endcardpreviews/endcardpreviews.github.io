    /* ══════════════════════════════════════════════════════════
       RESPONSIVE SYSTEM — DO NOT MODIFY
       ══════════════════════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    img {
      -webkit-user-drag: none;
      pointer-events: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      touch-action: none;
      user-select: none;
    }

    .container {
      position: relative;
      height: 100vh;
      justify-content: center;
      align-items: center;
      display: flex;
      flex-direction: column;
      width: 100vw;
      transform-origin: center center;
      background-color: var(--color-bg);
    }

    .loadings {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--color-loading);
      z-index: 9999;
    }

    /* ══════════════════════════════════════════════════════════
       BRANDING — TAO Clean light (palette.json), same vars as
       the other TAO builds.
       ══════════════════════════════════════════════════════════ */
    :root {
      --color-bg: #ffffff;
      --color-loading: #ffffff;
      --color-cta: #f98d2a;
      --color-cta-text: #ffffff;
      --color-ink: #0e424f;           /* deep teal ink — headings, GET/OFF */
      --color-accent-cyan: #44c8e9;
      --color-accent-teal: #25ccd3;
      --font-display: 'Fustat', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    /* ══════════════════════════════════════════════════════════
       SIP SCREEN — choreography lifted from the client's Quip
       reference video (sip3.html), rebuilt in DOM/CSS:

         0.00s  backdrop + pulsing CTA on screen
         0.05s  logo swings in at the top
         0.30s  product name rises in under it
         0.65s  offer block swings in (rotate + overshoot settle)
         1.30s  full packshot (brush + UV base, one piece) drops in
         2.20s  three feature lines fly in from the left (staggered)
         2.90s  dynamic date + countdown rise in
         then   static composition; CTA keeps pulsing
       ══════════════════════════════════════════════════════════ */
    .final-screen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 1600px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
    }

    /* Oversized letterbox bleed — same two-layer trick as the other
       TAO builds so tablets never show flat bands round the canvas. */
    .final-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6000px;
      height: 6000px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      background:
        linear-gradient(180deg,
          #ffffff 0%,
          #f4fbfe 46%,
          #e8f6fc 72%,
          #dcf0f9 72.01%,
          #eaf7fc 100%) center / 100% 1600px no-repeat,
        linear-gradient(180deg, #ffffff 0 50%, #eaf7fc 50% 100%);
    }

    /* UV-glow bloom behind the product cluster — brand hero motif.
       Fades in with the brush, then breathes forever. */
    .final-glow {
      position: absolute;
      top: 56%;
      left: 68%;
      width: 780px;
      height: 780px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle,
        rgba(68, 200, 233, 0.30) 0%,
        rgba(68, 200, 233, 0.12) 42%,
        rgba(68, 200, 233, 0) 70%);
      animation: glowIn 0.8s ease 1.5s forwards, uvBreath 4s ease-in-out 2.3s infinite;
    }

    /* ── logo ── (96px top gap == CTA bottom gap, house rule) */
    .final-logo-wrap {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      pointer-events: none;
    }

    .final-logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
      animation: swingInSoft 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) 0.05s both;
    }

    .final-name {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 840px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 4.4rem;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.08;
      color: var(--color-ink);
      pointer-events: none;
      opacity: 0;
      animation: riseIn 0.62s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s forwards;
    }

    /* ── offer block, left column — the reference's "Get 15% OFF"
       swing-in, re-typed as GET 55% OFF ── */
    /* offer sits centred ABOVE the product image */
    .offer-wrap {
      position: absolute;
      top: 23%;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      pointer-events: none;
    }

    .offer-swing {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: var(--font-display);
      transform-origin: 50% 60%;
      animation: swingIn 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) 0.65s both;
    }

    /* GET rides inside .of-row — same accent + size as the % sign */
    .of-get {
      align-self: center;
      margin-right: 14px;
      font-size: 4.8rem;
      font-weight: 900;
      color: var(--color-cta);
      line-height: 0.9;
    }

    .of-row {
      display: flex;
      align-items: flex-start;
      line-height: 0.86;
      margin-top: 6px;
    }

    .of-num {
      font-size: 10.5rem;
      font-weight: 900;
      letter-spacing: -6px;
      color: var(--color-cta);
    }

    .of-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-left: 10px;
      margin-top: 10px;
    }

    .of-pct {
      font-size: 4.8rem;
      font-weight: 900;
      color: var(--color-cta);
      line-height: 0.9;
    }

    .of-off {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--color-ink);
      line-height: 1;
      margin-top: 6px;
    }

    .of-date {
      margin-top: 20px;
      font-family: var(--font-body);
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--color-accent-teal);
      white-space: nowrap;
    }

    /* countdown under the offer — house dynamic-date signature */
    /* the only line that stays glued above the CTA */
    .cta-countdown {
      position: absolute;
      top: 80.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      text-align: center;
      font-family: var(--font-body);
      font-size: 2.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--color-ink);
      pointer-events: none;
      opacity: 0;
      animation: riseIn 0.62s cubic-bezier(0.22, 0.61, 0.36, 1) 2.9s forwards;
    }

    /* Fixed-width slot for the digits: the line's total width never
       changes as the timer ticks, so "Offer ends in" stays pinned —
       only the digits repaint inside their box. */
    .cta-countdown b {
      font-weight: 800;
      color: var(--color-cta);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      display: inline-block;
      width: 7.6ch;
      text-align: left;
    }

    /* ── hero product — the FULL packshot (brush + UV base together,
       per client: the product is one piece, never separated). One
       block that drops in and settles; the .pshot/.on machinery stays
       so colourway frames can cross-fade later if the client sends
       them. Frames are 500×500 with the product filling ~217×431,
       so a 676px square box shows ~293×583 of visible product.
       Sits mid-right: name above, offer + CTA below, features to
       its left — the cone's widest edge starts at x≈471, so the
       feature lines (ending ≤461) stay clear of it. */
    .final-product {
      position: absolute;
      top: 56%;
      left: 71%;
      transform: translate(-50%, -50%);
      width: 777px;
      height: 777px;
      pointer-events: none;
      opacity: 0;
      animation: productIn 0.72s cubic-bezier(0.22, 0.61, 0.36, 1) 1.3s both;
    }

    .final-product .pshot {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.7s ease;
      filter: drop-shadow(0 26px 44px rgba(14, 66, 79, 0.22));
    }

    .final-product .pshot.on { opacity: 1; }

    /* ── feature chips — the reference's second fly-in, re-cast as
       product copy with a circular line-icon badge per feature (client
       mock: cyan disc + ink icon + bold ink label). Staggered in from
       the left with motion blur. ── */
    .feat {
      position: absolute;
      left: 4%;
      display: inline-flex;
      align-items: center;
      gap: 24px;
      font-family: var(--font-body);
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.15;
      color: var(--color-ink);
      white-space: nowrap;
      pointer-events: none;
      animation: featIn 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    .feat-icon {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #74d8f3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .feat-icon img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      display: block;
    }

    .feat-1 { top: 51%; animation-delay: 2.2s; }
    .feat-2 { top: 58.6%; animation-delay: 2.38s; }
    .feat-3 { top: 66.2%; animation-delay: 2.56s; }

    /* single soft floor shadow under the settled product */
    .shadow {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(14, 66, 79, 0.20) 0%,
        rgba(14, 66, 79, 0) 70%);
      pointer-events: none;
      opacity: 0;
    }

    .shadow-product {
      top: 76%;
      left: 68.5%;
      width: 505px;
      height: 64px;
      animation: fadeIn 0.5s ease 1.85s forwards;
    }

    /* ── CTA — on screen and pulsing from second zero, like the
       reference. Orange gradient pill, shine sweep. ── */
    .cta-final {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      /* bottom edge 96px off the bottom, matching the logo's top gap */
      top: 90.25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 660px;
      height: 120px;
      background: linear-gradient(135deg, #ffb65d 0%, #f98d2a 55%, #ef7a18 100%);
      box-shadow: 0 16px 38px rgba(249, 141, 42, 0.45);
      font-family: var(--font-body);
      font-size: 2.5rem;
      color: var(--color-cta-text);
      letter-spacing: 0.5px;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      will-change: transform;
      animation: btnWave 2s linear infinite;
      border-radius: 12px;
    }

    .cta-final::after {
      content: "";
      position: absolute;
      top: -20%;
      left: -75%;
      width: 45%;
      height: 140%;
      background: linear-gradient(120deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.65) 50%,
        rgba(255, 255, 255, 0) 100%);
      transform: skewX(-22deg);
      animation: ctaShine 3.4s ease-in-out infinite;
      pointer-events: none;
    }

    .cta-final .cta-arrow { font-weight: 700; }

    /* ══════════════════════════════════════════════════════════
       ANIMATIONS
       ══════════════════════════════════════════════════════════ */

    /* reference: promo text swings in rotated & small, overshoots,
       settles level */
    @keyframes swingIn {
      0%   { opacity: 0; transform: rotate(-24deg) scale(0.45); }
      60%  { opacity: 1; transform: rotate(3deg)  scale(1.05); }
      80%  {            transform: rotate(-1.2deg) scale(0.99); }
      100% { opacity: 1; transform: rotate(0deg)  scale(1); }
    }

    /* reference: the header settles with a much smaller swing */
    @keyframes swingInSoft {
      0%   { opacity: 0; transform: rotate(-6deg) translateY(-26px); }
      70%  { opacity: 1; transform: rotate(1.5deg) translateY(3px); }
      100% { opacity: 1; transform: rotate(0deg) translateY(0); }
    }

    /* the product block drops in and settles — echoes the reference's
       drop-and-bounce, but as one cohesive object (colour changes after) */
    @keyframes productIn {
      0%   { opacity: 0; transform: translate(-50%, -50%) translateY(-46px) scale(0.9); filter: blur(4px); }
      60%  { opacity: 1; transform: translate(-50%, -50%) translateY(8px) scale(1.03); filter: blur(0); }
      80%  {            transform: translate(-50%, -50%) translateY(-4px) scale(0.995); }
      100% { opacity: 1; transform: translate(-50%, -50%) translateY(0) scale(1); filter: blur(0); }
    }

    /* feature lines rush in from the left with motion blur and snap
       into place — same energy as the reference's second fly-in */
    @keyframes featIn {
      0%   { opacity: 0; transform: translateX(-240px); filter: blur(6px); }
      60%  { opacity: 1; transform: translateX(10px);   filter: blur(0); }
      100% { opacity: 1; transform: translateX(0);      filter: blur(0); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateX(-50%) translateY(22px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes glowIn {
      from { opacity: 0; }
      to   { opacity: 0.85; }
    }

    @keyframes uvBreath {
      0%, 100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes btnWave {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    @keyframes ctaShine {
      0% { left: -75%; }
      28% { left: 130%; }
      100% { left: 130%; }
    }

    /* ══════════════════════════════════════════════════════════
       LANDSCAPE ADJUSTMENTS (base 1600×900)
       Product cluster on the LEFT half, copy + CTA on the RIGHT —
       same split as the other TAO builds; same reveal order.
       ══════════════════════════════════════════════════════════ */
    @media (orientation: landscape) {
      .final-screen {
        width: 1600px;
        height: 900px;
      }

      /* floor seam lowered to 74% so the product's base plants ON the
         tinted floor instead of the horizon sitting too high */
      .final-bg {
        background:
          linear-gradient(180deg,
            #ffffff 0%,
            #f4fbfe 52%,
            #e8f6fc 74%,
            #dcf0f9 74.01%,
            #eaf7fc 100%) center / 100% 900px no-repeat,
          linear-gradient(180deg, #ffffff 0 50%, #eaf7fc 50% 100%);
      }

      /* Left column: product lifted to the optical centre of its half
         (top edge ≈ logo top), features breathing under it — no more
         empty top-left / cramped bottom-left corner. */
      .final-glow {
        top: 42%;
        left: 25%;
        width: 660px;
        height: 660px;
      }

      .final-product {
        top: 42%;
        left: 25%;
        width: 728px;
        height: 728px;
      }

      /* single-line labels under the product — no room for two-line stacks */
      .feat br { display: none; }

      .shadow-product {
        top: 76.5%;
        left: 24%;
        width: 430px;
        height: 56px;
      }

      /* feature chips centred under the product; smaller badge, wider steps
         so the 52px discs never touch */
      .feat {
        left: 12%;
        font-size: 2.2rem;
      }

      .feat-icon {
        width: 68px;
        height: 68px;
      }

      .feat-icon img {
        width: 40px;
        height: 40px;
      }

      .feat-1 { top: 71.7%; }
      .feat-2 { top: 82.6%; }
      .feat-3 { top: 93.5%; }

      /* Right column: even vertical rhythm — logo, name, offer, countdown,
         CTA with no dead band between name and offer.
         90px of the 900 base = 10% top and bottom gaps */
      .final-logo-wrap {
        top: 9%;
        left: 72%;
        width: 330px;
      }

      .final-name {
        top: 21%;
        left: 72%;
        width: 700px;
        font-size: 3.4rem;
      }

      .offer-wrap {
        top: 40%;
        left: 72%;
        width: 480px;
      }

      .of-get { font-size: 3.9rem; margin-right: 12px; }
      .of-num { font-size: 8.4rem; }
      .of-pct { font-size: 3.9rem; }
      .of-off { font-size: 2.4rem; }
      .of-date { font-size: 2.1rem; margin-top: 18px; }

      .cta-countdown {
        top: 71%;
        left: 72%;
        width: 600px;
        font-size: 2.7rem;
      }

      .cta-final {
        /* bottom edge 90px off the bottom */
        top: 84%;
        left: 72%;
        width: 620px;
        height: 108px;
        font-size: 2.3rem;
      }
    }

html{background:#7E111C}
body{position:fixed !important;left:0 !important;top:0 !important;width:360px !important;
 height:640px !important;margin:0 !important;transform-origin:0 0;z-index:1}
#bfui{position:fixed;left:0;top:0;width:360px;height:640px;transform-origin:0 0;z-index:2;pointer-events:none}
#bfui>*{pointer-events:auto}
.bfwrapbg{position:fixed;inset:-50vmax;z-index:0;background:
 radial-gradient(120% 60% at 50% 30%,rgba(255,255,255,.06),transparent 60%),#7E111C;pointer-events:none}
/* black Black Friday bar */
.bfbar{position:absolute;left:0;right:0;top:0;height:72px;z-index:40;background:#0A0A0A;color:#F6F1E7;
 padding:9px 10px 0;text-align:center;overflow:hidden;border-bottom:2px solid #C8202F}
.bfbar>div{position:relative;z-index:1}
.bfbar .r1{display:flex;align-items:center;justify-content:center}
.bfbar .bf{font-family:"BFPlayfair",Georgia,serif;font-style:italic;font-weight:700;font-size:18px;line-height:1;letter-spacing:-.005em}
.bfbar .ea{font:400 8.5px/1 "BFOutfit",sans-serif;letter-spacing:.18em;color:#ADC8BE;
 border-left:1px solid rgba(246,241,231,.35);padding:4px 0 4px 9px;margin-left:9px}
.bfbar .r2{font:400 11px/1 "BFOutfit",sans-serif;margin-top:6px;white-space:nowrap}
.bfbar .r3{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:5px}
.bfbar .ends{font:400 8px/1 "BFOutfit",sans-serif;letter-spacing:.17em;color:#ADC8BE}
.bfbar .r2 em{font-style:normal;font-weight:700;color:#EB9678}
.bfbar .r2 strong{font-weight:700;color:#D8A657}
.bfbar .tm{display:flex;align-items:center;gap:2px}
.bfbar .tm .u{display:flex;align-items:baseline;gap:2px;background:#262626;border:1px solid rgba(246,241,231,.18);
 border-radius:5px;padding:3px 5px 2px}
.bfbar .tm b{font:400 12px/1 "BFNum",sans-serif;font-variant-numeric:tabular-nums;min-width:15px;text-align:center;color:#fff}
.bfbar .tm i{font:400 6.5px/1 "BFOutfit",sans-serif;letter-spacing:.08em;color:#ADC8BE;font-style:normal}
.bfbar .tm .c{font:400 12px/1 "BFNum";color:#ADC8BE}
.snow{position:absolute;inset:0;z-index:0;pointer-events:none}
.snow i{position:absolute;top:-8px;border-radius:50%;background:#fff;opacity:.5;animation:bfsnw linear infinite}
@keyframes bfsnw{to{transform:translate(var(--sx),72px)}}
/* ribbon frame around the creative */
.bfframe{position:absolute;left:29px;top:72px;width:302px;height:538px;z-index:30;pointer-events:none;
 border:3px solid #C8202F;box-shadow:0 0 0 1px rgba(216,166,87,.75),0 10px 26px rgba(0,0,0,.4)}
.bfframe:before,.bfframe:after{content:"";position:absolute;background:#C8202F}
.bfframe:before{left:50%;top:-3px;bottom:-3px;width:0}
.bfribbon{position:absolute;left:0;right:0;top:72px;height:0px;z-index:28;pointer-events:none;
 background:repeating-linear-gradient(135deg,#C8202F 0 9px,#7E111C 9px 18px);opacity:.9}
.bfribbon.bot{top:auto;bottom:0;height:30px}
/* bow */
.bow{position:absolute;left:275px;top:52px;width:70px;z-index:44;cursor:pointer;
 filter:drop-shadow(0 4px 9px rgba(0,0,0,.45));transition:transform .45s cubic-bezier(.3,1.5,.4,1)}
.bow svg{width:100%;height:auto;display:block}
.bow:after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid #D8A657;opacity:.5;
 animation:bfring 2.1s ease-out infinite}
@keyframes bfring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.18);opacity:0}}
html.done .bow{transform:scale(.82) rotate(-9deg)}
html.done .bow:after{display:none}
/* the gift tag that the bow reveals */
.tag{position:absolute;left:50%;top:613px;transform:translate(-50%,10px) scale(.92);z-index:46;
 display:inline-flex;align-items:baseline;gap:7px;background:#F6F1E7;color:#0A0A0A;border:1.5px solid #C8202F;
 border-radius:999px;padding:5px 13px 4px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.45);opacity:0;
 pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.3,1.4,.4,1)}
html.done .tag{opacity:1;transform:translate(-50%,0) scale(1)}
.tag b{font:400 13px/1 "BFPlayfair",Georgia,serif;font-style:italic;color:#C8202F}
.tag span{font:400 7.5px/1 "BFOutfit",sans-serif;letter-spacing:.15em;text-transform:uppercase}
/* hint chip */
.bfchip{position:absolute;left:50%;transform:translateX(-50%);top:614px;z-index:45;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 12px 0 10px;border-radius:999px;
 background:#0A0A0A;color:#F6F1E7;border:1px solid #D8A657;
 font:400 9px/1 "BFOutfit",sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
 animation:bfchip 1.9s ease-in-out infinite;transition:opacity .3s}
@keyframes bfchip{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.04)}}
html.done .bfchip{opacity:0;animation:none}
/* interaction layers */
#bfshield{position:absolute;left:0;right:0;top:72px;bottom:0;z-index:20}
#cta{position:absolute;z-index:42;cursor:pointer;background:transparent}
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:41;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
html.done .bow{pointer-events:none}
.bfcf{position:absolute;z-index:60;width:7px;height:7px;pointer-events:none;
 animation:bfcf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes bfcf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}

  <script>
    document.addEventListener('dragstart', (e) => e.preventDefault());

    window.addEventListener("load", () => {
      const loadings = document.querySelector(".loadings");
      setTimeout(() => loadings.remove(), 200);
    });

    function scaleContainer() {
      const container = document.querySelector(".container");
      if (!container) return;

      if (window.innerWidth <= window.innerHeight) {
        const baseWidth = 900;
        const baseHeight = 1600;
        const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
        container.style.position = "absolute";
        container.style.left = "50%";
        container.style.top = "50%";
        container.style.transform = `translate(-50%, -50%) scale(${scale})`;
        container.style.width = `${baseWidth}px`;
        container.style.height = `${baseHeight}px`;
      }
    }

    function responsiveLandscapeContainer() {
      const container = document.querySelector(".container");
      if (!container || window.innerWidth <= window.innerHeight) return;

      const baseWidth = 1600;
      const baseHeight = 900;
      const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);

      container.style.transform = `translate(-50%, -50%) scale(${scale})`;
      container.style.width = `${baseWidth}px`;
      container.style.height = `${baseHeight}px`;
      container.style.position = "fixed";
      container.style.left = "50%";
      container.style.top = "50%";
    }

    window.addEventListener("load", () => {
      scaleContainer();
      responsiveLandscapeContainer();
    });
    window.addEventListener("resize", () => {
      scaleContainer();
      responsiveLandscapeContainer();
    });
  </script>

  <!-- ══ COLOURWAY CAROUSEL ══
       The incoming shot fades in ON TOP of the outgoing one, which is only
       hidden once fully covered — cross-fading both at once would dip the
       combined alpha and let the backdrop show through the product. Starts
       after the block has settled (~2.4s) so the two don't compete. -->
  <script>
    (function () {
      var HOLD_MS = 2200;   // time each colourway stays up
      var FADE_MS = 700;    // must match the .pshot opacity transition
      var START_MS = 2600;  // after productIn settles (1.3s + 0.72s)

      var shots = [].slice.call(document.querySelectorAll('.final-product .pshot'));
      if (shots.length < 2) return;

      var i = 0, z = 1;
      function step() {
        var cur = shots[i];
        i = (i + 1) % shots.length;
        var next = shots[i];
        next.style.zIndex = ++z;
        next.classList.add('on');
        setTimeout(function () { cur.classList.remove('on'); }, FADE_MS);
      }
      setTimeout(function () { step(); setInterval(step, HOLD_MS); }, START_MS);
    })();
  </script>

  <!-- Dynamic "today" date — English with correct ordinal (e.g. July 22nd) -->
  <script>
    (function () {
      function englishToday() {
        var months = ['January','February','March','April','May','June','July','August',
                      'September','October','November','December'];
        var d = new Date();
        var n = d.getDate();
        var v = n % 100;
        var suffix = (v >= 11 && v <= 13) ? 'th'
          : (n % 10 === 1) ? 'st'
          : (n % 10 === 2) ? 'nd'
          : (n % 10 === 3) ? 'rd' : 'th';
        return months[d.getMonth()] + ' ' + n + suffix;
      }
      var label = englishToday();
      ['reward-date'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.textContent = label;
      });
    })();
  </script>

  <script>
    (function () {
      var el = document.getElementById('countdown-time');
      if (!el) return;
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function tick() {
        var now = new Date();
        var midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
        var ms = midnight - now;
        if (ms < 0) ms = 0;
        var totalSec = Math.floor(ms / 1000);
        var h = Math.floor(totalSec / 3600);
        var m = Math.floor((totalSec % 3600) / 60);
        var s = totalSec % 60;
        el.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
