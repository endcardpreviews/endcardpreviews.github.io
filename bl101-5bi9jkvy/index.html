<title>BL101 — Endcard Style Frames</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F7F7F7;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1D1D1B}
header{padding:26px 24px 10px;text-align:center}
h1{font-family:'Times New Roman',Georgia,serif;font-weight:400;font-size:34px}
.sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#E22120;margin-top:4px}
.ctrl{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px}
.ctrl input{font:inherit;padding:5px 8px;border:1px solid #B7B1A2;border-radius:8px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:26px;padding:24px;max-width:1240px;margin:0 auto}
.cell{text-align:center}
.ph{position:relative;width:100%;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 14px 34px rgba(0,0,0,.18);border:6px solid #1D1D1B}
.ph iframe{width:100%;height:100%;border:0}
.ph .open{position:absolute;inset:0;cursor:pointer}
.lab{margin-top:10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.lab b{color:#E22120}
.ov{position:fixed;inset:0;background:rgba(20,20,18,.96);display:none;z-index:50;align-items:center;justify-content:center}
.ov.on{display:flex}
.ov .frame{height:min(94vh,100%);aspect-ratio:9/16;max-width:94vw;border-radius:18px;overflow:hidden;background:#000}
.ov iframe{width:100%;height:100%;border:0}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:#EDEAE3;border:0;font-size:22px;cursor:pointer;z-index:52}
.nav.l{left:12px}.nav.r{right:12px}
.ov .top{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:14px;align-items:center;color:#EDEAE3;font-size:13px;letter-spacing:.08em;text-transform:uppercase;z-index:52}
.ov .x{position:fixed;top:10px;right:14px;width:38px;height:38px;border-radius:50%;background:#EDEAE3;border:0;font-size:17px;cursor:pointer;z-index:53}
@media(max-width:720px){.grid{grid-template-columns:1fr;gap:14px;padding:14px}}
</style></head>

var grid=document.getElementById('grid');
function build(){grid.innerHTML='';
 ITEMS.forEach(function(it,i){
  var c=document.createElement('div');c.className='cell';
  c.innerHTML='<div class="ph"><iframe loading="lazy" src="'+it.f+q()+'"></iframe><div class="open" onclick="openOv('+i+')"></div></div>'+
   '<div class="lab"><b>'+(i+1)+'</b> · '+it.n+'</div>';
  grid.appendChild(c);
 });}
var cur=0,ov=document.getElementById('ov'),ovf=document.getElementById('ovf'),ttl=document.getElementById('ttl');
function openOv(i){cur=i;ov.classList.add('on');load();history.replaceState(null,'','#'+(i+1));}
function load(){ovf.src=ITEMS[cur].f+q();ttl.textContent=(cur+1)+' / '+ITEMS.length+' — '+ITEMS[cur].n;}
function closeOv(){ov.classList.remove('on');ovf.src='';history.replaceState(null,'','#');}
function step(d){cur=(cur+d+ITEMS.length)%ITEMS.length;load();history.replaceState(null,'','#'+(cur+1));}
pd.addEventListener('change',function(){build();if(ov.classList.contains('on'))load();});
build();
var h=parseInt((location.hash||'').replace('#',''));
if(h>=1&&h<=ITEMS.length)openOv(h-1);
else if(window.innerWidth<720)openOv(0);
document.addEventListener('keydown',function(e){if(!ov.classList.contains('on'))return;
 if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='Escape')closeOv();});
</script>
</body></html>
