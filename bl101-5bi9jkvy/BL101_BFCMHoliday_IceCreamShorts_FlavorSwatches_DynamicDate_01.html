*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff}
body{font-family:'Good Pro',Helvetica,Arial,sans-serif;font-weight:400;color:#000;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none}
#card{--u:calc(min(100vw,100vh*9/16)/390);position:relative;height:100%;width:100%;max-width:calc(100vh*9/16);margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;display:flex;flex-direction:column}
.u{font-size:calc(16*var(--u))}
#hd{flex:none;height:calc(54*var(--u));display:flex;align-items:center;justify-content:center;background:#fff}
#hd img{display:block;height:calc(30*var(--u));width:calc(170*var(--u))}
#bar{flex:none;height:calc(31*var(--u));background:#E22120;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:max(10px,calc(16*var(--u)));letter-spacing:0;white-space:nowrap;line-height:1}
#bar span{display:block;padding-top:calc(2*var(--u))}
.art{flex:none;width:100%;display:block;background:#555 center/cover no-repeat}
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 calc(24*var(--u))}
#ft{flex:none;display:flex;flex-direction:column;align-items:center;padding:0 calc(24*var(--u)) calc(18*var(--u))}
#hint{position:relative;z-index:45;pointer-events:none;background:#1A1A1A;color:#fff;border-radius:64px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:max(9px,calc(12*var(--u)));line-height:1;padding:calc(7*var(--u)) calc(13*var(--u)) calc(5*var(--u));margin-bottom:calc(10*var(--u));white-space:nowrap}
#cta{position:relative;z-index:40;display:block;width:100%;height:calc(52*var(--u));background:#E22120;color:#fff;border-radius:0;font-weight:400;font-size:max(12px,calc(16*var(--u)));letter-spacing:0;cursor:pointer}
html.done #cta{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
#hit{position:absolute;left:0;right:0;bottom:0;height:66.7%;z-index:30;pointer-events:none}
html.done #hit{pointer-events:auto} html.done .lock{pointer-events:none}
/* site product card */
.pc{width:100%}
.tile{position:relative;background:#F7F7F7;border-radius:8px;overflow:hidden}
.tile img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
img{pointer-events:none;-webkit-user-drag:none;user-drag:none}
.youth{position:absolute;left:calc(8*var(--u));top:calc(8*var(--u));z-index:3;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:max(9px,calc(16*var(--u)));color:#0a0a0a;line-height:1}
.off{position:absolute;left:calc(8*var(--u));bottom:calc(8*var(--u));z-index:3;background:#E22120;color:#fff;border-radius:64px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:max(9px,calc(10.8*var(--u)));line-height:1;padding:calc(4*var(--u)) calc(8*var(--u)) calc(2.4*var(--u))}
.info{padding-top:calc(10*var(--u));text-align:left}
.ttl{font-weight:500;color:rgba(0,0,0,.81);font-size:max(10px,calc(16*var(--u)));line-height:1.25;white-space:nowrap}
