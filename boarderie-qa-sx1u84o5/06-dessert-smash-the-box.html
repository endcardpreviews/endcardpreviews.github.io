:root {
  /* boarderie.com, sampled 2026-11-10 */
  --bd-ground: #FFFFFF;
  --bd-ink: #262626;          /* headlines and body */
  --bd-muted: #5C5C5C;
  --bd-green: #01472A;        /* the star fill and the arched top bar */
  --bd-lime: #B3E771;         /* ADD TO CART / VIEW SIZES fill */
  --bd-lime-press: #A2D95E;
  --bd-cream: #F3DFB9;        /* the "Delivery as soon as" band */
  --bd-lilac: #D5B4FF;        /* the "NEW BOARD!" pill */
  --bd-line: #E6E1D8;
  --bd-panel: #FBF7EF;

  --u: min(1vw, 0.56vh);
  --gutter: max(16px, calc(var(--u) * 6));
  --gap: max(6px, calc(var(--u) * 2.4));
  --pad-top: max(12px, calc(var(--u) * 3.2));
  --pad-bottom: max(34px, calc(var(--u) * 6.4));

  --s-display: clamp(22px, calc(var(--u) * 7.6), 42px);
  --s-cta: clamp(13px, calc(var(--u) * 3.9), 19px);
  --s-price: clamp(19px, calc(var(--u) * 6.2), 32px);
  --s-hint: clamp(12px, calc(var(--u) * 3.5), 18px);
  --s-small: clamp(10px, calc(var(--u) * 2.9), 14px);
  --cta-h: clamp(46px, calc(var(--u) * 12.5), 62px);
  --cta-w: min(100%, 440px);

  --serif: "Canela", Georgia, serif;
  --font: "Diatype", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (orientation: landscape) {
  :root { --u: min(0.56vw, 1vh); --pad-top: max(12px, calc(var(--u) * 3)); --gutter: max(16px, calc(var(--u) * 5)); --pad-bottom: max(34px, calc(var(--u) * 5.6)); }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bd-ground); }
body { color: var(--bd-ink); font: 400 16px/1.25 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { -webkit-user-drag: none; user-select: none; }

/* ---------- the card: arch → logo → band → head → stage → deal → trust → foot ---------- */
.card {
  position: relative; z-index: 0; overflow: hidden; overflow: clip;
  width: 100%; height: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto auto minmax(0, 1fr) auto auto auto;
  grid-template-areas: "arch" "top" "bf" "head" "stage" "deal" "press" "foot";
  padding: 0 var(--gutter) var(--pad-bottom);
  text-align: center; background: var(--bd-ground);
}
@media (orientation: landscape) {
  .card {
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto auto auto auto minmax(0, 1fr);
    grid-template-areas: "arch arch" "bf bf" "stage ." "stage top" "stage head" "stage deal" "stage press" "stage foot" "stage .";
    column-gap: calc(var(--gutter) * 1.1);
  }
}
.rs-top { grid-area: top; position: relative; z-index: 3; display: flex; justify-content: center; min-width: 0; padding-top: calc(var(--gap) * 1.1); }
.head { grid-area: head; position: relative; z-index: 2; min-width: 0; display: flex; flex-direction: column; align-items: center; padding-top: var(--gap); }
.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; margin: var(--gap) 0; }
.rs-deal { grid-area: deal; position: relative; z-index: 2; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) * 0.4); padding-top: calc(var(--gap) * 0.5); }
.rs-press { grid-area: press; position: relative; z-index: 2; min-width: 0; }
.foot { grid-area: foot; position: relative; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: calc(var(--gap) * 0.6); min-width: 0; padding-top: var(--gap); }
@media (orientation: landscape) { .stage { margin: var(--gap) 0 0; } }
.stage img { pointer-events: none; -webkit-user-drag: none; }
.hit { position: absolute; inset: 0; z-index: 3; }
.rs-nb { white-space: nowrap; }

/* ---------- the site's arched green top bar ---------- */
.bd-arch { grid-area: arch; position: relative; z-index: 3; margin: 0 calc(-1 * var(--gutter)); height: clamp(26px, calc(var(--u) * 8.4), 44px); display: flex; align-items: flex-start; justify-content: center; }
.bd-arch svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bd-arch span { position: relative; padding-top: 0.55em; font: 400 calc(var(--s-small) * 1.02)/1 var(--font); letter-spacing: -0.01em; color: #fff; white-space: nowrap; }

/* ---------- logo: the BOARDERIE wordmark ---------- */
.rs-logo { display: block; height: clamp(17px, calc(var(--u) * 5.2), 30px); width: auto; aspect-ratio: 900 / 136; }

/* ---------- the cream delivery band (the collection page's "Delivery as soon as …"), Thanksgiving countdown ---------- */
.rs-bf { grid-area: bf; position: relative; z-index: 3; margin: calc(var(--gap) * 1.1) calc(-1 * var(--gutter)) 0; padding: calc(var(--gap) * 0.85) var(--gutter); background: var(--bd-cream); display: flex; align-items: center; justify-content: center; gap: 0.55em; font: 400 calc(var(--s-small) * 1.12)/1.15 var(--font); color: var(--bd-ink); }
.rs-bf svg { width: 1.45em; height: 1.45em; flex: none; }
.rs-bf b { font-weight: 700; }
@media (orientation: landscape) { .rs-bf { margin-top: 0; padding: calc(var(--gap) * 0.6) max(60px, var(--gutter)); } .rs-top { padding-top: var(--gap); } }

/* ---------- headlines: Canela Light, the site's tight tracking ---------- */
.headline { font: 300 var(--s-display)/1.06 var(--serif); color: var(--bd-ink); letter-spacing: -0.02em; text-wrap: balance; }
.headline em { font-style: italic; }
.sub { font: 400 clamp(11px, calc(var(--u) * 3.4), 17px)/1.3 var(--font); color: var(--bd-muted); text-wrap: balance; max-width: 30em; letter-spacing: -0.01em; }
.eyebrow { font: 700 calc(var(--s-small) * 0.9)/1 var(--font); letter-spacing: 0.15em; text-transform: uppercase; color: var(--bd-ink); }

/* ---------- the offer ---------- */
.rs-offer { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 0.45em; row-gap: 0.15em; font: 400 var(--s-small)/1.1 var(--font); }
.rs-price { font: 700 var(--s-price)/1 var(--font); letter-spacing: -0.02em; color: rgba(38,38,38,.9); }
.rs-free { font: 700 calc(var(--s-small) * 1.1)/1.1 var(--font); color: var(--bd-green); white-space: nowrap; }
.rs-rating { display: inline-flex; align-items: center; gap: 0.45em; font: 400 var(--s-small)/1.1 var(--font); color: var(--bd-ink); white-space: nowrap; }
.rs-stars { height: 1.1em; width: auto; aspect-ratio: 120 / 22; flex: none; }

/* ---------- the trust strip: the product page's four promises ---------- */
.rs-press { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; column-gap: 0.9em; row-gap: 0.3em; padding-top: calc(var(--gap) * 0.7); font: 400 calc(var(--s-small) * 0.92)/1 var(--font); color: var(--bd-muted); }
.rs-press span { display: inline-flex; align-items: center; gap: 0.3em; white-space: nowrap; }
.rs-press svg { width: 1.15em; height: 1.15em; flex: none; color: var(--bd-green); }

/* ---------- foot: the lime CTA ---------- */
.cta {
  position: relative; z-index: 4;
  width: var(--cta-w); height: var(--cta-h); min-height: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.55em;
  border-radius: 16px; background: var(--bd-lime); color: var(--bd-ink);
  font: 700 var(--s-cta)/1 var(--font); letter-spacing: 0.15em; text-transform: uppercase;
  transition: background-color .15s ease, scale .2s ease;
}
.cta-label { display: inline-block; pointer-events: none; white-space: nowrap; }
.cta:active { background: var(--bd-lime-press); scale: 0.985; }
.cta.is-nudge { animation: cta-nudge 0.9s ease-in-out 2; }
@keyframes cta-nudge { 0%, 100% { scale: 1; } 50% { scale: 1.035; } }
.rs-guarantee { display: inline-flex; align-items: center; gap: 0.35em; font: 400 var(--s-small)/1 var(--font); color: var(--bd-muted); white-space: nowrap; }
.rs-guarantee svg { width: 1.2em; height: 1.2em; color: var(--bd-green); }

/* ---------- pills ---------- */
.bd-new { display: inline-flex; align-items: center; padding: 0.5em 0.8em 0.45em; border-radius: 8px; background: var(--bd-lilac); color: var(--bd-ink); font: 700 calc(var(--s-small) * 0.85)/1 var(--font); letter-spacing: 0.15em; text-transform: uppercase; white-space: nowrap; }

/* ---------- the review card (the site's widget: green stars, date, body, NAME · VERIFIED BUYER) ---------- */
.rv-card { position: relative; display: flex; flex-direction: column; gap: 0.6em; padding: 1.05em 1.15em 1em; border-radius: 16px; background: #fff; border: 1px solid var(--bd-line); box-shadow: 0 10px 26px rgba(38, 38, 38, .10); text-align: left; font-size: clamp(11px, calc(var(--u) * 3.3), 16px); }
.rv-top { display: flex; align-items: center; justify-content: space-between; gap: 0.6em; }
.rv-top svg { height: 1em; width: auto; aspect-ratio: 120 / 22; }
.rv-date { font: 400 0.8em/1 var(--font); color: var(--bd-muted); white-space: nowrap; }
.rv-b { font: 400 1em/1.45 var(--font); color: var(--bd-ink); letter-spacing: -0.01em; }
.rv-b.is-short { font: 300 1.5em/1.15 var(--serif); letter-spacing: -0.02em; }
.rv-meta { display: flex; align-items: center; gap: 0.7em; padding-top: 0.65em; border-top: 1px solid #EFEBE4; }
.rv-name { font: 700 0.8em/1 var(--font); letter-spacing: 0.12em; text-transform: uppercase; color: var(--bd-ink); white-space: nowrap; }
.rv-ver { display: inline-flex; align-items: center; gap: 0.3em; padding: 0.35em 0.55em; border-radius: 6px; background: #EEF8E1; color: var(--bd-green); font: 700 0.68em/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.rv-ver svg { width: 1.1em; height: 1.1em; }
.rv-prod { font: 400 0.78em/1.2 var(--font); color: var(--bd-muted); }

/* ---------- hint chip and tap hand ---------- */
.hint {
  position: absolute; z-index: 6; display: inline-flex; align-items: center;
  height: max(30px, calc(var(--s-hint) * 2.2)); padding: 0 1em; border-radius: 999px;
  background: var(--bd-green); color: #fff;
  font: 700 var(--s-hint)/1 var(--font); white-space: nowrap; pointer-events: none; letter-spacing: -0.01em;
  transition: opacity .2s ease;
}
.hint.is-off { opacity: 0; }
.hand {
  position: absolute; z-index: 7; pointer-events: none;
  width: var(--hand-w, calc(var(--cta-h) * 0.85)); aspect-ratio: 90 / 122;
  translate: -38% -3%; transform-origin: 38% 3%;
  transition: left .45s cubic-bezier(.3,.7,.2,1), top .45s cubic-bezier(.3,.7,.2,1), opacity .2s ease, rotate .3s ease;
}
.hand img { width: 100%; height: 100%; display: block; }
.hand.is-tapping { animation: hand-tap 1.1s ease-in-out infinite; }
.hand.is-off { opacity: 0; }
.hand.is-jump { transition: opacity .2s ease; }
.hand[data-pose="down"] { rotate: 180deg; }
.hand[data-pose="left"] { rotate: -90deg; }
.hand[data-pose="right"] { rotate: 90deg; }
.hand[data-pose="up-left"] { rotate: -35deg; }
.hand[data-pose="up-right"] { rotate: 35deg; }
@keyframes hand-tap { 0%, 100% { transform: scale(1); } 45% { transform: scale(0.86); } 60% { transform: scale(0.9); } }
.hand.on-cta { rotate: -90deg; }

html.is-hidden *, html.is-hidden *::before, html.is-hidden *::after { animation-play-state: paused !important; }

@media (orientation: portrait) and (max-height: 640px) { .rs-rating { display: none; } }
@media (orientation: portrait) and (max-height: 560px) { .rs-press { display: none; } }
@media (orientation: landscape) and (max-height: 420px) { .rs-rating { display: none; } }
@media (orientation: landscape) and (max-height: 360px) { .rs-press { display: none; } }
@media (orientation: landscape) and (max-height: 320px) { .rs-guarantee { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: 1ms !important; transition-delay: 0s !important; }
  .hand.is-tapping { animation: none; }
}

<script>/* ECG runtime — MRAID 2.0 bootstrap and AppLovin playable-spec plumbing for every end card.
 * Inlined by scripts/build.mjs wherever a page has a script tag with src="ecg:runtime".
 *
 *   ECG.init({ fallbackUrl, firstTapRedirect: true, audio: true, volume: 0.3 })
 *   ECG.onReady(fn(env))            once, after mraid 'ready' (or window load without MRAID)
 *   ECG.onFirstInteraction(fn(e))   once, on the first pointer/touch/key gesture
 *   ECG.onResize(fn(env))           sizeChange / resize / orientation
 *   ECG.onVisibility(fn(visible))   viewableChange / visibilitychange
 *   ECG.bindCta(el, { onEngage })   CTA tap → ECG.open(). With firstTapRedirect: false (strict playable
 *                                   placements) the session's first gesture only engages (onEngage).
 *   ECG.open()                      click-through, resolved like the platform's own templates:
 *                                   mraid.open(clickTag) when the platform injected one, else mraid.open()
 *                                   so the campaign / creative set's click URL applies. Debounced.
 *   ECG.after(ms, fn) / ECG.every(ms, fn)   timers that only start after the first interaction; an `after`
 *                                   that comes due while hidden runs when the ad is shown again
 *                                   (`every` skips hidden ticks)
 *   ECG.audio.play(fn(ctx, out))    WebAudio, unlocked by the first gesture, suspended when hidden
 *   ECG.webgl(canvas, onLost)       WebGL context or null; onLost fires on context loss
 *   ECG.state                       read by scripts/validate.mjs
 */

  'use strict';
  if (w.ECG) return;
