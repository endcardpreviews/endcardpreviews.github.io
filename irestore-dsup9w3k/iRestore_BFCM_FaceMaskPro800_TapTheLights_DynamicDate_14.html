:root{--stage:#FFFFFF;--band:#FFFFFF;--ink:#1E1E1E;--mute:#4E5357;--bar:#F23440;
            --logoink:#1E1E1E;--presink:#1E1E1E;--chipbg:#EFEBF7;--accent:#58468B;--tint:#E5DFF2}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:var(--band);
 font-family:'Apercu Pro',-apple-system,Helvetica,Arial,sans-serif;color:var(--ink);
 -webkit-font-smoothing:antialiased;user-select:none}
#card{position:relative;width:360px;height:640px;flex:0 0 auto;overflow:hidden;
 background:var(--stage);transform-origin:50% 50%;display:flex;flex-direction:column}
.wm{display:block}
/* ---- head + offer banner ---- */
#head{flex:0 0 auto;padding:12px 0 9px;text-align:center;background:var(--stage);color:var(--logoink)}
#head .wm{margin:0 auto}
#banner{flex:0 0 auto;background:var(--bar);color:#fff;text-align:center;padding:9px 12px 10px}
#offer{font-weight:700;line-height:.9;letter-spacing:-.035em;font-size:46px;margin:0}
#dateline{font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:normal;margin-top:8px;}#dateline .dlab{font-size:15px;font-weight:700;letter-spacing:.09em;line-height:1}#dateline .dsub{font-weight:500;font-size:12.5px;letter-spacing:.01em;line-height:1.25;opacity:.92}#dateline .dstamp{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.85}
#dateline b{font-weight:700;font-variant-numeric:tabular-nums}
/* ---- stage ---- */
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
 align-items:center;justify-content:flex-start;padding:10px 16px 0}
.ttl{font-size:16px;font-weight:700;line-height:1.14;letter-spacing:-.01em;text-align:center;margin:0 0 2px}
.sub{font-size:11px;font-weight:400;line-height:1.3;letter-spacing:.01em;color:var(--mute);
 text-align:center;margin:0}
/* ---- press row ---- */
.press{flex:0 0 auto;text-align:center;padding:6px 10px 4px;background:var(--stage)}
.pseen{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);
 margin-bottom:5px}
.prow{display:flex;align-items:center;justify-content:center;gap:11px;color:var(--presink);opacity:.78}
.pm{display:flex;align-items:center}
.pl{display:block}
/* ---- hint + cta ---- */
#hintrow{flex:0 0 auto;height:24px;display:flex;align-items:center;justify-content:center;
 background:var(--stage)}
#hint{font-size:10px;font-weight:500;letter-spacing:.085em;text-transform:uppercase;
 color:var(--mute);background:var(--chipbg);border-radius:999px;padding:4px 11px;line-height:1;
 white-space:nowrap}
#ctarow{flex:0 0 auto;padding:4px 16px 16px;background:var(--stage)}
#cta{position:relative;z-index:6;display:block;width:100%;border:0;cursor:pointer;
 background:var(--bar);color:#fff;font-family:inherit;font-size:14px;font-weight:700;
 letter-spacing:.13em;text-transform:uppercase;padding:14px 10px;border-radius:999px;line-height:1}
#hit{position:absolute;left:0;right:0;top:34%;bottom:0;z-index:5;pointer-events:none;background:transparent}
html.done #hit{pointer-events:auto}
html.done .ia{pointer-events:none!important}


#stage{padding:8px 14px 0}
#hero{position:relative;width:100%;height:196px;margin-top:2px}
#glow{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;
 border-radius:50%;background:radial-gradient(circle,rgba(88,70,139,.22) 0%,rgba(88,70,139,0) 68%);
 transition:transform .5s ease,opacity .5s ease;opacity:.5}
#hero img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:194px;
 width:auto;height:auto;display:block}
.dot{position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(88,70,139,.14);
 border:2px solid #58468B;cursor:pointer;z-index:4;display:flex;align-items:center;
 justify-content:center;transition:transform .2s ease,background .2s ease}
.dot:after{content:'';width:8px;height:8px;border-radius:50%;background:#58468B;
 animation:pulse 1.5s ease-in-out infinite}
.dot.on{background:#58468B;border-color:#58468B;transform:scale(.86)}
.dot.on:after{background:#fff;animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
#d1{left:106px;top:48px}#d2{left:50%;margin-left:-15px;top:152px}#d3{right:106px;top:48px}
#specs{width:100%;margin-top:9px;display:flex;flex-direction:column;gap:6px}
.spec{display:flex;align-items:center;gap:9px;background:#F6F4FA;border-radius:9px;
 padding:11px;transition:background .3s ease}
.spec.on{background:var(--tint)}
.spec .n{font-size:20px;font-weight:700;letter-spacing:-.02em;color:#C9C3D9;line-height:1;
 min-width:60px;text-align:center;transition:color .3s ease}
.spec.on .n{color:#58468B}
.spec .t{font-size:11px;font-weight:500;line-height:1.25;letter-spacing:.02em;color:#1E1E1E}

</style>
</head>

<script>
(function(){
  var c = document.getElementById('card');
  function fit(){
    var s = Math.min(window.innerWidth / 360, window.innerHeight / 640);
    c.style.transform = 'scale(' + s + ')';
  }
  fit(); window.addEventListener('resize', fit);
})();
</script>
<script>
(function(){
  var CLICK = "https://www.irestorelaser.com/pages/skin";
  function ecOpen(){
    if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function') {
      try { window.mraid.open(CLICK); } catch (e) {}
      return;
    }
    try { window.open(CLICK, '_blank'); } catch (e) {}
  }
  window.ECG = { open: ecOpen };

  /* ---------- dynamic date: the viewer's own device date drives the campaign line ---------- */
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var DAY = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function now(){
    var m = /[?&]promo-date=(\d{4})-(\d{2})-(\d{2})/.exec(location.search);
    if (m) { var d = new Date(); d.setFullYear(+m[1], +m[2]-1, +m[3]); return d; }
    return new Date();
  }
  function eod(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59); }
  function phase(d){
    var y = d.getFullYear(), mo = d.getMonth(), day = d.getDate();
    if (mo === 10 && day >= 1 && day <= 26) return { label:'BLACK FRIDAY', end:eod(new Date(y,10,27)) };
    if (mo === 10 && day === 27)            return { label:'BLACK FRIDAY', end:eod(new Date(y,10,27)) };
    if (mo === 10 && (day === 28 || day === 29)) return { label:'BLACK FRIDAY', end:eod(new Date(y,10,30)) };
    if (mo === 10 && day === 30)            return { label:'CYBER MONDAY', end:eod(new Date(y,10,30)) };
    if (mo === 11 && day <= 2)              return { label:'LAST CALL',    end:eod(d) };
    return null;
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function paint(){
    var el = document.getElementById('dateline');
    if (!el) return;
    var d = now(), p = phase(d);
    var today = MON[d.getMonth()] + ' ' + d.getDate();
    if (!p) { el.innerHTML = '<b class="dlab">LIMITED TIME OFFER</b>' +
      '<span class="dstamp">' + today + '</span>'; return; }
    /* Emily, 2026-11-23: no countdown. The campaign name, the brand's own sale line,
       and the viewer's own date — nothing ticking. */
    el.innerHTML = '<b class="dlab">' + p.label + '</b>'
                 + '<span class="dsub">Our biggest sale of the year</span>'
                 + '<span class="dstamp">' + today + '</span>';
    /* Emily, 2026-11-23: no countdown — the campaign name, the brand's own sale line
       and the viewer's own date. */
    el.innerHTML = '<b class="dlab">' + p.label + '</b>'
                 + '<span class="dsub">Our biggest sale of the year</span>'
                 + '<span class="dstamp">' + today + '</span>';
  }
  paint();
  setInterval(paint, 1000);

  /* ---------- click areas ---------- */
  var hit = document.getElementById('hit');
  if (hit) hit.addEventListener('click', function(){ ecOpen(); });
  var cta = document.getElementById('cta');
  if (cta) cta.addEventListener('click', function(e){ e.stopPropagation(); ecOpen(); });

  window.ECG.finish = function(){ document.documentElement.classList.add('done'); };

  /* ---------- reveal engine: every option must be completed ---------- */
  window.ECG.reveal = function(opts){
    var els = [].slice.call(document.querySelectorAll('[data-rv]'));
    var left = els.length;
    els.forEach(function(el){
      el.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (el.classList.contains('on')) return;
        el.classList.add('on');
        var t = el.getAttribute('data-rv');
        if (t) { var n = document.getElementById(t); if (n) n.classList.add('on'); }
        left--;
        var card = document.getElementById('card');
        if (card) card.setAttribute('data-step', String(els.length - left));
        if (opts && opts.step) opts.step(els.length - left, els.length);
        if (left === 0) {
          if (opts && opts.done) opts.done();
          window.ECG.finish();
        }
      });
    });
  };

  /* ---------- quiz: one answer tap goes straight to the landing page ---------- */
  window.ECG.quiz = function(){
    var done = false;
    [].slice.call(document.querySelectorAll('[data-ans]')).forEach(function(el){
      el.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (done) return;
        done = true;
        el.classList.add('picked');
        document.documentElement.classList.add('done');
        setTimeout(ecOpen, 380);
      });
    });
  };
})();
</script>
<script>
var G = document.getElementById('glow');
ECG.reveal({ step: function(n, t){
  G.style.opacity = (0.5 + 0.5 * n / t).toFixed(2);
  G.style.transform = 'scale(' + (1 + 0.14 * n / t).toFixed(3) + ')';
} });
</script>
