*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;
  background:linear-gradient(to bottom,#EAE6E1 0,#EAE6E1 50%,#D8D3CE 50%,#D8D3CE 100%);
  font-family:'Apercu Pro',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1C1C1C;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#card{position:absolute;left:50%;top:50%;width:360px;height:640px;overflow:hidden;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%;
  display:flex;flex-direction:column;align-items:center}
#hit{position:absolute;left:0;right:0;top:33.34%;bottom:0;z-index:40;pointer-events:none;background:transparent}
html.done #hit{pointer-events:auto;cursor:pointer}
html.done .play{pointer-events:none!important}
/* ---- offer banner: logo, offer headline, one supporting line ---- */
#bar{width:100%;padding:9px 16px 7px;text-align:center;flex:0 0 auto;position:relative;z-index:30}
#bar .wm{display:block;margin:0 auto 9px}
.offer{display:flex;align-items:baseline;justify-content:center;gap:7px;line-height:1}
.offer .sm{font-weight:700;font-size:13px;letter-spacing:.1em}
.offer .big{font-weight:700;font-size:40px;letter-spacing:-.035em}
.offer .on{font-weight:700;font-size:11.5px;letter-spacing:.09em;max-width:74px;text-align:left;line-height:1.1}
/* Emily, 2026-11-23: "make the Black Friday text + countdown a lot more obvious/bigger."
   The thin supporting sentence becomes a label plus boxed digits. It stays ONE
   supporting element under the offer headline, so the three-things rule still holds.
   Class names are prefixed cd* because .pl is already the AS SEEN ON label. */
#promo{margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;max-width:252px;margin-left:auto;margin-right:auto}
/* Emily, 2026-11-23: "the Black Friday needs to be very obvious. It's written in
   black, and I can barely tell that it's Black Friday." So it is no longer a grey
   line on a cream stage — it is white type on a solid black band. */
#promo .cdlab{display:block;width:100%;font-weight:700;font-size:21px;letter-spacing:.13em;
 line-height:1;text-transform:uppercase;color:#fff;background:#141312;
 padding:7px 10px 8px;border-radius:3px;text-align:center}
#promo .cdsub{font-weight:500;font-size:12.5px;letter-spacing:.01em;line-height:1.25}
#bar.on-red #promo .cdsub,#bar.on-red #promo .cdstamp{opacity:.9}
#bar.on-red #promo .cdlab{background:#111010}
/* ---- stage ---- */
#stage{flex:1 1 auto;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;min-height:0}
h1{margin:0;font-weight:700;letter-spacing:-.022em;line-height:1.08;text-align:center}
.note{font-size:10.5px;line-height:1.35;letter-spacing:.005em}
/* ---- as seen on ---- */
.press{width:100%;padding:0 16px;text-align:center;flex:0 0 auto}
.press .pl{display:block;font-size:9px;font-weight:500;letter-spacing:.17em;opacity:.55;margin-bottom:5px}
.press .pr{display:flex;align-items:center;justify-content:center;gap:12px;opacity:.62}
.press svg{display:block;flex:0 0 auto}
/* ---- hint + cta ---- */
#hint{flex:0 0 auto;font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;margin:0 auto;position:relative;z-index:45;white-space:nowrap}
html.done #hint{opacity:0;transition:opacity .2s}
#cta{position:relative;z-index:50;flex:0 0 auto;display:block;border:0;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:14.5px;letter-spacing:.085em;text-transform:uppercase;
  padding:14px 10px;width:calc(100% - 32px);margin:0 16px 16px;border-radius:6px;text-align:center}

#hint{background:rgba(30,30,30,.07);color:#4E5357}
#cta{background:#F23440;color:#fff}

#card{background:linear-gradient(to bottom,#EAE6E1 0%,#E3DED9 54%,#D8D3CE 100%)}
#bar{color:#1C1C1C}
.offer .big{color:#F23440}
#promo{color:rgba(28,28,28,.72)}
h1{font-size:21.5px;padding:0 22px;margin-top:1px}
.chart{display:flex;justify-content:center;gap:40px;margin-top:3px;align-items:flex-end}
.col{width:100px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.hd{display:block;margin-bottom:5px}
.plot{position:relative;width:58px;height:90px}
.plot:after{content:'';position:absolute;left:-8px;right:-8px;bottom:-2px;height:2px;background:rgba(28,28,28,.34)}
.bar{position:absolute;left:0;bottom:0;width:58px;border-radius:3px 3px 0 0;transform-origin:50% 100%;
  animation:rise .9s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
.col.p .bar{background:#A9A29A}
.col.r .bar{background:#F23440}
.col.hit .bar{animation:rise .55s cubic-bezier(.22,1,.36,1) both}
.pct{position:absolute;left:-21px;right:-21px;text-align:center;font-weight:700;font-size:20px;
  letter-spacing:-.03em;line-height:1}
.col.p .pct{color:#7C7670}
.col.r .pct{color:#F23440}
.lab{font-size:9.5px;font-weight:500;letter-spacing:.11em;margin-top:5px;color:#4E5357;
  text-align:center;line-height:1.25;padding-bottom:4px;border-bottom:2px solid transparent}
.col.on .lab{color:#1C1C1C;font-weight:700;border-bottom-color:#F23440}
.foot{font-size:10px;line-height:1.4;color:rgba(28,28,28,.62);padding:0 18px;margin:8px 0 0;
  text-align:center;min-height:28px}
.model{width:100%;height:172px;margin-top:6px;overflow:hidden;flex:0 0 auto}
.model img{width:100%;height:172px;object-fit:cover;display:block}
#hint{margin-top:8px;margin-bottom:10px}
#cta{background:#fff;color:#F23440;box-shadow:0 1px 0 rgba(28,28,28,.07)}
</style>
</head>

(function(){
  var cols=[].slice.call(document.querySelectorAll('.col')),
      foot=document.getElementById('foot'),
      TXT=["Placebo group: 5.7% average growth over the 4-month study.","iRESTORE system: 43.2% average growth, in a study run by a board-certified dermatologist."], n=0;
  cols.forEach(function(c,i){
    c.addEventListener('click', function(){
      foot.textContent=TXT[i];
      c.classList.remove('hit');
      void c.offsetWidth;
      c.classList.add('hit');
      if(!c.classList.contains('on')){
        c.classList.add('on');
        if(++n===cols.length){ setTimeout(function(){ window.ECG.finish(); }, 420); }
      }
    });
  });
})();
</script>
<div id="hit"></div>
<script>
(function(){
  var D=document, H=D.documentElement;

  /* ---- click-through: MRAID by name, window.open only as a fallback ---- */
  function openLP(){
    try{
      if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function'){
        window.mraid.open(); return;
      }
    }catch(e){}
    try{ window.open(''); }catch(e){}
  }
  window.ECG = { open: openLP };

  /* ---- fit the 360x640 design into whatever box we are given ---- */
  function fit(){
    var w=window.innerWidth||360, h=window.innerHeight||640;
    H.style.setProperty('--s', Math.min(w/360, h/640));
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  /* ---- the viewer's own device date drives the campaign line ---- */
  function baseDate(){
    var m=/promo-date=(\d{4})-(\d{2})-(\d{2})/.exec(location.search);
    if(m){ return new Date(+m[1], +m[2]-1, +m[3], 12, 0, 0); }
    return new Date();
  }
  var DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function stamp(d){ return DAYS[d.getDay()]+' '+MONS[d.getMonth()]+' '+d.getDate(); }
  function pad(n){ return (n<10?'0':'')+n; }
  function span(ms){
    if(ms<0) ms=0;
    var s=Math.floor(ms/1000), d=Math.floor(s/86400); s-=d*86400;
    var h=Math.floor(s/3600); s-=h*3600;
    var m=Math.floor(s/60); s-=m*60;
    return (d>0? d+'D ' : '') + pad(h)+':'+pad(m)+':'+pad(s);
  }
  /* Calendar facts only: Black Friday 2026 = Fri Nov 27, Cyber Monday = Mon Nov 30.
     The countdown runs to those calendar dates, never to an unpublished offer deadline. */
  var BF=new Date(2026,10,27,0,0,0), CM=new Date(2026,10,30,0,0,0);
  function endOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 0, 0, 0); }
  /* Emily asked for the Black Friday line and the countdown to be a lot more obvious,
     so line() hands back its pieces and tick() sets them as real type: a block label
     over boxed digits, instead of one thin sentence. */
  function line(){
    var base=baseDate(), now=new Date(), real=!/promo-date=/.test(location.search);
    var t=real?now:base, y=base.getFullYear(), mo=base.getMonth(), da=base.getDate();
    var onBF = (y===2026&&mo===10&&da===27), onCM=(y===2026&&mo===10&&da===30);
    if(onBF) return {label:'BLACK FRIDAY', ms:endOfDay(base)-t, stamp:stamp(base)};
    if(onCM) return {label:'CYBER MONDAY', ms:endOfDay(base)-t, stamp:stamp(base)};
    if(base<BF && base>=new Date(2026,10,14)) return {label:'BLACK FRIDAY', ms:BF-t, stamp:stamp(base)};
    if(base>BF && base<CM) return {label:'CYBER MONDAY', ms:CM-t, stamp:stamp(base)};
    return {label:'LIMITED TIME OFFER', ms:null, stamp:stamp(base)};
  }
  function tick(){
    var el=D.getElementById('promo'); if(!el) return;
    var L=line();
    /* Client, 2026-11-23: no dynamic date. The block is the campaign name and the
       brand's own sale line only — nothing read off the viewer's clock. */
    el.innerHTML = '<b class="cdlab">BLACK FRIDAY</b>'
                 + '<span class="cdsub">Our biggest sale of the year</span>';
  }
  tick();
  setInterval(tick, 1000);

  /* ---- finished state: the whole bottom 2/3 becomes the click-through ---- */
  var done=false;
  window.ECG.finish=function(){
    if(done) return; done=true;
    H.classList.add('done');
  };
  var hit=D.getElementById('hit');
  if(hit){ hit.addEventListener('click', function(ev){ ev.preventDefault(); openLP(); }); }
  var cta=D.getElementById('cta');
  if(cta){ cta.addEventListener('click', function(ev){ ev.preventDefault(); openLP(); }); }

  /* ---- fonts ---- */
  if(D.fonts && D.fonts.ready){ D.fonts.ready.then(function(){ H.classList.add('fr'); }); }
})();
</script>
