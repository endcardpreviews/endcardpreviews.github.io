<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>BARK — Quiz Endcard Concepts</title>
<style>
:root{--navy:#00356B;--bg:#FBFBFF;--line:rgba(20,37,53,.12);--grey:#657687;--mint:#94FF8C}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:#142535}
header{padding:28px 24px 10px;text-align:center}
header h1{color:var(--navy);font-size:26px}
header p{color:var(--grey);font-size:14px;margin-top:6px}
.grid{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;padding:24px}
.card{text-align:center}
.card .label{font-weight:600;font-size:14px;color:var(--navy);margin-bottom:10px}
.phone{width:300px;height:533px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 28px rgba(0,53,107,.10)}
.phone iframe{width:100%;height:100%;border:0}
.card a{display:inline-block;margin-top:10px;font-size:13px;color:var(--navy)}
#fs{display:none;position:fixed;inset:0;background:#001a33;z-index:50}
#fs iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#fs .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--navy);border:none;font-size:20px;font-weight:700;z-index:51;cursor:pointer}
#fs .prev{left:10px}
#fs .next{right:10px}
#fs .close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--navy);border:none;font-size:18px;z-index:51;cursor:pointer}
#fs .count{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:13px;z-index:51;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.6)}
@media (max-width:700px){.grid{display:none}}
</style>
</head>
<body>
<header>
  <h1>BARK &mdash; Quiz Endcard Concepts</h1>
  <p>Bark Friday funnel &middot; tap an answer to open the landing page &middot; 2026-11-16</p>
</header>
<div class="grid" id="grid"></div>
<div id="fs">
  <span class="count" id="count"></span>
  <iframe id="fsframe" title="concept"></iframe>
  <button class="nav prev" onclick="step(-1)" aria-label="Previous">&#8249;</button>
  <button class="nav next" onclick="step(1)" aria-label="Next">&#8250;</button>
  <button class="close" onclick="closeFS()" aria-label="Close">&#10005;</button>
</div>
<script>
var concepts=[
 ["1. What does your dog like best?","bark_quiz_01_toy_style.html"],
 ["2. How big is your pup?","bark_quiz_02_pup_size.html"],
 ["3. Good girl or good boy?","bark_quiz_03_good_pup.html"],
 ["4. Which recipe would your pup want?","bark_quiz_04_recipe.html"],
 ["5. Toys & Treats… or Only Toys?","bark_quiz_05_assortment.html"]
];
var grid=document.getElementById('grid');
concepts.forEach(function(c,i){
 var d=document.createElement('div');d.className='card';
 d.innerHTML='<div class="label">'+c[0]+'</div><div class="phone"><iframe loading="lazy" src="'+c[1]+'" title="'+c[0]+'"></iframe></div><a href="#'+(i+1)+'" onclick="openFS('+i+');return false;">Open full screen</a>';
 grid.appendChild(d);
});
var cur=0, fs=document.getElementById('fs'), frame=document.getElementById('fsframe'), count=document.getElementById('count');
function openFS(i){cur=(i+concepts.length)%concepts.length;frame.src=concepts[cur][1];count.textContent=concepts[cur][0]+'  ('+(cur+1)+'/'+concepts.length+')';fs.style.display='block';location.hash='#'+(cur+1);}
function step(d){openFS(cur+d);}
function closeFS(){fs.style.display='none';frame.src='about:blank';history.replaceState(null,'',' ');}
function fromHash(){var n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=concepts.length){openFS(n-1);}else if(window.innerWidth<=700){openFS(0);}}
window.addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
</html>
