<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>BARK Quiz — Good Pup</title>
<style>
@font-face{font-family:'GintoNord';font-weight:700;font-display:swap;src:url('https://bark.co/cdn/shop/t/282/assets/ABCGintoNordCondensed-Bold.woff2?v=41580304798531583541776979435') format('woff2')}
@font-face{font-family:'FeltTip';font-weight:700;font-display:swap;src:url('https://bark.co/cdn/shop/t/282/assets/Felt-Tip-Woman-W01-Bold.woff2?v=24041114116366003491776979438') format('woff2')}
@font-face{font-family:'InterB';font-weight:400;font-display:swap;src:url('https://bark.co/cdn/fonts/inter/inter_n4.b2a3f24c19b4de56e8871f609e73ca7f6d2e2bb9.woff2') format('woff2')}
@font-face{font-family:'InterB';font-weight:600;font-display:swap;src:url('https://bark.co/cdn/fonts/inter/inter_n6.771af0474a71b3797eb38f3487d6fb79d43b6877.woff2') format('woff2')}
:root{--navy:#00356B;--ink:#142535;--bg:#FBFBFF;--sky:#C1E8FB;--mint:#94FF8C;--line:rgba(20,37,53,.12);--grey:#657687}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{background:linear-gradient(to bottom,var(--navy) 0 50%,var(--bg) 50% 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'InterB',Inter,Helvetica,Arial,sans-serif}
.stage{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));background:var(--bg);overflow:hidden;container-type:size;user-select:none;-webkit-user-select:none}
.ribbon{position:absolute;top:0;left:0;right:0;height:7.2cqh;background:var(--navy);display:flex;align-items:center;justify-content:center;gap:1.5cqw;z-index:5}
.ribbon .bf{font-family:'FeltTip',cursive;color:var(--mint);font-size:3.4cqh;transform:rotate(-2deg);padding-top:.4cqh}
.logo{position:absolute;top:9.4cqh;left:0;right:0;display:flex;justify-content:center;z-index:4}
.logo img{height:4.4cqh}
.eyebrow{position:absolute;top:15.8cqh;width:100%;text-align:center;font-weight:600;font-size:1.7cqh;letter-spacing:.22em;color:var(--grey);text-transform:uppercase}
h1{position:absolute;top:19cqh;left:5cqw;right:5cqw;text-align:center;font-family:'GintoNord',sans-serif;font-weight:700;color:var(--navy);font-size:5.4cqh;line-height:1.06}
.hero{position:absolute;top:32.5cqh;left:0;right:0;display:flex;justify-content:center}
.hero img{height:28cqh;max-width:90cqw;object-fit:contain}
.opts{position:absolute;top:63cqh;left:8cqw;right:8cqw;display:flex;flex-direction:column;gap:2.2cqh}
.opt{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:99cqh;padding:2.2cqh 4cqw;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.opt .t{font-family:'GintoNord',sans-serif;color:var(--navy);font-size:3.1cqh;line-height:1.1}
.opt.sel{background:var(--sky);border-color:var(--navy);transform:scale(.98)}
.chip{position:absolute;top:84.5cqh;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.chip span{background:#fff;border:1px solid var(--line);color:var(--navy);font-weight:600;font-size:1.9cqh;padding:1cqh 5cqw;border-radius:99cqh;box-shadow:0 .4cqh 1.6cqh rgba(0,53,107,.10);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7cqh)}}
.cta{position:absolute;bottom:3.4cqh;left:8cqw;right:8cqw;height:6.8cqh;background:var(--navy);color:#fff;border:none;border-radius:99cqh;font-family:'InterB',Inter,sans-serif;font-weight:600;font-size:2.4cqh;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;z-index:8}
.sub{position:absolute;bottom:1.1cqh;left:0;right:0;text-align:center;font-size:1.6cqh;color:var(--grey)}
#hit{position:absolute;left:0;top:33.333cqh;width:100%;height:66.667cqh;z-index:7;pointer-events:none;cursor:pointer}
html.done #hit{pointer-events:auto}
html.done .opts{pointer-events:none}
html.done .chip{display:none}
.topbar{position:absolute;top:0;left:0;right:0;height:3.8cqh;background:var(--mint);display:flex;align-items:center;justify-content:center;z-index:6}
.topbar span{font-family:'GintoNord',sans-serif;color:var(--navy);font-size:2.2cqh;letter-spacing:.06em;text-transform:uppercase;animation:tbp 1.8s ease-in-out infinite}
@keyframes tbp{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ribbon{top:3.8cqh;height:5.4cqh}
.ribbon .bf{font-size:3cqh}
.logo{top:9.9cqh}.logo img{height:3.8cqh}
body{background:linear-gradient(to bottom,var(--mint) 0 50%,var(--bg) 50% 100%)}
</style>
</head>
<body>
<div class="stage">
  <div class="topbar"><span>Free Extra Toys Today Only</span></div>
  <div class="ribbon"><span class="bf">Bark Friday!</span></div>
  <div class="logo"><img src="https://bark.co/cdn/shop/files/03BARK_logo_black-p-130x130q80.png?width=260" alt="BARK"></div>
  <div class="eyebrow">The Good Human Quiz</div>
  <h1>Is your pup a good girl or a good&nbsp;boy?</h1>
  <div class="hero"><img src="https://bark.co/cdn/shop/t/282/assets/FEXT-extra-toy-step-image.png?v=182652406996926271571776979435" alt="Dog with BarkBox toys"></div>
  <div class="opts">
    <div class="opt" onclick="pick(this)"><div class="t">She&rsquo;s a good girl</div></div>
    <div class="opt" onclick="pick(this)"><div class="t">He&rsquo;s a good boy</div></div>
  </div>
  <div class="chip"><span>Tap your answer</span></div>
  <div id="hit" onclick="openLP()"></div>
  <button class="cta" onclick="openLP()">Subscribe Now</button>
  <div class="sub">+ Free extra toys for a year on 6 &amp; 12 month plans</div>
</div>
<script>
var LP='https://bark.co/pages/subscription-funnel/barkbox-subscription-funnel-fext-promo-ff';
var done=false;
function openLP(){try{if(window.mraid&&typeof mraid.open==='function'){(typeof clickTag!=='undefined'&&clickTag)?mraid.open(clickTag):mraid.open();}else if(window.ECG&&typeof ECG.open==='function'){ECG.open();}else{window.open(LP,'_blank');}}catch(e){try{window.open(LP,'_blank');}catch(_e){}}}
function pick(el){if(done)return;done=true;el.classList.add('sel');document.documentElement.classList.add('done');setTimeout(openLP,450);}
</script>
</body>
</html>
