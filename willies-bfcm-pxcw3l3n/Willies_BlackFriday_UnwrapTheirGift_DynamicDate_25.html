:root{--navy:#071D49;--cream:#F1E9E5;--red:#660E0D;--ink:#0C0C0C;--gold:#C9A227;
 --line:rgba(7,29,73,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--navy);
 font-family:WG,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* ---------- the Black Friday lockup: the loudest thing on every card ---------- */
.ob{flex:none;position:relative;background:#5E0F12;color:var(--cream);padding:9px 13px 10px;
 overflow:hidden;text-align:center}
.ob:before{content:"";position:absolute;inset:0;
 background:radial-gradient(130% 160% at 50% -30%,rgba(241,233,229,.17),transparent 62%)}
.ob .arch{position:relative;display:block;width:74px;height:auto;margin:0 auto 5px}
.ob .big{position:relative;font-family:WX;font-size:36px;
 line-height:.94;letter-spacing:.005em;text-transform:uppercase;color:var(--cream)}
.ob .big em{display:block;font-style:normal;font-size:23px;letter-spacing:.02em;color:var(--gold)}
.ob .dd{position:relative;margin-top:7px;font-family:WX;font-size:13px;line-height:1.04;
 letter-spacing:.04em;text-transform:uppercase;color:var(--cream)}
.ob .dd span{color:var(--gold)}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.pim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pct{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px}
/* ---------- the site's own hero lockup, used in place of the black banner ---------- */
.oh{flex:none;position:relative;padding:12px 14px 11px;text-align:center;overflow:hidden;background:#5E0F12}
.oh:before{content:"";position:absolute;inset:0;
 background:radial-gradient(130% 160% at 50% -30%,rgba(241,233,229,.16),transparent 62%)}
.oh .lk{position:relative;display:block;width:206px;max-width:74%;height:auto;margin:0 auto}
.oh .ohs{position:relative;margin-top:8px;font-family:WX;font-size:14px;line-height:1.02;letter-spacing:.03em;
 text-transform:uppercase;color:var(--cream)}
.oh .ohd{position:relative;margin-top:6px;font-family:WG;font-size:7px;letter-spacing:.15em;text-transform:uppercase;
 color:rgba(241,233,229,.62)}
/* ---------- press strip ---------- */
.press{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;
 padding:7px 13px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.press img{height:11px;width:auto;opacity:.72;filter:grayscale(1)}
/* ---------- panel ---------- */
.pan{flex:none;padding:11px 15px 13px;text-align:center;background:var(--cream);border-top:1px solid var(--line)}
.ttl{font-family:WX;font-size:21px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;color:var(--navy)}
.ttl em{font-style:normal;color:var(--red)}
.note{margin-top:5px;font-family:WG;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#6B7490}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;gap:8px;
 width:100%;height:46px;margin-top:10px;background:var(--navy);color:var(--cream);font-family:WG;
 font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;overflow:hidden;border-radius:4px}
.cta span{position:relative;z-index:1}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(241,233,229,.26),transparent);animation:sh 3s ease-in-out infinite 1.1s}
@keyframes sh{0%{left:-40%}45%,100%{left:120%}}
.fold .sub2{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1,.4,1),opacity .35s .1s}
html.done .fold .sub2{max-height:170px;opacity:1}
/* ---------- click layer + hint ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 11px 0 9px;border-radius:999px;
 background:var(--navy);color:var(--cream);font-family:WG;font-size:8.5px;letter-spacing:.13em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(7,29,73,.6);
 animation:cp 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:13px;height:13px}
html.done .chip{opacity:0;animation:none}
@keyframes cp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
/* ---------- shared stage furniture ---------- */
.gw{position:absolute;inset:0;display:flex;flex-direction:column}
.hl{flex:none;padding:9px 12px 3px;text-align:center;font-family:WX;font-size:17px;line-height:1.02;
 letter-spacing:.01em;text-transform:uppercase;color:var(--navy)}
.hl em{font-style:normal;color:var(--red)}
.hl.hol{color:var(--red)}.hl.hol em{color:var(--navy)}
.hs{flex:none;padding:0 14px 2px;text-align:center;font-family:WG;font-size:7.5px;letter-spacing:.11em;
 text-transform:uppercase;color:#6B7490}
.dh{flex:none;padding:1px 10px 6px;text-align:center;font-family:WX;font-size:17px;line-height:1;
 text-transform:uppercase;color:var(--navy)}
.big{font-family:WX;font-size:30px;line-height:1;color:var(--navy)}
.big i{font-style:normal;font-size:12px;color:#6B7490}
.pz2{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:5px 0 1px}
.pz2 s{font-family:WG;font-size:10px;letter-spacing:.1em;color:#8A93A8}
.pz2 b{font-family:WX;font-size:27px;line-height:1;color:var(--red)}
.pz2 u{text-decoration:none;padding:2px 7px;border-radius:999px;background:var(--navy);color:var(--cream);
 font-family:WG;font-size:7.5px;letter-spacing:.12em;text-transform:uppercase}

.uw{position:absolute;inset:0;overflow:hidden;background:var(--red)}
.uw .pz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
.uw .pz img{max-width:100%;max-height:100%;object-fit:contain;transform:scale(.86);opacity:0;
 transition:transform .6s cubic-bezier(.25,1.1,.4,1) .12s,opacity .5s .12s}
html.done .uw .pz img{transform:none;opacity:1}
.uw .bx{position:absolute;inset:0;cursor:pointer;touch-action:none}
.uw .hf{position:absolute;left:0;right:0;height:50%;background:
  repeating-linear-gradient(135deg,#7E1413 0 13px,#660E0D 13px 26px);
  box-shadow:inset 0 0 44px rgba(0,0,0,.35);transition:transform .55s cubic-bezier(.4,0,.2,1)}
.uw .hf.t{top:0;border-bottom:2px solid rgba(201,162,39,.55)}
.uw .hf.b{bottom:0;border-top:2px solid rgba(201,162,39,.55)}
.uw.go .hf.t{transform:translateY(-104%)}
.uw.go .hf.b{transform:translateY(104%)}
.uw .rb{position:absolute;left:0;right:0;top:50%;height:17px;margin-top:-8.5px;background:var(--gold);
 box-shadow:0 0 0 1px rgba(12,12,12,.2);transition:opacity .35s,transform .45s}
.uw.go .rb{opacity:0;transform:scaleX(1.4)}
.uw .rv{position:absolute;left:50%;top:0;bottom:0;width:17px;margin-left:-8.5px;background:var(--gold);
 box-shadow:0 0 0 1px rgba(12,12,12,.2);transition:opacity .35s}
.uw.go .rv{opacity:0}
.uw .kn{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
 border:3px solid var(--gold);background:rgba(102,14,13,.6);transition:opacity .3s,transform .45s}
.uw.go .kn{opacity:0;transform:scale(1.8) rotate(40deg)}
.uw .sn{position:absolute;inset:0;pointer-events:none}
.uw .sn i{position:absolute;top:-8px;width:4px;height:4px;border-radius:50%;background:rgba(241,233,229,.85);
 animation:snf linear infinite}
@keyframes snf{to{transform:translateY(560px) translateX(var(--sx))}}
</style>
