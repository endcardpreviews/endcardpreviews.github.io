#cv>*{position:relative;z-index:1}
/* ---------- Bark Friday bar + countdown ---------- */
.bf{flex:none;padding:6px 12px 7px;text-align:center;background:rgba(255,255,255,.07);
 box-shadow:inset 0 -1px 0 rgba(255,255,255,.12)}
.bf .ttl{font-family:FT,cursive;font-size:21px;line-height:1;color:var(--mint);transform:rotate(-2deg);
 display:inline-block}
.bf .cdl{margin-top:4px;font-family:IN;font-weight:600;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase;color:rgba(255,255,255,.72)}
.cd{margin-top:4px;display:flex;align-items:stretch;justify-content:center;gap:5px}
.cd u{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;
 min-width:50px;padding:4px 7px 3px;border-radius:8px;background:rgba(254,206,38,.16);
 box-shadow:inset 0 0 0 1px rgba(254,206,38,.42)}
.cd u b{font-family:GN,sans-serif;font-weight:700;font-size:22px;line-height:1;color:var(--gold);
 font-variant-numeric:tabular-nums}
.cd u s{text-decoration:none;margin-top:2px;font-family:IN;font-weight:600;font-size:9px;
 letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.cd em{display:flex;align-items:center;font-style:normal;font-family:GN,sans-serif;font-size:17px;
 color:rgba(255,255,255,.3);padding-bottom:10px}
/* ---------- header: wordmark left, value pill right (as in the video) ---------- */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;padding:9px 13px 0}
.hd img{width:74px;height:auto;display:block}
.hd .pill{font-family:GN,sans-serif;font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--ink);
 background:var(--gold);padding:5px 10px 4px;border-radius:7px;transform:rotate(-3deg);white-space:nowrap}
/* ---------- headline ---------- */
.hl{flex:none;padding:5px 13px 0;font-family:GN,sans-serif;font-weight:700;line-height:.92;
 letter-spacing:-.005em}
.hl i{display:block;font-style:normal;font-size:40px;color:var(--gold)}
.hl span{display:block;font-size:27px;color:#fff}
.sub{flex:none;padding:6px 13px 0;font-family:IN;font-weight:600;font-size:13px;line-height:1.22;
 color:rgba(255,255,255,.9)}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* ---------- footer ---------- */
.ft{flex:none;padding:8px 13px 10px;text-align:center}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;width:100%;
 height:44px;border-radius:999px;background:var(--gold);color:var(--ink);cursor:pointer;overflow:hidden;
 font-family:GN,sans-serif;font-weight:700;font-size:16px;letter-spacing:.02em}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
 animation:sh 3s ease-in-out infinite 1.1s}
@keyframes sh{0%{left:-40%}55%{left:120%}100%{left:120%}}
.ft .t1{margin-top:7px;font-family:IN;font-weight:600;font-size:11px;line-height:1.26;color:#fff}
.ft .t2{margin-top:3px;font-family:IN;font-weight:400;font-size:9px;line-height:1.3;
 color:rgba(255,255,255,.62)}
/* ---------- click contract ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
 background:rgba(28,25,54,.86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
 font-family:IN;font-weight:600;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#fff;
 white-space:nowrap;animation:bob 1.7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.chip svg{width:13px;height:13px}
html.done .chip{opacity:0;animation:none}

/* The BarkBox quiz cards' own look: near-white stage, navy ribbon, mint accents.
   Emily, 2026-11-23 — the revision was meant to fix the external requests, not to
   restyle them, so they keep #FBFBFF and their centred black wordmark. */
body.lt{background:var(--paper)}
.lt #cv{background:var(--paper)}
.lt #cv:before{display:none}
.lt .bf{background:var(--navy);box-shadow:none}
.lt .bf .cdl{color:rgba(255,255,255,.76)}
.lt .cd u{background:rgba(148,255,140,.16);box-shadow:inset 0 0 0 1px rgba(148,255,140,.5)}
.lt .cd u b{color:var(--mint)}
.lt .cd u s{color:rgba(255,255,255,.7)}
.lt .cd em{color:rgba(255,255,255,.34)}
.lt .hd{justify-content:center;padding:10px 13px 0;position:relative}
.lt .hd img{width:86px}
.lt .hd .pill{position:absolute;right:13px;top:9px;background:var(--mint);color:var(--navy)}
.lt .hl{text-align:center}
.lt .hl i{color:var(--navy)}

"ix" id="fx" data-qa="scratch"></canvas></div><div class="chip" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5a1.5 1.5 0 0 1 3 0V11m0-.3a1.5 1.5 0 0 1 3 0V15c0 3.3-2.2 6-5.5 6h-1.2c-2 0-3.2-.8-4.3-2.3L4.6 15a1.5 1.5 0 0 1 2.5-1.7L9 15"/></svg><span>Scratch the foil</span></div></div><div class="ft"><button class="cta" id="cta" type="button">Get yours FREE &rarr;</button><div class="t1">a $36 value, with 6 or 12 months of BarkBox</div><div class="t2">New subscribers only. Only with a BarkBox subscription.</div></div><div id="hit"></div></div>
<script>
(function(){
  var cv=document.getElementById('cv');
  function fit(){
    var w=innerWidth,h=innerHeight,s=Math.min(w/360,h/640);
    cv.style.transform='scale('+s+')';
    cv.style.height=Math.round(640)+'px';
    cv.style.left=Math.round((w-360*s)/2)+'px';
    cv.style.top=Math.round((h-640*s)/2)+'px';
  }
  window.__fit=fit; fit(); addEventListener('resize',fit);

  /* DynamicDate + countdown, both from the viewer's own clock.
     ?promo-date=YYYY-MM-DD previews any day. The campaign reads "Bark Friday",
     so the clock runs to local midnight. */
  var q=(location.search.match(/[?&]promo-date=(\d{4}-\d{2}-\d{2})/)||[])[1];
  var base=q?new Date(q+'T12:00:00'):new Date();
  var DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var y=base.getFullYear(), m=base.getMonth(), day=base.getDate();
  var n1=new Date(y,10,1).getDay(), BFD=1+((4-n1)+7)%7+22, CM=BFD+3;
  var lead = (m===10&&day<BFD) ? 'Bark Friday starts now'
           : (m===10&&day===BFD) ? 'Bark Friday \u2014 today'
           : (m===10&&day>BFD&&day<CM) ? 'Bark Friday weekend'
           : (m===10&&day===CM) ? 'Cyber Monday'
           : (m===11&&day<=8) ? 'Final days'
           : 'Limited time offer';
  window.PROMO={date:base, lead:lead, stamp:DAY[base.getDay()]+' '+MON[m]+' '+day};
  [].forEach.call(document.querySelectorAll('[data-dd]'),function(e){ e.textContent=lead; });
  [].forEach.call(document.querySelectorAll('[data-dd-date]'),function(e){ e.textContent=window.PROMO.stamp; });
  function pad(n){ return (n<10?'0':'')+n; }
  function tick(){
    var now=q?new Date(base.getTime()+(Date.now()%86400000)):new Date();
    var end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0,0);
    var s=Math.max(0,Math.floor((end-now)/1000));
    var hh=pad(Math.floor(s/3600)), mm=pad(Math.floor(s%3600/60)), ss=pad(s%60);
    [].forEach.call(document.querySelectorAll('[data-cd-h]'),function(e){ e.textContent=hh; });
    [].forEach.call(document.querySelectorAll('[data-cd-m]'),function(e){ e.textContent=mm; });
    [].forEach.call(document.querySelectorAll('[data-cd-s]'),function(e){ e.textContent=ss; });
  }
  tick(); setInterval(tick,1000);

  /* Click-through: the campaign click URL via MRAID; the browser fallback is preview only.
     MRAID is tested BY NAME so the upload asset scan can see the guard. */
  var LP='https://bark.co/pages/join-barkbox-xl-squishy-dumpling-free-ff';
  function open_(){
    if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function') {
      try { if (typeof clickTag !== 'undefined' && clickTag) { window.mraid.open(clickTag); }
            else { window.mraid.open(); } return; } catch (e) {}
    }
    try { window.open(LP,'_blank'); } catch (e) {}
  }
  window.ECG={open:open_};
  var cta=document.getElementById('cta');
  if(cta) cta.addEventListener('click',function(e){ e.stopPropagation(); open_(); });
  var hit=document.getElementById('hit');
  if(hit) hit.addEventListener('click',function(){ open_(); });

  window.FINISH=function(){ document.documentElement.classList.add('done'); };
  window.$=function(id){ return document.getElementById(id); };

  /* a few gold sparkles on a successful action */
  window.SPARK=function(el,n){
    var r=el.getBoundingClientRect(), host=document.getElementById('cv');
    var hr=host.getBoundingClientRect(), sc=hr.width/360;
    for(var i=0;i<n;i++){
      var d=document.createElement('i');
      d.style.cssText='position:absolute;z-index:40;pointer-events:none;width:5px;height:5px;'+
        'border-radius:50%;background:'+(i%3?'#FECE26':'#fff')+';opacity:.95;'+
        'left:'+((r.left-hr.left)/sc+r.width/sc*Math.random())+'px;'+
        'top:'+((r.top-hr.top)/sc+r.height/sc*Math.random())+'px;'+
        'transition:transform .6s ease-out,opacity .6s ease-out';
      host.appendChild(d);
      (function(d){ requestAnimationFrame(function(){
        d.style.transform='translate('+(Math.random()*40-20)+'px,'+(-18-Math.random()*26)+'px) scale(.3)';
        d.style.opacity='0'; });
        setTimeout(function(){ d.remove(); },700); })(d);
    }
  };

  /* drag helper for swipe / lift gestures */
  window.DRAG=function(el,o){
    var sx=0,sy=0,on=false;
    function dn(e){ on=true; var p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY;
      if(e.cancelable) e.preventDefault(); }
    function mv(e){ if(!on) return; var p=e.touches?e.touches[0]:e;
      if(o.move) o.move(p.clientX-sx,p.clientY-sy); if(e.cancelable) e.preventDefault(); }
    function up(e){ if(!on) return; on=false; var p=(e.changedTouches?e.changedTouches[0]:e)||{};
      if(o.end) o.end((p.clientX||sx)-sx,(p.clientY||sy)-sy); }
    el.addEventListener('pointerdown',dn); addEventListener('pointermove',mv); addEventListener('pointerup',up);
    el.addEventListener('touchstart',dn,{passive:false}); addEventListener('touchmove',mv,{passive:false});
    addEventListener('touchend',up);
  };
})();
</script>
<script>(function(){

var c=$('fx'), sc=$('sc'), g=c.getContext('2d'), fired=false, W=0, H=0;
function paint(){
  var r=sc.getBoundingClientRect(); W=c.width=Math.max(2,Math.round(r.width)); H=c.height=Math.max(2,Math.round(r.height));
  var lg=g.createLinearGradient(0,0,W,H);
  lg.addColorStop(0,'#3A2F6B'); lg.addColorStop(.5,'#231F4A'); lg.addColorStop(1,'#3A2F6B');
  g.globalCompositeOperation='source-over'; g.fillStyle=lg; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.1)';
  for(var i=0;i<90;i++){ g.beginPath(); g.arc(Math.random()*W,Math.random()*H,Math.random()*2.1,0,6.3); g.fill(); }
  g.fillStyle='rgba(255,255,255,.9)'; g.font='700 15px IN,Helvetica,Arial,sans-serif'; g.textAlign='center';
  g.fillText('SCRATCH TO REVEAL', W/2, H/2);
}
paint(); window.__onfit=paint;
var drawing=false;
function at(e){ var r=c.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
  return [(p.clientX-r.left)/r.width*W,(p.clientY-r.top)/r.height*H]; }
function rub(e){ if(!drawing) return; var q=at(e);
  g.globalCompositeOperation='destination-out'; g.beginPath(); g.arc(q[0],q[1],Math.max(16,W*0.085),0,6.3); g.fill();
  if(e.cancelable) e.preventDefault(); check(); }
function check(){
  if(fired) return;
  var d=g.getImageData(0,0,W,H).data, clear=0, step=40;
  for(var i=3;i<d.length;i+=4*step){ if(d[i]<40) clear++; }
  if(clear/(d.length/(4*step))>0.42){ fired=true; SPARK(sc,22); setTimeout(FINISH,320); }
}
c.addEventListener('pointerdown',function(e){ drawing=true; rub(e); });
addEventListener('pointermove',rub); addEventListener('pointerup',function(){ drawing=false; });
c.addEventListener('touchstart',function(e){ drawing=true; rub(e); },{passive:false});
addEventListener('touchmove',rub,{passive:false}); addEventListener('touchend',function(){ drawing=false; });

})();</script>
