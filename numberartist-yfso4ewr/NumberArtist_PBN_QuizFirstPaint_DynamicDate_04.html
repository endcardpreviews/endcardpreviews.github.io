:root{--ink:#1C1C1C;--cream:#FAF9F6;--box:#F8F3EF;--mut:rgba(28,28,28,.75);--line:#E7E1D8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--cream)}
body{font-family:'Nunito',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;background:var(--cream);display:flex;flex-direction:column;overflow:hidden}
#ribbon{flex:none;height:26px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font:600 10.5px/1 'Nunito';letter-spacing:.04em}
.logo{display:block;height:24px;width:auto;margin:10px auto 8px}
h1{font:700 23px/1.18 'Poppins';text-align:center;padding:0 22px;letter-spacing:-.2px}
.bfbox{background:var(--box);border-radius:12px;padding:9px 14px 8px;text-align:center;margin:9px auto 0;width:276px}
.bfbox .l1{font:700 16px/1.2 'Poppins';letter-spacing:.5px}
.bfbox .l2{font:600 10.5px/1.3 'Nunito';letter-spacing:.3px;color:var(--mut);margin-top:3px}
.bfbox .l2 b{font-weight:900;font-variant-numeric:tabular-nums}
#panel{position:relative;flex:1;min-height:0;margin:10px 16px 0;border-radius:14px;overflow:hidden;background:#EFEAE2;box-shadow:0 10px 24px -14px rgba(28,28,28,.35)}
#panel>img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.offband{position:absolute;left:0;right:0;bottom:0;background:rgba(18,18,18,.92);color:#fff;text-align:center;padding:9px 10px;font:900 12.5px/1.25 'Nunito';letter-spacing:.04em;opacity:0;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,1,.3,1),opacity .3s}
html.done .offband{opacity:1;transform:none}
.offband small{display:block;font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#D8D2C6;margin-top:2px}
.prodline{flex:none;text-align:center;font:600 12.5px/1.3 'Nunito';color:var(--ink);margin-top:8px;padding:0 16px}
.prodline b{font-weight:900}
.prodline s{color:#9a958b;margin-left:4px}
#hintrow{flex:none;display:flex;justify-content:center;margin-top:7px}
#hint{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:30px;padding:7px 13px;font:600 10.5px/1 'Nunito';letter-spacing:.06em;text-transform:uppercase}
#hint svg{width:12px;height:12px}
html.done #hint{visibility:hidden}
#ctarow{flex:none;padding:8px 16px 12px}
#cta{display:block;width:100%;border:0;cursor:pointer;background:var(--ink);color:#fff;font:700 13px/1 'Poppins';letter-spacing:2.4px;text-transform:uppercase;padding:15px 10px;border-radius:0}
.terms{flex:none;text-align:center;font:600 9px/1.3 'Nunito';color:#9a958b;padding:0 16px 8px;margin-top:6px}
#hit{position:fixed;left:0;right:0;bottom:0;height:66.7%;z-index:7;pointer-events:none}
html.done #hit{pointer-events:auto}
html.done #cta{position:relative;z-index:8}
html.done .ia{pointer-events:none!important}

#ops{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;margin:8px 16px 0}
.op{position:relative;display:flex;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:0 36px 0 12px;font:600 13px/1.2 'Nunito';color:var(--ink);cursor:pointer;flex:1;min-height:0}
.op em{position:absolute;right:9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:1.5px solid #CFC9BE;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.op em svg{width:11px;height:11px;opacity:0}
.op.cur{border-color:var(--ink);background:var(--box)}
.op.cur em{background:var(--ink);border-color:var(--ink)}
.op.cur em svg{opacity:1}
</style></head>
