html,body{height:100%}
body{background:linear-gradient(180deg,var(--ink) 0 50%,var(--cream) 50% 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Norm',-apple-system,'Helvetica Neue',sans-serif;color:var(--ink)}
#stage{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*177.78);background:var(--cream);overflow:hidden;display:flex;flex-direction:column}
.mono{font-family:'Mono',ui-monospace,monospace;text-transform:uppercase}
#ribbon{flex:0 0 calc(var(--u)*8);background:var(--ink);color:var(--sage);display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--u)*4);font-family:'Mono',monospace;text-transform:uppercase;font-size:calc(var(--u)*2.75);letter-spacing:calc(var(--u)*0.28)}
#cd{color:var(--cream)}
header{text-align:center;padding:calc(var(--u)*2.4) calc(var(--u)*6) 0}
header img.logo{height:calc(var(--u)*5.6);display:block;margin:0 auto}
.eyebrow{font-family:'Mono',monospace;text-transform:uppercase;font-size:calc(var(--u)*2.5);letter-spacing:calc(var(--u)*0.45);color:var(--olive);margin-top:calc(var(--u)*1.5)}
.offrow{font-family:'Saol',Georgia,serif;font-weight:300;font-size:calc(var(--u)*3.9);margin-top:calc(var(--u)*1.4)}
.offrow s{color:var(--mut);text-decoration-thickness:calc(var(--u)*0.35)}
.offrow em{font-style:italic}
.offrow .sep{color:var(--stone);margin:0 calc(var(--u)*0.4)}
.bfline{display:inline-block;font-family:'Mono',monospace;text-transform:uppercase;background:var(--yel);color:var(--ink);font-size:calc(var(--u)*3.6);letter-spacing:calc(var(--u)*0.55);padding:calc(var(--u)*1.1) calc(var(--u)*2.8);margin-top:calc(var(--u)*1.6)}

<script>
var LP='https://webflow.prose.com/lp/men';
function openLP(){try{if(typeof mraid!=='undefined'&&mraid&&mraid.open){if(typeof clickTag!=='undefined'&&clickTag){mraid.open(clickTag)}else{mraid.open(LP)}return}}catch(e){}
try{var w=window.open(LP,'_blank');if(!w){location.href=LP}}catch(e){try{location.href=LP}catch(_){}}}
document.getElementById('cta').addEventListener('click',function(e){e.stopPropagation();openLP()});
document.getElementById('hit').addEventListener('click',function(){if(document.documentElement.classList.contains('done'))openLP()});
function finishCard(){if(document.documentElement.classList.contains('done'))return;document.documentElement.classList.add('done');var h=document.getElementById('hint');if(h)h.textContent='TAP TO SHOP';}
/* dynamic date */
function promoDate(){var m=location.search.match(/promo-date=(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],+m[2]-1,+m[3],12):new Date()}
function campaignLabel(d){var y=d.getFullYear(),mo=d.getMonth(),day=d.getDate();
var nov1=new Date(y,10,1).getDay();var thanks=1+((4-nov1+7)%7)+21;var bf=thanks+1;
if(mo===10){if(day<bf)return'BLACK FRIDAY SALE';if(day===bf)return'BLACK FRIDAY SALE';if(day>bf)return'BLACK FRIDAY SALE'}
if(mo===11){var nov1p=new Date(y,10,1).getDay();var thanksP=1+((4-nov1p+7)%7)+21;var cm=thanksP+4-30;if(day===cm&&cm>=1)return'CYBER MONDAY SALE';if(day<=1&&cm<1)return'CYBER MONDAY SALE';if(day<=23)return'HOLIDAY SALE';return'YEAR-END SALE'}
return'LIMITED TIME OFFER'}
var MOS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
(function(){var d=promoDate();var L=campaignLabel(d);var el=document.getElementById('camp');if(el)el.textContent=L+' · '+MOS[d.getMonth()]+' '+d.getDate();var b=document.getElementById('bf');if(b)b.textContent=L})();
(function(){var cd=document.getElementById('cd');if(!cd)return;function tick(){var n=new Date();var end=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,0);var s=Math.max(0,Math.floor((end-n)/1000));var h=('0'+Math.floor(s/3600)).slice(-2),m=('0'+Math.floor(s%3600/60)).slice(-2),x=('0'+s%60).slice(-2);cd.textContent='ENDS IN '+h+':'+m+':'+x}tick();setInterval(tick,1000)})();

(function(){
var cv=document.getElementById('scratch'),ctx=cv.getContext('2d'),inset=document.getElementById('inset');
var painted=false,cleared=false,W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
function paint(){var r=inset.getBoundingClientRect();if(r.width<10){requestAnimationFrame(paint);return}
W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.fillStyle='#F0EDE4';ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(50,52,41,0.10)';for(var i=0;i<90;i++){ctx.beginPath();ctx.arc(Math.random()*W,Math.random()*H,Math.random()*1.4+.3,0,7);ctx.fill()}
ctx.fillStyle='#323429';ctx.textAlign='center';
var fs=H*0.115;ctx.font='500 '+fs+'px Mono, monospace';
ctx.fillText('S C R A T C H   T O   R E V E A L',W/2,H*0.42);
var fs2=H*0.09;ctx.font='500 '+fs2+'px Mono, monospace';
ctx.fillText('O U R   B I G G E S T   O F F E R   E V E R',W/2,H*0.62);
painted=true}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){requestAnimationFrame(paint)})}else{requestAnimationFrame(paint)}
var down=false,moved=0;
function pos(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)]}
function erase(x,y){ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,Math.max(14,W*0.075),0,7);ctx.fill();ctx.globalCompositeOperation='source-over'}
function pct(){try{var d=ctx.getImageData(0,0,cv.width,cv.height).data,n=0,t=0;for(var i=3;i<d.length;i+=4*97){t++;if(d[i]<40)n++}return n/Math.max(1,t)}catch(e){return 1}}
cv.addEventListener('pointerdown',function(e){if(!painted||cleared)return;down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}var p=pos(e);erase(p[0],p[1])});
cv.addEventListener('pointermove',function(e){if(!down||cleared)return;var p=pos(e);erase(p[0],p[1]);if(++moved%6===0&&pct()>0.5)clear()});
window.addEventListener('pointerup',function(){down=false;if(!cleared&&painted&&pct()>0.5)clear()});
function clear(){if(cleared)return;cleared=true;finishCard()}
})();
