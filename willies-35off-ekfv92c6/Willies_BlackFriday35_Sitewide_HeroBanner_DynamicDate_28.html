:root{--navy:#071D49;--cream:#F1E9E5;--red:#660E0D;--ink:#0C0C0C;--gold:#C9A227;
 --line:rgba(7,29,73,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--navy);
 font-family:WG,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* ---------- the Black Friday lockup: the loudest thing on every card ---------- */
.ob{flex:none;position:relative;background:#5E0F12;color:var(--cream);padding:9px 13px 10px;
 overflow:hidden;text-align:center}
.ob:before{content:"";position:absolute;inset:0;
 background:radial-gradient(130% 160% at 50% -30%,rgba(241,233,229,.17),transparent 62%)}
.ob .arch{position:relative;display:block;width:74px;height:auto;margin:0 auto 5px}
.ob .big{position:relative;font-family:WX;font-size:36px;
 line-height:.94;letter-spacing:.005em;text-transform:uppercase;color:var(--cream)}
.ob .big em{display:block;font-style:normal;font-size:23px;letter-spacing:.02em;color:var(--gold)}
.ob .dd{position:relative;margin-top:7px;font-family:WX;font-size:13px;line-height:1.04;
 letter-spacing:.04em;text-transform:uppercase;color:var(--cream)}
.ob .dd span{color:var(--gold)}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.pim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pct{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10px}
/* ---------- the site's own hero lockup, used in place of the black banner ---------- */
.oh{flex:none;position:relative;padding:12px 14px 11px;text-align:center;overflow:hidden;background:#5E0F12}
.oh:before{content:"";position:absolute;inset:0;
 background:radial-gradient(130% 160% at 50% -30%,rgba(241,233,229,.16),transparent 62%)}
.oh .lk{position:relative;display:block;width:206px;max-width:74%;height:auto;margin:0 auto}
.oh .ohs{position:relative;margin-top:8px;font-family:WX;font-size:14px;line-height:1.02;letter-spacing:.03em;
 text-transform:uppercase;color:var(--cream)}
.oh .ohd{position:relative;margin-top:6px;font-family:WG;font-size:9px;letter-spacing:.15em;text-transform:uppercase;
 color:rgba(241,233,229,.62)}
/* ---------- press strip ---------- */
.press{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;
 padding:7px 13px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.press img{height:11px;width:auto;opacity:.72;filter:grayscale(1)}
/* ---------- panel ---------- */
.pan{flex:none;padding:11px 15px 13px;text-align:center;background:var(--cream);border-top:1px solid var(--line)}
.ttl{font-family:WX;font-size:21px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;color:var(--navy)}
.ttl em{font-style:normal;color:var(--red)}
.note{margin-top:5px;font-family:WG;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6B7490}
.disc{margin-top:9px;font-family:WG;font-size:9px;line-height:1.38;letter-spacing:.03em;
 color:#8A93A8;text-align:center;text-transform:none}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;gap:8px;
 width:100%;height:46px;margin-top:10px;background:var(--navy);color:var(--cream);font-family:WG;
 font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;overflow:hidden;border-radius:4px}
.cta span{position:relative;z-index:1}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(241,233,229,.26),transparent);animation:sh 3s ease-in-out infinite 1.1s}
@keyframes sh{0%{left:-40%}45%,100%{left:120%}}
.fold .sub2{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1,.4,1),opacity .35s .1s}
html.done .fold .sub2{max-height:170px;opacity:1}
/* ---------- click layer + hint ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 11px 0 9px;border-radius:999px;
 background:var(--navy);color:var(--cream);font-family:WG;font-size:9px;letter-spacing:.13em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(7,29,73,.6);
 animation:cp 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:13px;height:13px}
html.done .chip{opacity:0;animation:none}
@keyframes cp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
/* ---------- shared stage furniture ---------- */
.gw{position:absolute;inset:0;display:flex;flex-direction:column}
.hl{flex:none;padding:9px 12px 3px;text-align:center;font-family:WX;font-size:17px;line-height:1.02;
 letter-spacing:.01em;text-transform:uppercase;color:var(--navy)}
.hl em{font-style:normal;color:var(--red)}
.hl.hol{color:var(--red)}.hl.hol em{color:var(--navy)}
.hs{flex:none;padding:0 14px 2px;text-align:center;font-family:WG;font-size:9px;letter-spacing:.11em;
 text-transform:uppercase;color:#6B7490}
.dh{flex:none;padding:1px 10px 6px;text-align:center;font-family:WX;font-size:17px;line-height:1;
 text-transform:uppercase;color:var(--navy)}
.big{font-family:WX;font-size:30px;line-height:1;color:var(--navy)}
.big i{font-style:normal;font-size:12px;color:#6B7490}
.pz2{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:5px 0 1px}
.pz2 s{font-family:WG;font-size:10px;letter-spacing:.1em;color:#8A93A8}
.pz2 b{font-family:WX;font-size:27px;line-height:1;color:var(--red)}
.pz2 u{text-decoration:none;padding:2px 7px;border-radius:999px;background:var(--navy);color:var(--cream);
 font-family:WG;font-size:9px;letter-spacing:.12em;text-transform:uppercase}

.bn{position:absolute;inset:0;overflow:hidden;background:#140C0A}
.bn .fr2{position:absolute;inset:0;opacity:0;transition:opacity .5s;background:no-repeat center/cover}
.bn .fr2.on{opacity:1}
.bn .scrim{position:absolute;inset:0;
 background:linear-gradient(90deg,rgba(14,8,7,.80) 0%,rgba(14,8,7,.52) 46%,rgba(14,8,7,.10) 78%)}
.bn .wrap{position:absolute;left:14px;right:40%;top:46%;transform:translateY(-50%);text-align:center}
.bn .arch2{display:block;width:72px;height:auto;margin:0 auto 9px}
.bn .lk2{display:block;width:100%;max-width:178px;height:auto;margin:0 auto}
.bn .hd2{margin-top:11px;font-family:WX;font-size:16px;line-height:1.02;letter-spacing:.02em;text-transform:uppercase;
 color:var(--cream)}
.bn .pg2{position:absolute;left:14px;right:14px;top:9px;display:flex;gap:4px;z-index:9}
.bn .pg2 i{flex:1;height:3px;border-radius:99px;background:rgba(241,233,229,.26)}
.bn .pg2 i.on{background:var(--cream)}
.bn .tz2{position:absolute;left:0;right:0;top:0;bottom:30px;cursor:pointer}
.bn .press{position:absolute;left:0;right:0;bottom:0;border-top:0}
</style>

<script>
(function(){
  var cv=document.getElementById('cv'), R=document.documentElement;
  function fit(){ var W=innerWidth,H=innerHeight,s=Math.min(W/360,H/640); cv.style.height=(H/s)+'px';
    cv.style.transform='translate('+((W-360*s)/2)+'px,0) scale('+s+')'; window.__S=s;
    /* letterbox: the page behind each band has to match the band it sits beside, or a
       light line shows along the edge. Build the backdrop from the real colours of the
       card's own stacked sections, descending where a section is transparent. */
    var y=0, st=[];
    [].forEach.call(cv.children,function(el){
      if(el.id==='hit') return;
      var h=el.offsetHeight*s; if(h<1) return;
      var c=el, bg=getComputedStyle(c).backgroundColor, n=0;
      while((!bg||/^rgba\(0, 0, 0, 0\)$|^transparent$/.test(bg)) && c.firstElementChild && n++<3){
        c=c.firstElementChild; bg=getComputedStyle(c).backgroundColor; }
      if(!bg||/^rgba\(0, 0, 0, 0\)$|^transparent$/.test(bg)) bg='#F1E9E5';
      st.push(bg+' '+Math.round(y)+'px '+Math.round(y+h)+'px'); y+=h; });
    if(st.length) document.body.style.background='linear-gradient(180deg,'+st.join(',')+')';
    if(window.__onfit) window.__onfit(); }
  window.__fit=fit; fit(); addEventListener('resize',fit);
  /* DynamicDate: the viewer's device date drives the campaign line.
     ?promo-date=YYYY-MM-DD previews any day. Willie's last day to order is 12/4. */
  var q=(location.search.match(/[?&]promo-date=(\d{4}-\d{2}-\d{2})/)||[])[1];
  var d=q?new Date(q+'T12:00:00'):new Date();
  var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  var n1=new Date(y,10,1).getDay(), BF=1+((4-n1)+7)%7+22, CM=BF+3;
  var ds=MON[m]+' '+day;
  var lead = (m===10&&day<BF) ? 'Black Friday early access'
           : (m===10&&day===BF) ? 'Black Friday \u00b7 today'
           : (m===10&&day>BF&&day<CM) ? 'Black Friday weekend'
           : (m===10&&day===CM) ? 'Cyber Monday'
           : (m===11&&day<4) ? 'Final days'
           : (m===11&&day===4) ? 'Last day to order'
           : 'While supplies last';
  window.PROMO={date:d,lead:lead,ds:ds};
  [].forEach.call(document.querySelectorAll('[data-dd]'),function(e){ e.textContent=lead; });
  [].forEach.call(document.querySelectorAll('[data-dd-short]'),function(e){ e.textContent=ds; });
  /* click-through: the campaign click URL via MRAID; the fallback is only for a browser preview.
     MRAID is tested by name so the upload asset scan can see the guard. */
  var last=-1e9;
  window.OPEN=function(){ var t=Date.now(); if(t-last<250) return; last=t;
    var u=window.clickTag||window.clickTag1||'';
    if(typeof window.mraid!=='undefined' && window.mraid && typeof window.mraid.open==='function'){
      try{ if(u) window.mraid.open(u); else window.mraid.open(); return; }catch(e){}
    }
    window.open(u||'https://willies.com/','_blank'); };
  document.getElementById('cta').addEventListener('click',function(e){ e.stopPropagation(); OPEN(); });
  document.getElementById('hit').addEventListener('click',function(){ OPEN(); });
  var cbs=[]; window.ONDONE=function(f){ cbs.push(f); };
  window.FINISH=function(){ if(R.classList.contains('done')) return; R.classList.add('done');
    cbs.forEach(function(f){ try{f()}catch(e){} }); setTimeout(fit,500); };
  window.$=function(id){ return document.getElementById(id); };
  window.LOCAL=function(el,e){ var r=el.getBoundingClientRect(), k=el.offsetWidth/(r.width||1);
    return {x:(e.clientX-r.left)*k, y:(e.clientY-r.top)*k, w:el.offsetWidth, h:el.offsetHeight}; };
  window.SPARK=function(el,n){ var s=window.__S||1, a=el.getBoundingClientRect(), b=cv.getBoundingClientRect(),
      x=(a.left+a.width/2-b.left)/s, y=(a.top+a.height/2-b.top)/s, C=['#C9A227','#F1E9E5','#660E0D','#071D49'];
    for(var i=0;i<(n||18);i++){ var p=document.createElement('i'), t=Math.random()*Math.PI*2,
        v=46+Math.random()*74, z=4+Math.random()*7;
      p.className='cf'; p.style.left=x+'px'; p.style.top=y+'px'; p.style.width=p.style.height=z+'px';
      p.style.setProperty('--dx',Math.cos(t)*v+'px'); p.style.setProperty('--dy',Math.sin(t)*v+'px');
      p.style.setProperty('--r',(Math.random()*360-180)+'deg'); p.style.background=C[i%C.length];
      cv.appendChild(p); (function(p){setTimeout(function(){p.remove()},1150)})(p); } };
  window.DRAG=function(el,h){ var on=false,x0=0,y0=0,dx=0,dy=0;
    el.addEventListener('pointerdown',function(e){ if(R.classList.contains('done')) return; on=true; x0=e.clientX; y0=e.clientY;
      dx=dy=0; try{el.setPointerCapture(e.pointerId)}catch(_){ } if(h.start) h.start(e); e.preventDefault(); });
    el.addEventListener('pointermove',function(e){ if(!on) return; var s=window.__S||1;
      dx=(e.clientX-x0)/s; dy=(e.clientY-y0)/s; if(h.move) h.move(dx,dy,e); });
    function up(e){ if(!on) return; on=false; if(h.end) h.end(dx,dy,e); }
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    el.addEventListener('click',function(e){ e.stopPropagation(); }); };
  window.SCRATCH=function(c,o){ var x=c.getContext('2d'), GW=o.gw||16, GH=o.gh||8, cells={}, got=0, lp=null, started=false;
    function size(){ var w=c.offsetWidth,h=c.offsetHeight; if(!w||!h) return false;
      if(c.width!==w*2||c.height!==h*2){ c.width=w*2; c.height=h*2; } return true; }
    function paint(){ if(started||!size()) return; x.globalCompositeOperation='source-over';
      x.clearRect(0,0,c.width,c.height); o.paint(x,c.width,c.height); }
    function rub(e){ started=true; var q=LOCAL(c,e), s=c.width/q.w, X=q.x*s, Y=q.y*s;
      x.globalCompositeOperation='destination-out'; x.lineCap='round'; x.lineJoin='round'; x.lineWidth=(o.brush||46);
      x.beginPath(); if(lp){ x.moveTo(lp[0],lp[1]); x.lineTo(X,Y); } else { x.moveTo(X,Y); x.lineTo(X+.1,Y); }
      x.stroke(); lp=[X,Y];
      for(var a=-1;a<=1;a++) for(var b=-1;b<=1;b++){ var gx=Math.floor(X/c.width*GW)+a, gy=Math.floor(Y/c.height*GH)+b,
          k=gy*GW+gx; if(gx>=0&&gy>=0&&gx<GW&&gy<GH&&!cells[k]){ cells[k]=1; got++; } }
      if(got/(GW*GH)>(o.done||.5)) FINISH(); }
    DRAG(c,{ start:function(e){ lp=null; rub(e); }, move:function(dx,dy,e){ rub(e); }, end:function(){ lp=null; } });
    return {paint:paint}; };
})();
