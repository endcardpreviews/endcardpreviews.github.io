*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#FFFFFF;overflow:hidden}
body{font-family:'nbMont',"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#282828}
#nb-fit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--nb-s,1));
  transform-origin:50% 50%;width:360px;height:640px}
.nb-card{position:relative;width:360px;height:640px;overflow:hidden;background:#FFFFFF}

/* the site's own Black Friday bar, with its countdown */
.nb-bar{position:absolute;left:0;right:0;top:0;height:46px;z-index:7;background:#0F2724;
  display:flex;align-items:center;justify-content:center;gap:9px;padding:0 8px}
.nb-bar .nb-bt{display:block;font-weight:400;font-size:11px;line-height:14px;letter-spacing:.1em;

.nb-bar .nb-bt b{display:block;font-weight:500;font-size:12px;line-height:16px;letter-spacing:.1em}

/* ---------- credibility bands ---------- */

/* ---------- 2x2 catalog ---------- */

.nb-tile.nb-open .nb-front{transform:rotateY(-180deg);opacity:0;transition:transform .42s ease,opacity .12s .24s}
.nb-tile.nb-open .nb-back{transform:rotateY(0deg)}

.nb-save{position:absolute;left:6px;top:6px;z-index:2;font-weight:700;font-size:9px;line-height:11px;

.nb-nm{display:block;font-weight:500;font-size:10px;line-height:13px;letter-spacing:.055em;

.nb-pr{display:block;margin-top:3px;font-weight:500;font-size:14.5px;line-height:18px;letter-spacing:normal;

/* the deal face: the product again, the price lockup, one phrase, a Shop chip */
.nb-dtop{position:relative;flex:1 1 auto;min-height:0;border-radius:6px;overflow:hidden;
  background-color:#fff;background-repeat:no-repeat;background-position:50% 50%;background-size:contain}
.nb-dchip{position:absolute;left:5px;top:5px;z-index:2;font-weight:700;font-size:9px;line-height:11px;

.nb-dln{display:block;flex:0 0 auto;margin-top:2px;font-weight:600;font-size:9.5px;line-height:12px;

.nb-dgo{display:flex;flex:0 0 auto;align-items:center;justify-content:center;margin-top:6px;height:19px;

  text-transform:uppercase}

/* no-flip tiles: the packshot never turns over, the saving arrives under the price */
html.nb-keep .nb-tile{perspective:none;-webkit-perspective:none}
html.nb-keep .nb-back{display:none}

.nb-revBar b{display:block;background:#054B48;color:#fff;font-weight:700;font-size:9.5px;line-height:16px;

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- hero: the brand's own green field ---------- */
.nb-hero{position:absolute;inset:0;border-radius:10px;overflow:hidden;

.nb-hero img.nb-line{position:absolute;left:0;right:0;bottom:0px;width:100%;height:auto;display:block}

.nb-tiers{position:absolute;left:10px;right:10px;top:34px;z-index:4;display:flex;gap:8px}
.nb-tier{flex:1 1 0;border:0;padding:9px 6px 8px;border-radius:8px;cursor:pointer;text-align:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);

.nb-tier.nb-open{background:rgba(255,255,255,.16);border-color:#fff}
.nb-tier .nb-amt{display:block;font-weight:600;font-size:22px;line-height:26px;letter-spacing:normal;color:#fff}

.nb-tier .nb-code{display:block;margin:7px auto 0;max-width:112px;background:#fff;color:#000;

  transition:box-shadow .22s ease,transform .22s ease}
.nb-tier.nb-open .nb-code{transform:scale(1.04);box-shadow:0 0 0 2px #1E3E3B,0 0 0 4px #fff}

/* ---------- one-product stage ---------- */
.nb-solo{position:absolute;inset:0;border:1px solid #E3E1DC;border-radius:10px;overflow:hidden;background:#fff}
.nb-solo img.nb-sh{position:absolute;left:0;right:0;top:0;width:100%;height:250px;object-fit:contain;display:block}

.nb-pricebar .nb-pp{display:block;font-weight:500;font-size:27px;line-height:32px;letter-spacing:.02em;color:#282828}
.nb-pricebar .nb-pp s{font-weight:400;font-size:14px;letter-spacing:.05em;color:#7C7C7C;margin-right:7px;

.nb-pricebar .nb-pp s:after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;
  background:#7C7C7C;transition:width .42s ease}

.nb-pricebar .nb-pp i{font-style:normal;opacity:0;transition:opacity .3s .18s ease}
html.nb-struck .nb-pricebar .nb-pp i{opacity:1}
.nb-tapdisc{position:absolute;left:50%;top:180px;transform:translateX(-50%);z-index:4;border:0;
  cursor:pointer;background:#054B48;color:#fff;border-radius:22px;padding:0 15px;height:34px;
  font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  box-shadow:0 5px 16px rgba(0,0,0,.22);transition:transform .2s ease,opacity .2s ease}
.nb-tapdisc.nb-open{transform:translateX(-50%) scale(.96);opacity:0}
/* a hotspot has to read as something to press, not as a speck on the case */
.nb-spot{position:absolute;z-index:4;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;
  background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nb-spot:before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(5,75,72,.22);
  animation:nbPulse 1.9s ease-out infinite}
.nb-spot i{position:relative;display:block;width:16px;height:16px;border-radius:50%;background:#054B48;
  box-shadow:0 0 0 3px rgba(255,255,255,.92),0 2px 7px rgba(0,0,0,.3)}
.nb-spot i:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:#fff}
.nb-spot.nb-open:before{animation:none;opacity:0}

@keyframes nbPulse{0%{transform:scale(.62);opacity:.9}70%{transform:scale(1.18);opacity:0}100%{opacity:0}}

/* ---------- colourways: 12 of the brand's own, repainting in place ---------- */
.nb-cwrap{position:absolute;left:0;right:0;top:0;height:196px}

  object-fit:contain;display:block;opacity:0;transition:opacity .22s ease}
.nb-cw.nb-vis{opacity:1}
.nb-cwname{position:absolute;left:0;right:0;top:200px;height:17px;text-align:center}

  letter-spacing:.09em;color:#282828;opacity:0;transition:opacity .2s ease}
.nb-cwname span.nb-vis{opacity:1}
/* twelve swatches on ONE row: wrapping put the second row under the price bar, where its
   taps never landed and the card could not finish */
/* twelve swatches on ONE row: wrapping put the second row under the price bar, where its
   taps never landed and the card could not finish. 324px of room, so 23px targets with a
   5px gutter for the selected ring to grow into without clipping the end swatches. */
.nb-swatches{position:absolute;left:6px;right:6px;top:222px;display:flex;flex-wrap:nowrap;
  justify-content:center;gap:3px;padding:0 5px}
.nb-sw{flex:0 0 auto;width:23px;height:26px;padding:0;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.nb-sw i{display:block;width:17px;height:17px;border-radius:50%;background:var(--sw);

.nb-sw.nb-seen i{box-shadow:0 0 0 1.5px #fff inset,0 0 0 3px rgba(5,75,72,.5) inset,

/* ---------- pick a card (the brand's own getaway page) ---------- */
.nb-pick{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:#F6F3EC;
  display:flex;flex-direction:column;align-items:center;padding:12px 10px 10px}

.nb-pieces{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}

.nb-pop{position:absolute;inset:0;overflow:hidden;background:#fff;border:1px solid #E3E1DC;border-radius:10px}

.nb-chiprow{position:absolute;left:12px;right:12px;top:558px;height:18px;z-index:6}

<script>
(function(){
  var DATA = {"url": "https://nobltravel.com/collections/black-friday-sale", "doneHint": "Tap to shop", "deal": null, "need": null, "wonLine": null};
  var CLICK = DATA.url;
  function openLP(){
    try{
      if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function'){
        window.mraid.open(CLICK); return;
      }
    }catch(e){}
    try{ window.open(CLICK, '_blank'); }catch(e){}
  }

  /* ---- fit the 360x640 stage into the ad slot ---- */
  var fit = document.getElementById('nb-fit');
  function resize(){
    var w = window.innerWidth || 360, h = window.innerHeight || 640;
    fit.style.setProperty('--nb-s', Math.min(w / 360, h / 640));
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* ---- dynamic date: the campaign line comes off the viewer's own clock ---- */
  function pad(v){ return (v < 10 ? '0' : '') + v; }
  function promoDate(){
    var q = '', m;
    try{ m = /[?&]promo-date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); }catch(e){}
    if (m){ q = m[1]; }
    try{
      if (!q && typeof window.__PROMO_DATE === 'string' &&
          /^\d{4}-\d{2}-\d{2}$/.test(window.__PROMO_DATE)) { q = window.__PROMO_DATE; }
    }catch(e){}
    var dt;
    if (q){
      var p = q.split('-');
      dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    } else { dt = new Date(); }
    if (isNaN(dt.getTime())) { dt = new Date(); }
    return dt;
  }
  function campaign(dt){
    var k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    if (k >= '2026-11-01' && k <= '2026-11-26') return 'Black Friday Sale';
    if (k === '2026-11-27') return 'Black Friday';
    if (k === '2026-11-28' || k === '2026-11-29') return 'Black Friday Weekend';
    if (k === '2026-11-30') return 'Cyber Monday';
    if (k >= '2026-12-01' && k <= '2026-12-02') return 'Cyber Week';
    return 'Limited Time Offer';
  }
  /* The bar carries the campaign NAME off the viewer's device clock and the countdown
     beside it — no printed date (Emily, 2026-11-24: "remove the date, just keep the
     countdown timer"). The calendar-driven campaign line is the dynamic-date feature. */
  (function(){
    var el = document.getElementById('nb-camp');
    if (el){ el.textContent = campaign(promoDate()); }
  })();

  /* ---- the site's own countdown, started where Emily asked: 9h 30m 50s ----
     Display only: it drives nothing, and the card never finishes or redirects on it. */
  (function(){
    var box = document.getElementById('nb-cd');
    if (!box) return;
    var hh = box.querySelector('[data-u="h"]'), mm = box.querySelector('[data-u="m"]'),
        ss = box.querySelector('[data-u="s"]');
    var left = (9 * 3600) + (30 * 60) + 50;
    function paint(){
      var t = left < 0 ? 0 : left;
      hh.textContent = pad(Math.floor(t / 3600));
      mm.textContent = pad(Math.floor((t % 3600) / 60));
      ss.textContent = pad(t % 60);
    }
    paint();
    window.setInterval(function(){ if (left > 0){ left--; paint(); } }, 1000);
  })();

  /* ---- interaction ---- */
  var nodes = [].slice.call(document.querySelectorAll('[data-qa="tap"][data-i]'));
  var seen = [], total = nodes.length, count = 0, finished = false;
  for (var i = 0; i < total; i++){ seen.push(false); }
  var keepAll = document.documentElement.classList.contains('nb-keep');

  function finish(){
    if (finished) return;
    finished = true;
    var hint = document.getElementById('hint');
    if (hint) hint.textContent = DATA.doneHint || 'Tap to shop';
    /* a beat later, so the tap that completed the card is not re-dispatched
       onto the click layer and does not open the landing page by itself */
    window.setTimeout(function(){
      document.documentElement.classList.add('done');
    }, 420);
  }

  function pick(ev){
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    var el = this, idx = Number(el.getAttribute('data-i'));
    for (var j = 0; j < nodes.length; j++){
      nodes[j].classList.remove('nb-on');
      if (!keepAll && nodes[j] !== this){ nodes[j].classList.remove('nb-open'); }
      if (seen[j]) { nodes[j].classList.add('nb-seen'); }
    }
    el.classList.remove('nb-seen');
    el.classList.add('nb-on');
    el.classList.add('nb-open');
    if (!seen[idx]){ seen[idx] = true; count++; }
    /* colourway card: the case itself repaints, which is the change happening where
       the finger is — there is no panel and nothing else moves */
    var cws = document.querySelectorAll('.nb-cw');
    if (cws.length){
      for (var q = 0; q < cws.length; q++){
        if (Number(cws[q].getAttribute('data-c')) === idx) { cws[q].classList.add('nb-vis'); }
        else { cws[q].classList.remove('nb-vis'); }
      }
      var nms = document.querySelectorAll('.nb-cwname span');
      for (var r = 0; r < nms.length; r++){
        if (Number(nms[r].getAttribute('data-c')) === idx) { nms[r].classList.add('nb-vis'); }
        else { nms[r].classList.remove('nb-vis'); }
      }
    }
    var st = document.querySelector('[data-stamp="' + idx + '"]');
    if (st){ st.classList.add('nb-vis'); }
    /* the price card's whole point: the tap is what strikes the retail price through */
    if (el.classList.contains('nb-tapdisc')){ document.documentElement.classList.add('nb-struck'); }
    var prog = document.getElementById('nb-prog');
    if (prog){ prog.style.width = Math.round(count / total * 100) + '%'; }
    if (count >= total){ finish(); }
  }
  for (var k = 0; k < nodes.length; k++){ nodes[k].addEventListener('click', pick); }

  /* ---- pick a card: flip four of nine, each a free gift (the getaway page) ---- */
  (function(){
    var grid = document.querySelector('.nb-pgrid');
    if (!grid) return;
    var cards = [].slice.call(grid.querySelectorAll('.nb-pc'));
    var wins = 0, flips = 0, lock = false;
    var sub = document.getElementById('nb-picks');
    cards.forEach(function(c){
      c.addEventListener('click', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        if (lock || c.classList.contains('nb-open')) return;
        c.classList.add('nb-open');
        flips++;
        if (c.classList.contains('nb-win')) wins++;
        if (wins >= (DATA.need || 4)){
          lock = true;
          /* the prompt answers itself with the total, in place, the way the page does */
          document.documentElement.classList.add('nb-won');
          if (sub && DATA.wonLine) { sub.textContent = DATA.wonLine; }
          var hint = document.getElementById('hint');
          if (hint) hint.textContent = DATA.doneHint || 'Tap to shop';
          window.setTimeout(function(){ document.documentElement.classList.add('done'); }, 420);
        }
      });
    });
  })();

  /* ---- match three (the site's own Black Friday Offer pop-up) ---- */
  (function(){
    var grid = document.getElementById('nb-grid');
    if (!grid) return;
    var cards = [].slice.call(grid.querySelectorAll('.nb-mc'));
    var opened = 0, matched = 0, lock = false;
    var pops = document.getElementById('nb-pops');
    function done3(){
      var hint = document.getElementById('hint');
      if (hint) hint.textContent = DATA.doneHint || 'Tap to shop';
      /* The three matched cards ARE the reveal. The prompt under the headline answers
         itself with the terms, so nothing new is laid over the grid or the two cases. */
      document.documentElement.classList.add('nb-matched');
      if (pops && DATA.deal) { pops.textContent = DATA.deal; }
      window.setTimeout(function(){ document.documentElement.classList.add('done'); }, 420);
    }
    cards.forEach(function(c){
      c.addEventListener('click', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        if (lock || c.classList.contains('nb-open')) return;
        c.classList.add('nb-open');
        opened++;
        if (c.getAttribute('data-win') === '1'){
          matched++;
          var meter = document.getElementById('nb-meter');
          if (meter){ meter.setAttribute('data-n', String(matched)); }
          if (matched >= 3){
            lock = true;
            /* the three matching cards are the ones that carry the deal, so the
               reveal lands on the grid itself rather than under it */
            window.setTimeout(function(){ grid.classList.add('nb-won'); done3(); }, 260);
          }
        }
      });
    });
  })();

  var cta = document.getElementById('cta');
  if (cta){ cta.addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); openLP(); }); }
  var hit = document.getElementById('hit');
  if (hit){ hit.addEventListener('click', function(ev){ ev.preventDefault(); openLP(); }); }
})();

</script>
</body>
