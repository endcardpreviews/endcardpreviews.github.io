:root{--cream:#F6F1E7;--ink:#121212;--gold:#C9A253;--tallow:#E8D6A8;--rose:#C8102E;--mute:#8B8578;
 --line:rgba(18,18,18,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
 font-family:TTU,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* header */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px 10px}
.lg{font-family:TTD;font-size:17px;letter-spacing:.055em;text-transform:uppercase;color:var(--ink);
 line-height:1;white-space:nowrap}
.lg i{font-style:normal;font-size:8px;vertical-align:super;margin-left:1px}
.dt{flex:none;font-family:TTU;font-weight:700;font-size:8px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:4px 8px 3px;white-space:nowrap}
/* offer bar */
.ob{flex:none;background:var(--ink);color:var(--cream);text-align:center;padding:7px 10px 6px}
.ob b{display:block;font-family:TTD;font-weight:400;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.ob b em{font-style:normal;color:var(--tallow)}
.ob i{display:block;margin-top:3px;font-style:normal;font-weight:600;font-size:8px;letter-spacing:.15em;
 text-transform:uppercase;color:#CFC6B4}
/* stage */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#EFEAE4}
.pim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.pct{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
/* panel */
.pan{flex:none;padding:11px 16px 14px;text-align:center;background:var(--cream);border-top:1px solid var(--line)}
.ttl{font-family:TTD;font-weight:400;font-size:25px;line-height:1;letter-spacing:.015em;text-transform:uppercase}
.ttl em{font-style:normal;color:var(--rose)}
.prc{display:flex;align-items:baseline;justify-content:center;gap:7px;margin-top:5px}
.prc b{font-family:TTD;font-weight:400;font-size:29px;line-height:1;letter-spacing:.01em}
.prc s{font-family:TTU;font-weight:400;font-size:12px;color:var(--mute)}
.prc u{font-family:TTU;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
 text-decoration:none;color:var(--cream);background:var(--rose);padding:3px 6px 2px;border-radius:2px}
.gft{margin-top:5px;font-family:TTU;font-weight:400;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;width:100%;height:47px;
 margin-top:11px;background:var(--ink);color:#fff;font-family:TTU;font-weight:700;font-size:13px;
 letter-spacing:.14em;text-transform:uppercase;cursor:pointer;overflow:hidden;border-radius:11px}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(250,246,241,.26),transparent);animation:shine 3s ease-in-out infinite 1.2s}
@keyframes shine{0%{left:-40%}45%,100%{left:120%}}
/* reveal fold */
.fold .sub{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1,.4,1),opacity .35s .1s}
html.done .fold .sub{max-height:150px;opacity:1}
/* click layer + hint chip */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 9px;border-radius:999px;
 background:var(--ink);color:#fff;font-family:TTU;font-weight:700;font-size:9px;letter-spacing:.12em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(23,21,15,.55);
 animation:chipP 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:14px;height:14px}
html.done .chip{opacity:0;animation:none}
@keyframes chipP{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}

.sq{position:absolute;inset:0}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px 10px 38px}
.q{font-family:TTD;font-weight:400;font-size:22px;line-height:1.05;letter-spacing:.015em;text-transform:uppercase;text-align:center;margin-bottom:9px}
.ans{display:flex;flex-direction:column;gap:6px}
.an{padding:9px 10px 8px;border:1px solid var(--line);background:#fff;font-family:TTU;font-weight:600;font-size:11px;
 letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.an.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
</style>
</head>

  var cv=document.getElementById('cv'), R=document.documentElement;
  function fit(){ var W=innerWidth,H=innerHeight,s=Math.min(W/360,H/640); cv.style.height=(H/s)+'px';
    cv.style.transform='translate('+((W-360*s)/2)+'px,0) scale('+s+')'; window.__S=s; if(window.__onfit) window.__onfit(); }
  window.__fit=fit; fit(); addEventListener('resize',fit);
  /* dynamic date: the viewer's device date drives the callout; ?promo-date=YYYY-MM-DD overrides it for checking.
     The sitewide offer runs to 22 Nov 2026, 11:59pm ET. */
  var q=window.__PROMO_DATE||(location.search.match(/[?&]promo-date=(\d{4}-\d{2}-\d{2})/)||[])[1];
  var d=q?new Date(q+'T12:00:00'):new Date();
  var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var m=d.getMonth(), day=d.getDate();
  var dow1=new Date(d.getFullYear(),10,1).getDay(), thu1=1+((4-dow1)+7)%7, BF=thu1+22, CM=BF+3;
  var ds=MON[m]+' '+day;
  var lead = (m===10&&day<BF) ? 'Black Friday sale \u00b7 '+ds
           : (m===10&&day===BF) ? 'Black Friday \u00b7 today only'
           : (m===10&&day>BF&&day<CM) ? 'Black Friday weekend \u00b7 '+ds
           : (m===10&&day===CM) ? 'Cyber Monday \u00b7 today only'
           : (m===11&&day<=24) ? 'Holiday sale \u00b7 '+ds
           : 'Limited time offer';
  window.PROMO={date:d,lead:lead};
  [].forEach.call(document.querySelectorAll('[data-dd]'),function(e){ e.textContent=lead; });
  [].forEach.call(document.querySelectorAll('[data-dd-short]'),function(e){ e.textContent=ds; });
  /* click-through: the campaign click URL via MRAID; the fallback is only for a plain browser preview */
  var last=-1e9;
  window.OPEN=function(){ var t=Date.now(); if(t-last<250) return; last=t;
    var u=window.clickTag||window.clickTag1||'', m=window.mraid;
    if(m&&typeof m.open==='function'){ if(u) m.open(u); else m.open(); return; }
    window.open(u||'https://thetallowedtruth.com/pages/black-friday-f-balm','_blank'); };
  document.getElementById('cta').addEventListener('click',function(e){ e.stopPropagation(); OPEN(); });
  document.getElementById('hit').addEventListener('click',function(){ OPEN(); });
  var cbs=[]; window.ONDONE=function(f){ cbs.push(f); };
  window.FINISH=function(){ if(R.classList.contains('done')) return; R.classList.add('done');
    cbs.forEach(function(f){ try{f()}catch(e){} }); setTimeout(fit,500); };
  window.$=function(id){ return document.getElementById(id); };
  window.LOCAL=function(el,e){ var r=el.getBoundingClientRect(), k=el.offsetWidth/(r.width||1);
    return {x:(e.clientX-r.left)*k, y:(e.clientY-r.top)*k, w:el.offsetWidth, h:el.offsetHeight}; };
  window.SPARK=function(el,n){ var s=window.__S||1, a=el.getBoundingClientRect(), b=cv.getBoundingClientRect(),
      x=(a.left+a.width/2-b.left)/s, y=(a.top+a.height/2-b.top)/s, C=['#C9A253','#E8D6A8','#C8102E','#F6F1E7'];
    for(var i=0;i<(n||20);i++){ var p=document.createElement('i'), t=Math.random()*Math.PI*2,
        v=48+Math.random()*78, z=5+Math.random()*8;
      p.className='cf'; p.style.left=x+'px'; p.style.top=y+'px'; p.style.width=p.style.height=z+'px';
      p.style.setProperty('--dx',Math.cos(t)*v+'px'); p.style.setProperty('--dy',Math.sin(t)*v+'px');
      p.style.setProperty('--r',(Math.random()*360-180)+'deg'); p.style.background=C[i%C.length];
      cv.appendChild(p); (function(p){setTimeout(function(){p.remove()},1150)})(p); } };
  window.DRAG=function(el,h){ var on=false,x0=0,y0=0,dx=0,dy=0;
    el.addEventListener('pointerdown',function(e){ if(R.classList.contains('done')) return; on=true; x0=e.clientX; y0=e.clientY;
      dx=dy=0; try{el.setPointerCapture(e.pointerId)}catch(_){ } if(h.start) h.start(e); e.preventDefault(); });
    el.addEventListener('pointermove',function(e){ if(!on) return; var s=window.__S||1;
      dx=(e.clientX-x0)/s; dy=(e.clientY-y0)/s; if(h.move) h.move(dx,dy,e); });
    function up(e){ if(!on) return; on=false; if(h.end) h.end(dx,dy,e); }
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    el.addEventListener('click',function(e){ e.stopPropagation(); }); };
  /* SCRATCH(canvas,{paint,brush,done}) : rub a painted layer away */
  window.SCRATCH=function(c,o){ var x=c.getContext('2d'), GW=o.gw||16, GH=o.gh||8, cells={}, got=0, lp=null, started=false;
    function size(){ var w=c.offsetWidth,h=c.offsetHeight; if(!w||!h) return false;
      if(c.width!==w*2||c.height!==h*2){ c.width=w*2; c.height=h*2; } return true; }
    function paint(){ if(started||!size()) return; x.globalCompositeOperation='source-over';
      x.clearRect(0,0,c.width,c.height); o.paint(x,c.width,c.height); }
    function rub(e){ started=true; var q=LOCAL(c,e), s=c.width/q.w, X=q.x*s, Y=q.y*s;
      x.globalCompositeOperation='destination-out'; x.lineCap='round'; x.lineJoin='round'; x.lineWidth=(o.brush||46);
      x.beginPath(); if(lp){ x.moveTo(lp[0],lp[1]); x.lineTo(X,Y); } else { x.moveTo(X,Y); x.lineTo(X+.1,Y); }
      x.stroke(); lp=[X,Y];
      for(var a=-1;a<=1;a++) for(var b=-1;b<=1;b++){ var gx=Math.floor(X/c.width*GW)+a, gy=Math.floor(Y/c.height*GH)+b,
          k=gy*GW+gx; if(gx>=0&&gy>=0&&gx<GW&&gy<GH&&!cells[k]){ cells[k]=1; got++; } }
      if(got/(GW*GH)>(o.done||.5)) FINISH(); }
    DRAG(c,{ start:function(e){ lp=null; rub(e); }, move:function(dx,dy,e){ rub(e); }, end:function(){ lp=null; } });
    return {paint:paint}; };
  window.FOIL=function(x,W,H,l1,l2){ var g=x.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#F0E3C2'); g.addColorStop(.25,'#D9BE7E'); g.addColorStop(.5,'#F6EDD6');
    g.addColorStop(.75,'#C9A253'); g.addColorStop(1,'#E8D6A8'); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.18)'; for(var i=0;i<120;i++){ x.fillRect(Math.random()*W,Math.random()*H,2+Math.random()*3,2+Math.random()*3); }
    x.fillStyle='#17150F'; x.textAlign='center'; x.textBaseline='middle';
    if(l1){ x.font='400 '+Math.round(H*(l2?.34:.38))+'px TTD,Arial,sans-serif'; x.fillText(l1,W/2,H*(l2?.40:.5)); }
    if(l2){ x.font='600 '+Math.round(H*.1)+'px TTU,Arial,sans-serif'; x.fillText(l2,W/2,H*.68); } };
})();
</script>
