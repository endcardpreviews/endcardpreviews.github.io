:root{--cream:#F6F1E7;--ink:#121212;--gold:#C9A253;--tallow:#E8D6A8;--rose:#C8102E;--mute:#8B8578;
 --line:rgba(18,18,18,.16)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
 font-family:TTU,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* header */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px 10px}
.lg{font-family:TTD;font-size:17px;letter-spacing:.055em;text-transform:uppercase;color:var(--ink);
 line-height:1;white-space:nowrap}
.lg i{font-style:normal;font-size:8px;vertical-align:super;margin-left:1px}
.dt{flex:none;font-family:TTU;font-weight:700;font-size:8px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:4px 8px 3px;white-space:nowrap}
/* offer bar */
.ob{flex:none;background:var(--ink);color:var(--cream);text-align:center;padding:7px 10px 6px}
.ob b{display:block;font-family:TTD;font-weight:400;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.ob b em{font-style:normal;color:var(--tallow)}
.ob i{display:block;margin-top:3px;font-style:normal;font-weight:600;font-size:8px;letter-spacing:.15em;
 text-transform:uppercase;color:#CFC6B4}
/* stage */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#EFEAE4}
.pim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.pct{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
/* panel */
.pan{flex:none;padding:11px 16px 14px;text-align:center;background:var(--cream);border-top:1px solid var(--line)}
.ttl{font-family:TTD;font-weight:400;font-size:25px;line-height:1;letter-spacing:.015em;text-transform:uppercase}
.ttl em{font-style:normal;color:var(--rose)}
.prc{display:flex;align-items:baseline;justify-content:center;gap:7px;margin-top:5px}
.prc b{font-family:TTD;font-weight:400;font-size:29px;line-height:1;letter-spacing:.01em}
.prc s{font-family:TTU;font-weight:400;font-size:12px;color:var(--mute)}
.prc u{font-family:TTU;font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
 text-decoration:none;color:var(--cream);background:var(--rose);padding:3px 6px 2px;border-radius:2px}
.gft{margin-top:5px;font-family:TTU;font-weight:400;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;width:100%;height:47px;
 margin-top:11px;background:var(--ink);color:#fff;font-family:TTU;font-weight:700;font-size:13px;
 letter-spacing:.14em;text-transform:uppercase;cursor:pointer;overflow:hidden;border-radius:11px}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(250,246,241,.26),transparent);animation:shine 3s ease-in-out infinite 1.2s}
@keyframes shine{0%{left:-40%}45%,100%{left:120%}}
/* reveal fold */
.fold .sub{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1,.4,1),opacity .35s .1s}
html.done .fold .sub{max-height:150px;opacity:1}
/* click layer + hint chip */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 9px;border-radius:999px;
 background:var(--ink);color:#fff;font-family:TTU;font-weight:700;font-size:9px;letter-spacing:.12em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(23,21,15,.55);
 animation:chipP 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:14px;height:14px}
html.done .chip{opacity:0;animation:none}
@keyframes chipP{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}

.cmp{position:absolute;inset:0;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 38%}
#top{clip-path:inset(0 calc(100% - var(--p,20%)) 0 0)}
.cap{position:absolute;bottom:44px;z-index:4;font-family:TTU;font-weight:700;font-size:8.5px;letter-spacing:.15em;
 text-transform:uppercase;color:var(--ink);background:rgba(250,246,241,.92);padding:4px 8px 3px;transition:opacity .25s}
.capL{left:12px}.capR{right:12px}
html.done .capR{opacity:0}
#bar{position:absolute;top:0;bottom:0;left:var(--p,20%);z-index:5;width:2px;margin-left:-1px;background:var(--cream);
 box-shadow:0 0 10px rgba(23,21,15,.35)}
#kb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;
 background:var(--cream);border:1px solid var(--gold);box-shadow:0 5px 14px rgba(23,21,15,.3);display:flex;
 align-items:center;justify-content:center;color:var(--ink);font-family:TTU;font-weight:700;font-size:13px}
.rng{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;
 border:1.5px solid var(--cream);animation:ring 1.7s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.9);opacity:.95}100%{transform:scale(1.4);opacity:0}}
html.done .rng{display:none}
html.done #bar{opacity:0;transition:opacity .4s}

.ins{position:absolute;left:10px;top:10px;z-index:7;width:72px;height:72px;background:var(--cream);
 border:1px solid var(--line);box-shadow:0 4px 12px rgba(23,21,15,.14);padding:4px;pointer-events:none}
.ins img{width:100%;height:100%;object-fit:contain}
</style>
