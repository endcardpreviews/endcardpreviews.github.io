:root{--cream:#F7F2E6;--ink:#17150F;--gold:#C9A253;--tallow:#E8D6A8;--rose:#C8102E;--mute:#8A8372;
 --line:rgba(23,21,15,.14);--hair:rgba(201,162,83,.42);
 --foil:linear-gradient(100deg,#A87F2E 0%,#E3C688 20%,#FFF7E2 42%,#D8B76A 62%,#F4E4BA 82%,#B98F38 100%);
 --paper:#F2EBDC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
 font-family:TTU,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* header */
.hd{flex:none;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 16px 9px}
.lg{font-family:TTD;font-size:16px;letter-spacing:.075em;text-transform:uppercase;color:var(--ink);
 line-height:1;white-space:nowrap}
.lg i{font-style:normal;font-size:7.5px;vertical-align:super;margin-left:1px}
.hd:before,.hd:after{content:"";flex:1 1 auto;height:1px;background:var(--hair)}
/* offer block - the loudest thing on the card */
.ob{flex:none;position:relative;background:var(--ink);color:var(--cream);padding:10px 14px 9px;
 border-top:1px solid rgba(201,162,83,.5);border-bottom:1px solid rgba(201,162,83,.5)}
.ob:before{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(120% 150% at 50% -30%,rgba(201,162,83,.22),transparent 62%)}
.ob .row{position:relative;display:flex;align-items:center;justify-content:center;gap:11px}
.ob .kick{font-family:TTD;font-weight:400;font-size:15px;line-height:1;letter-spacing:.1em;
 text-transform:uppercase;color:var(--cream);text-align:right;max-width:96px}
.ob .big{font-family:TTD;font-weight:400;font-size:46px;line-height:.82;letter-spacing:-.005em;
 background:var(--foil);-webkit-background-clip:text;background-clip:text;color:transparent;
 white-space:nowrap;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.ob .big u{text-decoration:none;font-size:25px;vertical-align:super;letter-spacing:0}
.ob .ends{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
 border-left:1px solid rgba(201,162,83,.4);padding-left:11px;min-width:74px}
.ob .ends em{font-style:normal;font-family:TTU;font-weight:700;font-size:7.5px;letter-spacing:.17em;
 text-transform:uppercase;color:var(--gold)}
.ob .ends b{font-family:TTD;font-weight:400;font-size:17px;line-height:1;letter-spacing:.05em;
 text-transform:uppercase;color:#fff;white-space:nowrap}
.ob .sub{position:relative;margin-top:7px;padding-top:6px;border-top:1px solid rgba(246,241,231,.16);
 text-align:center;font-family:TTU;font-weight:700;font-size:8.5px;letter-spacing:.15em;
 text-transform:uppercase;color:#D8CFBB}
.ob .sub b{color:var(--tallow);font-weight:700}
/* stage */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--paper)}
.ph:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
 box-shadow:0 0 54px 10px rgba(23,21,15,.13) inset}
.pim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.pct{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
/* panel */
.pan{flex:none;padding:12px 17px 14px;text-align:center;background:var(--cream);
 border-top:1px solid var(--line);box-shadow:0 -14px 22px -20px rgba(23,21,15,.5)}
.ttl{font-family:TTD;font-weight:400;font-size:26px;line-height:1.02;letter-spacing:.022em;text-transform:uppercase}
.ttl em{font-style:normal;color:var(--rose)}
.prc{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:7px}
.prc b{font-family:TTD;font-weight:400;font-size:33px;line-height:1;letter-spacing:.012em}
.prc s{font-family:TTU;font-weight:400;font-size:12.5px;color:var(--mute)}
.prc u{position:relative;font-family:TTU;font-weight:700;font-size:9px;letter-spacing:.11em;
 text-transform:uppercase;text-decoration:none;color:#3A2B06;background:var(--foil);
 padding:4px 8px 3px;border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 6px -2px rgba(23,21,15,.4)}
.gft{margin-top:6px;font-family:TTU;font-weight:600;font-size:8.5px;letter-spacing:.17em;
 text-transform:uppercase;color:var(--mute)}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;width:100%;height:49px;
 margin-top:12px;background:var(--ink);color:#fff;font-family:TTU;font-weight:700;font-size:13px;
 letter-spacing:.15em;text-transform:uppercase;cursor:pointer;overflow:hidden;border-radius:4px;
 box-shadow:0 0 0 1px rgba(201,162,83,.55) inset,0 10px 20px -12px rgba(23,21,15,.8)}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(250,246,241,.26),transparent);animation:shine 3s ease-in-out infinite 1.2s}
@keyframes shine{0%{left:-40%}45%,100%{left:120%}}
/* reveal fold */
.fold .sub{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,1,.4,1),opacity .35s .1s}
html.done .fold .sub{max-height:150px;opacity:1}
/* click layer + hint chip */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 9px;border-radius:999px;
 background:var(--ink);color:#fff;font-family:TTU;font-weight:700;font-size:9px;letter-spacing:.12em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(23,21,15,.55);
 animation:chipP 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:14px;height:14px}
html.done .chip{opacity:0;animation:none}
@keyframes chipP{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}

.sq{position:absolute;inset:0}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px 10px 38px}
.q{font-family:TTD;font-weight:400;font-size:22px;line-height:1.05;letter-spacing:.015em;text-transform:uppercase;text-align:center;margin-bottom:9px}
.ans{display:flex;flex-direction:column;gap:6px}
.an{padding:9px 10px 8px;border:1px solid var(--line);background:#fff;font-family:TTU;font-weight:600;font-size:11px;
 letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:all .18s}
.an.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.sq img{object-fit:cover !important;padding:0 !important;object-position:50% 46%}</style>
