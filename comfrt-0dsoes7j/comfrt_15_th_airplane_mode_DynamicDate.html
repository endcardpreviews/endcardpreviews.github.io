<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Comfrt — Airplane Mode On</title>
<style>
@font-face{font-family:'Times LT Std';src:url(fonts/TimesLTStd-Roman.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/DMSans-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Rock Salt';src:url(fonts/RockSalt-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Acumin Pro Cond';src:url(fonts/AcuminProCond-Bold.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--pagebg,#F9F7F4);font-family:'DM Sans','DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;justify-content:center}
.card{position:relative;height:100%;width:100%;max-width:calc(100vh*9/16);background:var(--cardbg,#F9F7F4);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;letter-spacing:.05em}
.serif{font-family:'Times LT Std','Times LT Std','Times New Roman',Georgia,serif}
.brandlogo{display:block;margin:0 auto;height:clamp(15px,min(5.2vw,2.93vh),23px);width:clamp(50px,min(17.33vw,9.75vh),76.7px);fill:#313030}
.brandlogo.lt{fill:#F9F7F4}
.cond{font-family:'DM Sans','DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}
img{-webkit-user-drag:none;pointer-events:none}
.cta{position:absolute;left:50%;transform:translateX(-50%);bottom:3.6%;width:80%;padding:4% 0;background:#8E282B;color:#fff;border:0;border-radius:10px;font:600 clamp(15px,min(5vw,2.81vh),22px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;z-index:40;box-shadow:0 6px 18px rgba(142,40,43,.35)}
html.done .cta{animation:ctapulse 1.5s infinite}
@keyframes ctapulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.04)}}
.offer{position:absolute;left:50%;transform:translateX(-50%);bottom:11.6%;width:92%;text-align:center;color:var(--offerink,#313030);font:500 clamp(10px,min(3.1vw,1.74vh),14px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;z-index:35;pointer-events:none}
.offer b{color:var(--offerhl,#8E282B);font-weight:700}
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:16.5%;background:rgba(49,48,48,.85);color:#fff;padding:7px 15px;border-radius:999px;font:500 clamp(10px,min(3vw,1.69vh),13px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;z-index:45;pointer-events:none;white-space:nowrap}
#hit{position:absolute;left:0;right:0;bottom:0;height:66.7%;z-index:30;pointer-events:none;cursor:pointer}
html.done #hit{pointer-events:auto}
html.done .lock{pointer-events:none!important}
.strike{text-decoration:line-through;opacity:.55;font-weight:500}
/* date callouts */
.ribbon{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);background:#B3261E;color:#fff;padding:7px 16px;border-radius:999px;font-weight:600;font-size:clamp(10px,min(3.2vw,1.80vh),14px);letter-spacing:.14em;z-index:38;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.ribbon .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.gifttag{position:absolute;top:1.4%;right:2.6%;z-index:38;transform:rotate(8deg);transform-origin:top center;animation:tagswing 3.2s ease-in-out infinite}
@keyframes tagswing{0%,100%{transform:rotate(8deg)}50%{transform:rotate(2deg)}}
.gt-string{width:2px;height:clamp(10px,min(3.6vw,2.02vh),16px);background:#313030;margin:0 auto}
.gt-body{background:#B3261E;color:#fff;border-radius:8px;padding:clamp(4px,min(1.6vw,0.90vh),7px) clamp(7px,min(2.7vw,1.52vh),11px);text-align:center;display:flex;flex-direction:column;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.gt-body:before{content:'';display:block;width:7px;height:7px;border-radius:50%;background:var(--cardbg,#F9F7F4);margin:0 auto 3px}
.gt-top{font-size:clamp(7px,min(2.1vw,1.18vh),10px);font-weight:500;letter-spacing:.12em}
.gt-date{font-size:clamp(11px,min(3.5vw,1.97vh),16px);font-weight:700;letter-spacing:.08em}
.stamp{position:absolute;top:1.5%;right:2.6%;width:clamp(52px,min(16.5vw,9.28vh),76px);height:clamp(52px,min(16.5vw,9.28vh),76px);border-radius:50%;background:#B3261E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:38;transform:rotate(10deg);box-shadow:0 4px 12px rgba(0,0,0,.2);outline:2px dashed rgba(255,255,255,.75);outline-offset:-6px}
.st-top,.st-mid{font-size:clamp(7px,min(2.2vw,1.24vh),10px);font-weight:600;letter-spacing:.14em;line-height:1.15}
.st-date{font-size:clamp(10px,min(3.3vw,1.86vh),14px);font-weight:700;margin-top:2px}
.sparkle{position:absolute;color:#C9A227;animation:spk 1.8s ease-in-out infinite;pointer-events:none;z-index:6}
@keyframes spk{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
/* footer: offer + CTA stacked in flow so they can never overlap */
.footer{position:absolute;left:0;right:0;bottom:3.4%;display:flex;flex-direction:column;align-items:center;gap:9px;z-index:40;pointer-events:none}
.footer .cta{position:static;left:auto;transform:none;bottom:auto;pointer-events:auto}
html.done .footer .cta{animation:ctapulse2 1.5s infinite}
@keyframes ctapulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.footer .offer{position:static;left:auto;transform:none;bottom:auto;width:auto;max-width:92%}
.footer .ribbon{position:static;left:auto;transform:none;top:auto}
.footer .chip{position:static;left:auto;right:auto;top:auto;bottom:auto;transform:none}

:root{--pagebg:#1C2733;--cardbg:#1C2733;--offerink:#F9F7F4;--offerhl:#F2C14E}
.hd{position:absolute;top:7.5%;left:0;right:0;text-align:center;z-index:8}
.hd-brand{font-family:'Times LT Std','Times New Roman',Georgia,serif;font-size:clamp(18px,min(6vw,3.38vh),27px);color:#F9F7F4}
.hd-kick{font:600 clamp(11px,min(3.5vw,1.97vh),15px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#F2C14E;margin-top:1.2vh}
.hd-main{font-family:'Times LT Std','Times New Roman',Georgia,serif;font-style:italic;font-size:clamp(25px,min(9.2vw,5.17vh),44px);color:#F9F7F4;line-height:1.05}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#F9F7F4;opacity:.5;animation:tw 2.4s infinite;z-index:2}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.85}}
.tog{position:absolute;top:24.5%;left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:12px;background:rgba(248,247,244,.08);border:1px solid rgba(248,247,244,.25);padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tog .lbl{font:600 clamp(10px,min(3.3vw,1.86vh),14px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#F9F7F4}
.tog .plane{font-size:clamp(14px,min(4.6vw,2.59vh),20px);color:#F9F7F4}
.sw2{width:clamp(48px,min(15vw,8.44vh),62px);height:clamp(26px,min(8vw,4.50vh),33px);border-radius:999px;background:#51606e;position:relative;transition:background .3s}
.sw2 .kn{position:absolute;top:3px;left:3px;width:calc(50% - 3px);aspect-ratio:1/1;height:auto;border-radius:50%;background:#F9F7F4;transition:left .3s}
html.on2 .sw2{background:#B3261E}
html.on2 .sw2 .kn{left:calc(50%)}
.stat{position:absolute;top:33.8%;left:0;right:0;text-align:center;font:600 clamp(10px,min(3.2vw,1.80vh),14px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#7E9292;z-index:8;transition:color .3s}
html.on2 .stat{color:#F2C14E}
.prod{position:absolute;top:37.3%;left:28%;width:44%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;z-index:9;box-shadow:0 14px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(30px);transition:all .6s cubic-bezier(.2,.7,.3,1.1)}
html.on2 .prod{opacity:1;transform:none}
.prod img{width:100%;height:100%;object-fit:cover}
.pm3{position:absolute;top:68.8%;left:0;right:0;text-align:center;z-index:9;opacity:0;transition:opacity .5s .3s}
html.on2 .pm3{opacity:1}
.pm3 .nm{font:600 clamp(10px,min(3.2vw,1.80vh),14px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#F9F7F4}
.pm3 .pr{font:700 clamp(13px,min(4.4vw,2.48vh),19px)/1.69 'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;color:#F2C14E}
.pm3 .pr .strike{color:#8fa0ad}
.ribbon{background:#F2C14E;color:#313030}
.ribbon .dot{background:#313030}
.cta{background:#B3261E}

.hd-main,.hd2 .m{font-family:'Times LT Std','Times LT Std','Times New Roman',Georgia,serif;letter-spacing:-.04em;line-height:.9;font-style:normal;font-weight:400}
.hd-kick,.hd2 .k,.under .uk{font-family:'Rock Salt','Comic Sans MS',cursive;font-weight:400;letter-spacing:.21em;line-height:2.1;font-size:clamp(8px,min(2.5vw,1.41vh),11px);margin-bottom:.4vh;text-transform:none}
.cta{font-family:'Acumin Pro Cond','Arial Narrow',Helvetica,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;border-radius:5px;line-height:normal}
</style></head>
