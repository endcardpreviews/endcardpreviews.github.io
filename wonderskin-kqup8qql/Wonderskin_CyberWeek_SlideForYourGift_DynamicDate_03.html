:root{--blk:#0B0B0C;--sil:#C9CCD1;--sil2:#8E9198}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--blk);font-family:"Poppins","Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--blk)}
/* photo */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#d9d8de}
.pim{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p1 .pim{object-position:50% 16%}
.p2 .pim{object-position:30% 50%}
/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 16px 0}
.p1 .hd{position:absolute;left:0;right:0;top:0;z-index:5;height:150px;background:linear-gradient(rgba(11,11,12,.82),rgba(11,11,12,.5) 45%,rgba(11,11,12,0));pointer-events:none}
.p2 .hd{flex:none;height:104px;background:var(--blk)}
.hl{font-weight:800;font-size:31px;line-height:.94;letter-spacing:-.04em;text-transform:uppercase;color:#fff;animation:hin .55s cubic-bezier(.2,1.2,.4,1) both .1s}
@keyframes hin{from{opacity:0;transform:translateY(10px)}}
.dt{display:inline-block;margin-top:8px;font-weight:700;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--blk);background:linear-gradient(100deg,#F4F5F7,#B7BAC0 45%,#F1F2F4 70%,#A9ACB2);border-radius:2px;padding:3px 7px 2px;white-space:nowrap}
.lg{flex:none;width:96px;margin-top:4px;filter:brightness(0) invert(1)}
/* silver roundel */
.stk{position:absolute;z-index:6;width:94px;height:94px;border-radius:50%;transform:rotate(-12deg);background:conic-gradient(from 210deg,#FBFBFC,#B6B9BF 11%,#F6F7F9 24%,#868A91 37%,#ECEEF1 51%,#A2A5AB 65%,#FFFFFF 79%,#AEB1B7 91%,#FBFBFC);box-shadow:0 8px 16px rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stk:before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(11,11,12,.45)}
.stk:after{content:"";position:absolute;top:-20%;bottom:-20%;left:-60%;width:38%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:rotate(12deg);animation:shn 3.2s ease-in-out infinite 1s}
@keyframes shn{0%{left:-60%}40%,100%{left:130%}}
.stk b{position:relative;font-weight:800;font-size:21px;line-height:.9;letter-spacing:-.03em;text-align:center;color:var(--blk);text-transform:uppercase}
.p1 .stk{right:14px;bottom:44px}
.p2 .stk{left:8px;bottom:112px;width:86px;height:86px}
.p2 .stk b{font-size:19px}
/* bottom panel */
.pan{flex:none;background:var(--blk);padding:0 16px 14px;text-align:center}
.sub{overflow:hidden}
.sub .in{padding-top:14px}
.l1{font-weight:800;font-size:38px;line-height:.95;letter-spacing:-.04em;text-transform:uppercase;background:linear-gradient(100deg,#FFFFFF,#B9BCC2 38%,#FFFFFF 60%,#A7AAB0);-webkit-background-clip:text;background-clip:text;color:transparent}
.l2{margin-top:4px;font-weight:600;font-style:italic;font-size:17px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase;color:#fff}
.l3{margin-top:6px;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--sil)}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;width:100%;height:46px;margin-top:13px;background:#fff;color:var(--blk);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;overflow:hidden}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;background:linear-gradient(100deg,transparent,rgba(11,11,12,.14),transparent);animation:shine 2.8s ease-in-out infinite 1.2s}
@keyframes shine{0%{left:-40%}45%,100%{left:120%}}
/* collapsible sub-copy (revealed when the card is finished) */
.fold .sub{max-height:0;opacity:0;transition:max-height .45s cubic-bezier(.3,1,.4,1),opacity .35s .1s}
html.done .fold .sub{max-height:130px;opacity:1}
/* click layer + interactive */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;pointer-events:none;display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 13px 0 10px;border-radius:999px;background:#fff;color:var(--blk);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 14px -4px rgba(0,0,0,.5);animation:chipP 1.8s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:15px;height:15px}
html.done .chip{opacity:0;animation:none}
@keyframes chipP{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.rv{opacity:0;scale:.6;transition:opacity .3s,scale .5s cubic-bezier(.2,1.6,.4,1)}
html.done .rv{opacity:1;scale:1}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}

#sl{position:relative;height:46px;margin-top:14px;border:1.5px solid var(--sil);border-radius:999px;overflow:hidden;transition:max-height .35s,opacity .25s,margin .35s;max-height:46px}
#sl .fl{position:absolute;left:0;top:0;bottom:0;width:44px;background:linear-gradient(90deg,#6E7178,#D9DBDF)}
#sl .kn{position:absolute;left:2px;top:2px;width:39px;height:39px;border-radius:50%;background:conic-gradient(from 210deg,#FBFBFC,#B6B9BF 14%,#F6F7F9 30%,#868A91 46%,#ECEEF1 62%,#A2A5AB 78%,#FBFBFC);color:var(--blk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
#sl .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:34px;font-weight:500;font-size:22px;letter-spacing:.3em;color:var(--sil);pointer-events:none;animation:nud 1.3s ease-in-out infinite}
@keyframes nud{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(8px);opacity:1}}
html.done #sl{max-height:0;opacity:0;margin-top:0;border-width:0}.ob{display:inline-block;margin-top:7px;padding:3px 8px 2px;border:1px solid rgba(201,204,209,.45);background:rgba(11,11,12,.62);border-radius:2px;font-weight:700;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;white-space:nowrap}.ob i{font-style:normal;background:linear-gradient(100deg,#FFFFFF,#B9BCC2 40%,#FFFFFF 70%,#A7AAB0);-webkit-background-clip:text;background-clip:text;color:transparent}.p1 .hd{height:178px}
</style>
</head>
