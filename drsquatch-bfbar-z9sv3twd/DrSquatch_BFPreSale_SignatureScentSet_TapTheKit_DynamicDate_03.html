*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0A0A0B;overflow:hidden}
body{font-family:'dsqAdrianna',"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#dsq-fit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--dsq-s,1));
  transform-origin:50% 50%;width:360px;height:640px}
.dsq-card{position:relative;width:360px;height:640px;overflow:hidden;background:#0A0A0B;color:#fff}
.dsq-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* The brand's own promo bar, rebuilt from the live site: --promobar-bg-color #B5292A,
   white adrianna, bold uppercase headline over a regular-weight offer line. */
.dsq-promo{position:absolute;left:0;right:0;top:0;height:38px;z-index:5;background:#B5292A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 10px}
.dsq-pm1{display:block;font-weight:700;font-size:12px;line-height:14px;letter-spacing:.04em;
  color:#fff;text-transform:uppercase;white-space:nowrap}
.dsq-pm2{display:block;font-weight:400;font-size:11px;line-height:13px;letter-spacing:.04em;
  color:#fff;white-space:nowrap}
.dsq-top{position:absolute;left:0;right:0;top:42px;text-align:center;z-index:4}
.dsq-logo{display:block;margin:0 auto;height:42px;width:auto}
.dsq-hl{font-family:'dsqWorker',"Arial Black",Impact,sans-serif;font-weight:800;font-size:20px;line-height:20px;
  letter-spacing:.01em;margin-top:6px;height:40px;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dsq-hl.dsq-hl1{font-size:23px;line-height:23px;padding-top:9px}
.dsq-stage{position:absolute;left:12px;right:12px;top:132px;height:328px;z-index:3}
.dsq-heroWrap{position:absolute;left:0;right:0;top:0;height:100%;display:flex;align-items:center;justify-content:center}
.dsq-hero{max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.dsq-heroPhoto{border-radius:9px;filter:none;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.dsq-pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  border:2px solid rgba(255,255,255,.92);background:rgba(10,10,11,.58);color:#fff;
  font-family:'dsqAdrianna',Arial,sans-serif;font-weight:700;font-size:11px;line-height:20px;text-align:center;
  cursor:pointer;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.5);animation:dsqPulse 2.2s ease-in-out infinite}
.dsq-pin-sm{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;font-size:0;border-width:2.5px;
 background:#F6EAAE;border-color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.55)}
.dsq-pin-sm.dsq-seen{background:#fff;border-color:#F6EAAE}
.dsq-pin.dsq-on{background:#F6EAAE;border-color:#fff;animation:none}
.dsq-pin.dsq-seen{background:rgba(255,255,255,.92);color:#0A0A0B;border-color:rgba(255,255,255,.92);animation:none}
@keyframes dsqPulse{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 0 rgba(255,255,255,.34)}
  60%{box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 8px rgba(255,255,255,0)}}
.dsq-photo{position:absolute;left:0;right:0;top:0;height:126px;border-radius:8px;overflow:hidden;background:#000}
.dsq-photo img{width:100%;height:100%;object-fit:cover;display:block}
/* Interactions that happen on the product, with no bottom panel. */
.dsq-call{position:absolute;z-index:8;max-width:188px;padding:7px 9px;border-radius:8px;
  background:#FBF8F2;color:#0A0A0B;border-left:5px solid #B5292A;box-shadow:0 6px 18px rgba(0,0,0,.5);
  opacity:0;transform:translateY(5px) scale(.97);transition:opacity .16s ease,transform .16s ease;
  pointer-events:none}
.dsq-call.dsq-vis{opacity:1;transform:translateY(0) scale(1)}
.dsq-call .dsq-ct{display:block;font-weight:700;font-size:12px;line-height:14px;letter-spacing:.01em;
  text-transform:uppercase}
.dsq-call .dsq-cb{display:block;margin-top:2px;font-weight:400;font-size:10px;line-height:13px;
  color:rgba(10,10,11,.8)}
.dsq-flipgrid{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dsq-flip{position:relative;border:0;padding:0;background:none;cursor:pointer;height:100%;
  perspective:620px;-webkit-perspective:620px}
.dsq-flip .dsq-face{position:absolute;inset:0;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:6px 8px;text-align:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .4s ease,opacity .12s ease}
.dsq-flip .dsq-front{background:rgba(251,248,242,.95);color:#0A0A0B;transform:rotateY(0deg);
  border:1px solid rgba(0,0,0,.12)}
.dsq-flip .dsq-back{background:#B5292A;color:#fff;transform:rotateY(180deg)}
.dsq-flip.dsq-open .dsq-front{transform:rotateY(-180deg);opacity:0;transition:transform .4s ease,opacity .12s .22s}
.dsq-flip.dsq-open .dsq-back{transform:rotateY(0deg)}
.dsq-fk{font-weight:700;font-size:11px;line-height:13px;letter-spacing:.02em;text-transform:uppercase}
.dsq-fb{margin-top:2px;font-weight:400;font-size:10px;line-height:12px}
.dsq-fhint{margin-top:3px;font-weight:700;font-size:9px;line-height:11px;letter-spacing:.09em;
  text-transform:uppercase;color:#B5292A}
.dsq-thumbs{position:absolute;left:0;right:0;bottom:0;display:grid;gap:7px}
.dsq-thumb{position:relative;border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden;
  background:rgba(251,248,242,.1);padding:0;cursor:pointer;height:100%}
.dsq-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.dsq-thumb.dsq-on{border-color:#B5292A;box-shadow:0 0 0 2px #B5292A inset}
.dsq-cname{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:7;
  padding:5px 12px;border-radius:7px;background:#FBF8F2;color:#0A0A0B;border-left:5px solid #B5292A;
  font-weight:700;font-size:13px;line-height:15px;letter-spacing:.02em;text-transform:uppercase;
  white-space:nowrap;box-shadow:0 5px 14px rgba(0,0,0,.45);
  transition:opacity .14s ease,transform .14s ease}
html.dsq-nm .dsq-cname{opacity:0;transform:translateX(-50%) translateY(6px)}
.dsq-disc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;z-index:0}
.dsq-swapWrap{position:absolute;left:0;right:0;top:0}
.dsq-swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%;
  width:auto;height:auto;display:block;opacity:0;transition:opacity .22s ease;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.dsq-swap.dsq-vis{opacity:1}
.dsq-tiles{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dsq-tiles.dsq-t3{grid-template-columns:1fr 1fr 1fr}
.dsq-tile{position:relative;min-height:42px;border-radius:7px;padding:6px 7px 7px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.3);color:#fff;font-family:inherit;
  display:flex;flex-direction:column;justify-content:center;z-index:6}
.dsq-tile .dsq-tk{font-weight:700;font-size:9px;line-height:11px;letter-spacing:.09em;color:#F6EAAE;
  text-transform:uppercase}
.dsq-tile .dsq-tn{font-weight:700;font-size:11px;line-height:13px;letter-spacing:.02em;text-transform:uppercase}
.dsq-tile.dsq-on{background:#F6EAAE;border-color:#F6EAAE}
.dsq-tile.dsq-on .dsq-tk{color:#0A0A0B}
.dsq-tile.dsq-on .dsq-tn{color:#0A0A0B}
.dsq-tile.dsq-seen{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
.dsq-chiprow{position:absolute;left:12px;right:12px;top:464px;height:18px;z-index:5}
.dsq-hint{position:absolute;left:50%;top:0;transform:translateX(-50%);height:18px;padding:0 10px;border-radius:9px;
  background:rgba(255,255,255,.93);color:#0A0A0B;font-weight:700;font-size:10px;line-height:18px;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dsq-pricebar{position:absolute;left:12px;right:12px;top:484px;height:20px;z-index:4;display:flex;
  align-items:baseline;justify-content:center;gap:7px;white-space:nowrap}
.dsq-pname{font-weight:700;font-size:11px;line-height:14px;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(255,255,255,.88)}
.dsq-pnow{font-family:'dsqWorker',Arial,sans-serif;font-weight:800;font-size:15px;line-height:17px;color:#fff}
.dsq-pwas{font-weight:400;font-size:10px;line-height:13px;color:rgba(255,255,255,.6);text-decoration:line-through}
.dsq-ptag{font-weight:700;font-size:9px;line-height:12px;letter-spacing:.07em;text-transform:uppercase;
  color:#F6EAAE}
.dsq-panel{position:absolute;left:12px;right:12px;top:508px;height:80px;z-index:4;border-radius:9px;
  background:#FBF8F2;border:1px solid rgba(0,0,0,.12);border-left:5px solid #B5292A;
  padding:7px 11px;overflow:hidden;color:#0A0A0B;box-shadow:0 6px 18px rgba(0,0,0,.42);
  transition:border-left-width .17s ease}
html.dsq-sw .dsq-panel{border-left-width:12px}
.dsq-pwrap{transition:opacity .13s ease,transform .13s ease}
html.dsq-sw .dsq-pwrap{opacity:0;transform:translateY(7px)}
.dsq-ptitle{font-weight:700;font-size:16px;line-height:18px;letter-spacing:.01em;text-transform:uppercase;
  color:#0A0A0B}
.dsq-pbody{margin-top:3px;font-weight:400;font-size:11px;line-height:14px;color:rgba(10,10,11,.8)}
.dsq-pbody b{font-weight:700;color:#0A0A0B}
.dsq-cta{position:absolute;left:12px;right:12px;top:596px;height:38px;z-index:7;border:0;border-radius:6px;
  font-family:'dsqWorker',"Arial Black",Impact,sans-serif;font-weight:800;font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#F6EAAE;color:#0A0A0B}
.dsq-hit{position:absolute;left:0;right:0;top:213.34px;bottom:0;z-index:6;background:transparent;
  pointer-events:none}
html.done .dsq-hit{pointer-events:auto}
html.done .dsq-pin,html.done .dsq-tile{pointer-events:none}
html.done .dsq-pin{animation:none}
@media (max-aspect-ratio:9/16){#dsq-fit{top:50%}}
</style>

<script>
(function(){
  var DATA = {"items": [{"t": "Odor Squatching Deodorant", "b": "Wood Barrel Bourbon — smell like Barrel Aged Bourbon. Featuring Arrowroot Powder, Charcoal Powder, Postbiotics.", "n": ""}, {"t": "Natural Bar Soap", "b": "Wood Barrel Bourbon — smell like Barrel Aged Bourbon. Medium grit, featuring Jimmy Red Corn & Sand.", "n": ""}, {"t": "Cologne", "b": "Fireside Bourbon — notes of Oaked Bourbon, Sandalwood, Cinnamon and Amber.", "n": ""}, {"t": "Carry your suds like a legend", "b": "Convenient and built for adventure. Perfectly sized to fit your grooming essentials, so your routine stays organized wherever you go.", "n": ""}], "intro": {"t": "Bar soap, deodorant, cologne", "b": "A clean base, all-day freshness and a go-to scent — so you’re never scrambling before a date, meeting, or big moment."}, "done": {"t": "Verified buyer, 5 stars", "b": "“Love the bag, it’s literally perfect. I love all the scents.” — Dirk, Verified buyer. Rated 4.9 out of 5 based on 151 reviews."}, "url": "https://www.drsquatch.com/products/signature-scent-set-free-toiletry-bag-nco"};
  var CLICK = DATA.url;
  function openLP(){
    try{
      if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function'){
        window.mraid.open(CLICK); return;
      }
    }catch(e){}
    try{ window.open(CLICK, '_blank'); }catch(e){}
  }

  /* ---- fit the 360x640 stage into the ad slot ---- */
  var fit = document.getElementById('dsq-fit');
  function resize(){
    var w = window.innerWidth || 360, h = window.innerHeight || 640;
    fit.style.setProperty('--dsq-s', Math.min(w / 360, h / 640));
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* ---- dynamic date ---- */
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function pad(v){ return (v < 10 ? '0' : '') + v; }
  function promoDate(){
    var q = '', m;
    try{ m = /[?&]promo-date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); }catch(e){}
    if (m){ q = m[1]; }
    try{
      if (!q && typeof window.__PROMO_DATE === 'string' &&
          /^\d{4}-\d{2}-\d{2}$/.test(window.__PROMO_DATE)) { q = window.__PROMO_DATE; }
    }catch(e){}
    var dt;
    if (q){
      var p = q.split('-');
      dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    } else { dt = new Date(); }
    if (isNaN(dt.getTime())) { dt = new Date(); }
    return dt;
  }
  function campaign(dt){
    var k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    if (k >= '2026-11-01' && k <= '2026-11-26') return 'Black Friday Pre-Sale';
    if (k === '2026-11-27') return 'Black Friday';
    if (k === '2026-11-28' || k === '2026-11-29') return 'Black Friday Weekend';
    if (k === '2026-11-30') return 'Cyber Monday';
    return 'Limited Time Offer';
  }
  (function(){
    var dt = promoDate();
    var line = campaign(dt) + ' \u00B7 ' + DAYS[dt.getDay()] + ', ' + MONS[dt.getMonth()] + ' ' + dt.getDate();
    document.getElementById('dsq-date').textContent = line;
  })();

  /* ---- panel ---- */
  var title = document.getElementById('dsq-ptitle');
  var bodyEl = document.getElementById('dsq-pbody');
  /* The words used to swap in place with no transition, which read as nothing
     happening. Now the panel drops its text, widens its accent edge and brings
     the new text back up. */
  var swapT = null;
  var hasPanel = !!(title && bodyEl);
  function write(o){ title.textContent = o.t; bodyEl.textContent = o.b; }
  function show(o, animate){
    var root = document.documentElement;
    if (!hasPanel){ return; }   /* on-product cards carry no bottom panel */
    if (!animate){ write(o); return; }
    if (swapT){ window.clearTimeout(swapT); }
    root.classList.add('dsq-sw');
    swapT = window.setTimeout(function(){
      write(o);
      root.classList.remove('dsq-sw');
      swapT = null;
    }, 140);
  }
  show(DATA.intro);

  /* ---- interaction ---- */
  var nodes = [].slice.call(document.querySelectorAll('[data-qa="tap"][data-i]'));
  var swaps = [].slice.call(document.querySelectorAll('.dsq-swap'));
  var calls = [].slice.call(document.querySelectorAll('.dsq-call'));
  var nameEl = document.getElementById('dsq-cname');
  var nameT = null;
  var seen = [], total = nodes.length, count = 0, finished = false;
  for (var i = 0; i < total; i++){ seen.push(false); }

  function pick(ev){
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    var el = this, idx = Number(el.getAttribute('data-i'));
    for (var j = 0; j < nodes.length; j++){
      nodes[j].classList.remove('dsq-on');
      if (seen[j]) { nodes[j].classList.add('dsq-seen'); }
    }
    el.classList.remove('dsq-seen');
    el.classList.add('dsq-on');
    if (!seen[idx]){
      seen[idx] = true;
      count++;
    }
    for (var s = 0; s < swaps.length; s++){
      if (s === idx){ swaps[s].classList.add('dsq-vis'); }
      else { swaps[s].classList.remove('dsq-vis'); }
    }
    /* a caption anchored to the hotspot that was touched */
    for (var q = 0; q < calls.length; q++){
      if (q === idx){ calls[q].classList.add('dsq-vis'); }
      else { calls[q].classList.remove('dsq-vis'); }
    }
    /* a tile that turns over and stays over */
    if (el.className.indexOf('dsq-flip') > -1){ el.classList.add('dsq-open'); }
    /* the name riding on the image, dropped and brought back so the change shows */
    if (nameEl && DATA.items[idx] && DATA.items[idx].n){
      var root2 = document.documentElement;
      if (nameT){ window.clearTimeout(nameT); }
      root2.classList.add('dsq-nm');
      nameT = window.setTimeout(function(){
        nameEl.textContent = DATA.items[idx].n;
        root2.classList.remove('dsq-nm');
        nameT = null;
      }, 130);
    }
    show(DATA.items[idx], true);
    if (count >= total && !finished){
      finished = true;
      document.getElementById('hint').textContent = 'Tap to shop';
      window.setTimeout(function(){
        show(DATA.done, true);
        document.documentElement.classList.add('done');
      }, 420);
    }
  }
  for (var k = 0; k < nodes.length; k++){
    nodes[k].addEventListener('click', pick);
  }

  document.getElementById('cta').addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation(); openLP();
  });
  document.getElementById('hit').addEventListener('click', function(ev){
    ev.preventDefault(); openLP();
  });
})();
</script>
