:root{--ink:#000;--paper:#fff;--bone:#F2F0ED;--clay:#9E7B68;--sand:#D9CEC5;--grey:#8C8781;
 --line:rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bone);color:var(--ink);
 font-family:TB,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--bone)}
/* ---------- the Black Friday bar ---------- */
.ob{flex:none;position:relative;background:var(--ink);color:var(--paper);padding:10px 14px 11px;text-align:center}
.ob .kick{font-family:TB;font-size:7px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.ob .big{margin-top:5px;font-family:TH;font-size:35px;line-height:.94;letter-spacing:.01em;text-transform:uppercase}
.ob .big em{font-style:normal;font-size:19px;letter-spacing:.12em;vertical-align:.30em;margin-left:5px}
.ob .sub{margin-top:6px;font-family:TB;font-size:7.5px;line-height:1.35;letter-spacing:.14em;
 text-transform:uppercase;color:rgba(255,255,255,.78)}
.ob .dd{margin-top:5px;font-family:TB;font-size:6.5px;letter-spacing:.2em;text-transform:uppercase;
 color:rgba(255,255,255,.46)}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* ---------- panel ---------- */
.pan{flex:none;padding:11px 15px 13px;text-align:center;background:var(--bone);border-top:1px solid var(--line)}
.ttl{font-family:TH;font-size:17px;line-height:1.06;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.ttl em{font-style:normal;color:var(--clay)}
.note{margin-top:5px;font-family:TB;font-size:7.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--grey)}
.prc{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 1px}
.prc s{font-family:TB;font-size:10px;letter-spacing:.1em;color:var(--grey)}
.prc b{font-family:TH;font-size:22px;line-height:1;font-weight:400}
.prc u{text-decoration:none;padding:2px 7px;background:var(--ink);color:var(--paper);
 font-family:TB;font-size:7px;letter-spacing:.14em;text-transform:uppercase}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;
 width:100%;height:44px;margin-top:10px;background:var(--ink);color:var(--paper);font-family:TB;
 font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;overflow:hidden}
.cta span{position:relative;z-index:1}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:24%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);animation:sh 3s ease-in-out infinite 1.1s}
@keyframes sh{0%{left:-40%}45%,100%{left:120%}}
/* ---------- click layer + hint ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 11px 0 9px;
 background:var(--ink);color:var(--paper);font-family:TB;font-size:8px;letter-spacing:.17em;
 text-transform:uppercase;white-space:nowrap;animation:cp 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:12px;height:12px}
html.done .chip{opacity:0;animation:none}
@keyframes cp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:5px;height:5px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
/* ---------- shared stage furniture ---------- */
.gw{position:absolute;inset:0;display:flex;flex-direction:column}
.hl{flex:none;padding:9px 13px 2px;text-align:center;font-family:TH;font-size:16px;line-height:1.04;
 letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.hl em{font-style:normal;color:var(--clay)}
.hs{flex:none;padding:0 14px 3px;text-align:center;font-family:TB;font-size:7px;letter-spacing:.17em;
 text-transform:uppercase;color:var(--grey)}
.off{position:absolute;right:6px;top:6px;z-index:6;padding:2px 6px;background:var(--ink);color:var(--paper);
 font-family:TB;font-size:6.5px;letter-spacing:.12em;text-transform:uppercase}

.sd{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 0 32px;background:var(--paper)}
.sd .stage{flex:1;min-height:0;position:relative;margin:6px 10px 0}
.sd .stage div{position:absolute;inset:0;background:no-repeat center/contain;opacity:0;transition:opacity .32s}
.sd .stage div.on{opacity:1}
.sd .nm{flex:none;padding:6px 10px 4px;text-align:center;font-family:TB;font-size:8px;letter-spacing:.2em;
 text-transform:uppercase;color:var(--ink);min-height:16px}
.sd .dots{flex:none;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:2px 10px 6px}
.dot{position:relative;width:26px;height:26px;border-radius:50%;cursor:pointer;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);transition:transform .2s}
.dot:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--ink);
 opacity:0;transition:opacity .2s}
.dot.sel:after{opacity:1}
.dot.seen{box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 0 0 0 rgba(0,0,0,0)}
.dot:not(.seen):before{content:"";position:absolute;right:-1px;top:-1px;width:7px;height:7px;border-radius:50%;
 background:var(--clay);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
</style>
