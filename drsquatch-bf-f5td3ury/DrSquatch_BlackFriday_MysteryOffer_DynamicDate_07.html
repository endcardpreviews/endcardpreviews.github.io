.scene{position:absolute;inset:0;background:no-repeat center/cover;z-index:0}
.scene:after{content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(10,10,12,.72) 0 20%,rgba(10,10,12,.12) 42%,
 rgba(10,10,12,.30) 72%,rgba(10,10,12,.86) 100%)}
#cv>*{position:relative;z-index:1}
/* ---------- top: logo, then the campaign line and the countdown ---------- */
.top{flex:none;padding:9px 13px 0;text-align:center}
.top .lg{display:block;width:118px;height:auto;margin:0 auto}
.cdl{margin-top:8px;font-family:ADC;font-weight:700;font-size:11px;letter-spacing:.14em;
 text-transform:uppercase;color:rgba(255,255,255,.82)}
.cd{margin-top:5px;display:flex;align-items:stretch;justify-content:center;gap:5px}
.cd u{display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-decoration:none;min-width:50px;padding:4px 7px 3px;border-radius:7px;
 background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px var(--accent)}
.cd u b{font-family:WK;font-weight:800;font-size:22px;line-height:1;color:var(--accent);
 font-variant-numeric:tabular-nums}
.cd u s{text-decoration:none;margin-top:2px;font-family:ADC;font-weight:700;font-size:9px;
 letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.68)}
.cd em{display:flex;align-items:center;font-style:normal;font-family:WK;font-size:16px;
 color:rgba(255,255,255,.3);padding-bottom:10px}
/* ---------- headline, as the client's own pixels ---------- */
.hl{flex:none;padding:8px 13px 0;text-align:center}
.hl img{display:block;max-width:100%;height:auto;margin:0 auto}
.hl .kick{width:62%}
.hl .main{width:92%;margin-top:3px}
.hl img{max-height:84px;object-fit:contain}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* ---------- foot: trust row, CTA, the client's own footnote ---------- */
.ft{flex:none;padding:0 13px 9px;text-align:center}
.ft .trust{display:block;width:62%;height:auto;margin:0 auto 7px;opacity:.9}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;
 width:100%;height:44px;border-radius:7px;background:var(--accent);cursor:pointer;overflow:hidden;
 font-family:ADC;font-weight:700;font-size:17px;letter-spacing:.03em;color:var(--ctaink)}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
 animation:sh 3.2s ease-in-out infinite 1.2s}
@keyframes sh{0%{left:-40%}55%{left:120%}100%{left:120%}}
.ft .fine{margin-top:6px;font-family:AD;font-weight:400;font-size:9px;line-height:1.3;
 color:rgba(255,255,255,.62)}
/* ---------- click contract ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;
 pointer-events:none}
html.done #hit{pointer-events:auto}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;
 pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
 background:rgba(12,12,14,.86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24);
 font-family:ADC;font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
 color:#fff;white-space:nowrap;animation:bob 1.7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}
 50%{transform:translateX(-50%) translateY(-3px)}}
.chip svg{width:13px;height:13px}
html.done .chip{opacity:0;animation:none}

:root{--accent:#E8B23C;--ctaink:#2A0E18}

body.ms,#cv.ms{background:var(--wine)}
.ms .scene:after{background:linear-gradient(180deg,rgba(104,24,47,.55) 0 24%,
 rgba(104,24,47,.18) 46%,rgba(104,24,47,.42) 70%,rgba(104,24,47,.9) 100%)}
.ms .mshead{flex:none;padding:8px 14px 0;text-align:center}
.ms .mshead img{display:block;max-width:100%;height:auto;margin:0 auto}
.ms .mshead .lg{width:120px;margin-bottom:7px}
.ms .mshead .c1{width:88%}
.ms .mshead .c2{width:84%;margin-top:4px}
.ms .mshead .c3{width:50%;margin-top:5px}
.mssc{position:absolute;left:12px;right:12px;top:6px;bottom:40px;border-radius:12px;
 overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.mssc .won{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:6px;padding:10px;background:rgba(104,24,47,.96)}
.mssc .won img{display:block;max-width:100%;height:auto}
.mssc .won .a{width:88%}
.mssc .won .b{width:94%}
.mssc canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}
html.done .mssc canvas{opacity:0;transition:opacity .45s}
</style>
</head>

<script>
(function(){
  var cv=document.getElementById('cv');
  function fit(){
    var w=innerWidth,h=innerHeight,s=Math.min(w/360,h/640);
    cv.style.transform='scale('+s+')'; cv.style.height='640px';
    cv.style.left=Math.round((w-360*s)/2)+'px'; cv.style.top=Math.round((h-640*s)/2)+'px';
  }
  window.__fit=fit; fit(); addEventListener('resize',fit);

  /* DynamicDate + countdown from the viewer's own clock. The live page frames this as a
     Black Friday Pre-Sale, so the campaign line follows the real calendar and the clock
     runs to local midnight. ?promo-date=YYYY-MM-DD and window.__PROMO_DATE both preview
     any day (the preview page drives the second one through the iframe). */
  var q=(location.search.match(/[?&]promo-date=(\d{4}-\d{2}-\d{2})/)||[])[1]
        || (typeof window.__PROMO_DATE==='string'? window.__PROMO_DATE : null);
  var base=q?new Date(q+'T12:00:00'):new Date();
  var DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var y=base.getFullYear(), m=base.getMonth(), day=base.getDate();
  var n1=new Date(y,10,1).getDay(), BFD=1+((4-n1)+7)%7+22, CM=BFD+3;
  var lead = (m===10&&day<BFD) ? 'Black Friday Pre-Sale'
           : (m===10&&day===BFD) ? 'Black Friday \u2014 today only'
           : (m===10&&day>BFD&&day<CM) ? 'Black Friday weekend'
           : (m===10&&day===CM) ? 'Cyber Monday'
           : (m===11&&day<=8) ? 'Final days'
           : 'Limited Time Offer';
  window.PROMO={date:base, lead:lead, stamp:DAY[base.getDay()]+' '+MON[m]+' '+day};
  [].forEach.call(document.querySelectorAll('[data-dd]'),function(e){ e.textContent=lead; });
  [].forEach.call(document.querySelectorAll('[data-dd-date]'),function(e){ e.textContent=window.PROMO.stamp; });
  function pad(n){ return (n<10?'0':'')+n; }
  function tick(){
    var now=q?new Date(base.getTime()+(Date.now()%86400000)):new Date();
    var end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0,0);
    var s=Math.max(0,Math.floor((end-now)/1000));
    var hh=pad(Math.floor(s/3600)), mm=pad(Math.floor(s%3600/60)), ss=pad(s%60);
    [].forEach.call(document.querySelectorAll('[data-cd-h]'),function(e){ e.textContent=hh; });
    [].forEach.call(document.querySelectorAll('[data-cd-m]'),function(e){ e.textContent=mm; });
    [].forEach.call(document.querySelectorAll('[data-cd-s]'),function(e){ e.textContent=ss; });
  }
  tick(); setInterval(tick,1000);

  /* Click-through: MRAID tested BY NAME so the upload scan sees the guard. */
  var LP='https://www.drsquatch.com/pages/sale';
  function open_(){
    if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function') {
      try { if (typeof clickTag !== 'undefined' && clickTag) { window.mraid.open(clickTag); }
            else { window.mraid.open(); } return; } catch (e) {}
    }
    try { window.open(LP,'_blank'); } catch (e) {}
  }
  window.ECG={open:open_};
  var cta=document.getElementById('cta');
  if(cta) cta.addEventListener('click',function(e){ e.stopPropagation(); open_(); });
  var hit=document.getElementById('hit');
  if(hit) hit.addEventListener('click',function(){ open_(); });

  window.FINISH=function(){ document.documentElement.classList.add('done'); };
  window.$=function(id){ return document.getElementById(id); };

  window.SPARK=function(el,n,col){
    var r=el.getBoundingClientRect(), host=document.getElementById('cv');
    var hr=host.getBoundingClientRect(), sc=hr.width/360;
    for(var i=0;i<n;i++){
      var d=document.createElement('i');
      d.style.cssText='position:absolute;z-index:40;pointer-events:none;width:5px;height:5px;'+
        'border-radius:50%;background:'+(i%3?(col||'#E8B23C'):'#fff')+';opacity:.95;'+
        'left:'+((r.left-hr.left)/sc+r.width/sc*Math.random())+'px;'+
        'top:'+((r.top-hr.top)/sc+r.height/sc*Math.random())+'px;'+
        'transition:transform .6s ease-out,opacity .6s ease-out';
      host.appendChild(d);
      (function(d){ requestAnimationFrame(function(){
        d.style.transform='translate('+(Math.random()*40-20)+'px,'+(-18-Math.random()*26)+'px) scale(.3)';
        d.style.opacity='0'; });
        setTimeout(function(){ d.remove(); },700); })(d);
    }
  };

  window.DRAG=function(el,o){
    var sx=0,sy=0,on=false;
    function dn(e){ on=true; var p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY;
      if(e.cancelable) e.preventDefault(); }
    function mv(e){ if(!on) return; var p=e.touches?e.touches[0]:e;
      if(o.move) o.move(p.clientX-sx,p.clientY-sy); if(e.cancelable) e.preventDefault(); }
    function up(e){ if(!on) return; on=false; var p=(e.changedTouches?e.changedTouches[0]:e)||{};
      if(o.end) o.end((p.clientX||sx)-sx,(p.clientY||sy)-sy); }
    el.addEventListener('pointerdown',dn); addEventListener('pointermove',mv); addEventListener('pointerup',up);
    el.addEventListener('touchstart',dn,{passive:false}); addEventListener('touchmove',mv,{passive:false});
    addEventListener('touchend',up);
  };
})();
</script>
<script>(function(){

var c=$('fx'), sc=$('sc'), g=c.getContext('2d'), fired=false, W=0, H=0;
function paint(){
  var r=sc.getBoundingClientRect();
  W=c.width=Math.max(2,Math.round(r.width)); H=c.height=Math.max(2,Math.round(r.height));
  var lg=g.createLinearGradient(0,0,W,H);
  lg.addColorStop(0,'#A32F2A'); lg.addColorStop(.48,'#C4473A'); lg.addColorStop(1,'#8E2626');
  g.globalCompositeOperation='source-over'; g.fillStyle=lg; g.fillRect(0,0,W,H);
  for(var i=0;i<150;i++){ g.fillStyle='rgba(255,210,170,'+(0.07+Math.random()*0.22)+')';
    g.beginPath(); g.arc(Math.random()*W,Math.random()*H,Math.random()*2.6,0,6.3); g.fill(); }
  g.fillStyle='rgba(255,236,214,.95)';
  g.font='700 15px ADC,Helvetica,Arial,sans-serif'; g.textAlign='center';
  g.letterSpacing='2px';
  g.fillText('SCRATCH HERE', W/2, H/2+5);
}
paint(); window.__onfit=paint; addEventListener('resize',function(){ setTimeout(paint,60); });
var drawing=false;
function at(e){ var r=c.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
  return [(p.clientX-r.left)/r.width*W,(p.clientY-r.top)/r.height*H]; }
function rub(e){ if(!drawing) return; var q=at(e);
  g.globalCompositeOperation='destination-out';
  g.beginPath(); g.arc(q[0],q[1],Math.max(17,W*0.085),0,6.3); g.fill();
  if(e.cancelable) e.preventDefault(); check(); }
function check(){
  if(fired) return;
  var d=g.getImageData(0,0,W,H).data, clear=0, step=40, tot=0;
  for(var i=3;i<d.length;i+=4*step){ tot++; if(d[i]<40) clear++; }
  if(clear/tot>0.42){ fired=true; SPARK(sc,26,'#E8B23C'); setTimeout(FINISH,340); }
}
c.addEventListener('pointerdown',function(e){ drawing=true; rub(e); });
addEventListener('pointermove',rub); addEventListener('pointerup',function(){ drawing=false; });
c.addEventListener('touchstart',function(e){ drawing=true; rub(e); },{passive:false});
addEventListener('touchmove',rub,{passive:false}); addEventListener('touchend',function(){ drawing=false; });

})();</script>
