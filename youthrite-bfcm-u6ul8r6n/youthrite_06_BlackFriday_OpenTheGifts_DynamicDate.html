*{box-sizing:border-box;margin:0;padding:0}
:root{--u:min(1vw,.5625vh);--red:#FF2D1F;--deep:#4A0705;--ink:#fff;--navy:#1C2452}
html,body{width:100%;height:100%;overflow:hidden;background:#240302}
body{font-family:Inter,Helvetica,Arial,sans-serif;font-weight:500;color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.card{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;background:radial-gradient(125% 62% at 50% 42%,#7C130E 0%,#5C0C09 38%,#3A0605 70%,#240302 100%)}
.bar{flex:none;width:100%;height:calc(var(--u)*9);background:#000;display:flex;align-items:center;justify-content:center;gap:.5em;font-weight:700;font-size:calc(var(--u)*3.3);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*4) rgba(0,0,0,.45);position:relative;z-index:2}
.bar em{font-style:normal;color:var(--red)}
.gi{width:1.25em;height:1.25em;flex:none}
.band{flex:none;width:100%;height:calc(var(--u)*12);display:flex;align-items:flex-end;justify-content:center;color:#fff}
.logo{height:calc(var(--u)*6.4);width:auto;display:block}
h1{font-weight:400;font-style:italic;letter-spacing:-.02em;color:#fff;font-size:calc(var(--u)*7);line-height:1.1}
h1 b{font-weight:700}
h1 u{text-decoration-thickness:.07em;text-underline-offset:.08em}
.pouch{display:block;pointer-events:none;filter:drop-shadow(0 calc(var(--u)*3) calc(var(--u)*6) rgba(0,0,0,.55))}
.top{flex:none;width:100%;height:calc(var(--u)*38);display:flex;align-items:center;gap:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*7) 0;text-align:left}
.top .pouch{height:calc(var(--u)*32);width:auto;flex:none;transform:rotate(-5deg)}
.top h1{flex:1;min-width:0}
.mid{flex:1;min-height:0;width:100%;padding:calc(var(--u)*3) calc(var(--u)*7) 0;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2.4)}
#hint{flex:none;margin-top:calc(var(--u)*3);padding:.7em 1.3em;border-radius:999px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);font-weight:700;font-size:calc(var(--u)*2.9);line-height:1;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
html.done #hint{visibility:hidden}
.foot{flex:none;width:100%;padding:calc(var(--u)*3.5) calc(var(--u)*7) calc(var(--u)*6.5);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4)}
#cta{position:relative;z-index:6;width:100%;height:calc(var(--u)*14);border:0;border-radius:999px;background:#fff;color:var(--deep);font:700 calc(var(--u)*4.4)/1 Inter,Helvetica,Arial,sans-serif;letter-spacing:-.005em;cursor:pointer;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*5) rgba(0,0,0,.4)}
#cta:active{filter:brightness(.92)}
.legal{font-weight:500;font-size:max(9px,calc(var(--u)*2.2));line-height:1.3;color:#D9B4AF;max-width:46em}
#hit{position:absolute;left:0;right:0;top:33.4%;bottom:0;z-index:5;pointer-events:none}
html.done #hit{pointer-events:auto;cursor:pointer}
html.done [data-qa]{pointer-events:none}
.tile{border:1px solid rgba(255,255,255,.3);border-radius:calc(var(--u)*3);background:rgba(20,2,2,.38);font:inherit;color:#fff;cursor:pointer}
.chk{flex:none;width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.chk::after{content:"";width:34%;height:18%;border-left:calc(var(--u)*.7) solid var(--navy);border-bottom:calc(var(--u)*.7) solid var(--navy);transform:translateY(-18%) rotate(-45deg)}

.gifts{flex:0 1 calc(var(--u)*52);min-height:0;display:flex;gap:calc(var(--u)*2.6)}
.g{position:relative;flex:1;min-width:0;height:100%;padding:0;overflow:hidden;display:block}
.box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s .15s,transform .5s}
.box i{display:block;position:relative;background:#fff}
.box .lid{width:calc(var(--u)*20);height:calc(var(--u)*5);border-radius:calc(var(--u)*1);z-index:1;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.box .body{width:calc(var(--u)*17.5);height:calc(var(--u)*15);border-radius:0 0 calc(var(--u)*1) calc(var(--u)*1);background:#F3EBEA}
