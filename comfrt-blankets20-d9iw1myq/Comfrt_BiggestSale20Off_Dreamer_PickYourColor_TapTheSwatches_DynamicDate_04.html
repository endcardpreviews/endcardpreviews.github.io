<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Comfrt — four plush colorways</title>
<style>
@font-face{font-family:'Times LT Std';src:url(fonts/TimesLTStd-Roman.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/DMSans-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Rock Salt';src:url(fonts/RockSalt-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Acumin Pro Cond';src:url(fonts/AcuminProCond-Bold.woff2) format('woff2');font-weight:700;font-style:normal;font-display:swap}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A <button> ignores the inherited family and takes Chrome's Arial 13.333px.
   Every tappable element below is a button, so this line is what keeps the
   brand faces on the things the user actually touches. */
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;background:none;border:0}
html,body{height:100%;background:#F9F7F4;overflow:hidden}
body{font-family:'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif;color:#313030;
  letter-spacing:.05em;-webkit-font-smoothing:antialiased}
#cf-fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cf-card{position:relative;width:360px;height:640px;overflow:hidden;display:flex;
  flex-direction:column;background:#F9F7F4;user-select:none;-webkit-user-select:none}

/* ---------- head: wordmark, the offer, the Today Only ribbon ---------- */
.cf-head{flex:0 0 auto;padding:12px 16px 9px;text-align:center}
.cf-head .brandlogo{display:block;width:84px;height:25px;margin:0 auto;fill:#313030}
.cf-kick{display:block;margin-top:7px;font-family:'Rock Salt','Comic Sans MS',cursive;
  font-weight:400;font-size:10px;line-height:2.1;letter-spacing:.21em;text-transform:none;
  color:#313030}
.cf-offer{display:block;font-family:'Times LT Std','Times New Roman',Georgia,serif;
  font-weight:400;font-style:normal;font-size:31px;line-height:.9;letter-spacing:-.04em;
  color:#313030}
.cf-rib{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:6px 14px;
  border-radius:999px;background:#B3261E;color:#fff;font-weight:600;font-size:10.5px;
  line-height:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.18)}
.cf-rib i{width:6px;height:6px;border-radius:50%;background:#fff;animation:cfblink 1.1s infinite}
@keyframes cfblink{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- stage ---------- */
.cf-stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  align-items:center;padding:0 16px}
.cf-h{flex:0 0 auto;text-align:center;font-family:'Times LT Std','Times New Roman',Georgia,serif;
  font-weight:400;font-size:23px;line-height:.98;letter-spacing:-.04em;color:#313030}
.cf-sub{flex:0 0 auto;margin-top:7px;text-align:center;font-size:11.5px;line-height:1.45;
  letter-spacing:.05em;color:#A09E99}

/* ---------- the Clinicians' Choice lockup ---------- */
.cf-clin{flex:0 0 auto;display:block;width:188px;margin:0 auto}

/* ---------- hint chip ---------- */
.cf-hint{position:relative;z-index:40;flex:0 0 auto;align-self:center;margin:0 auto 8px;
  padding:6px 13px;border-radius:999px;background:rgba(49,48,48,.07);
  border:1px solid rgba(49,48,48,.16);font-weight:600;font-size:9.5px;line-height:12px;
  letter-spacing:.12em;text-transform:uppercase;color:#313030;white-space:nowrap}

/* ---------- CTA ---------- */
.cf-cta{position:relative;z-index:40;flex:0 0 auto;display:block;width:calc(100% - 32px);
  margin:0 16px 13px;height:50px;border-radius:5px;background:#8E282B;color:#fff;
  font-family:'Acumin Pro Cond','Arial Narrow',Helvetica,sans-serif;font-weight:700;
  font-size:17px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 6px 18px rgba(142,40,43,.32)}

#hit{position:absolute;left:0;right:0;bottom:0;height:66.7%;z-index:30;pointer-events:none}
html.done #hit{pointer-events:auto}
html.done .cf-tap{pointer-events:none}

.cf-cwwrap{flex:0 0 auto;width:100%;margin:auto auto 0;display:flex;flex-direction:column}
.cf-cwhero{position:relative;width:100%;height:176px;border-radius:11px;overflow:hidden;
  background:#EFECE7}
.cf-cwhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .34s}
.cf-cwhero img.on{opacity:1}
.cf-cwnm{flex:0 0 auto;margin-top:9px;text-align:center;
  font-family:'Times LT Std','Times New Roman',Georgia,serif;font-weight:400;font-size:20px;
  line-height:1;letter-spacing:-.04em;color:#313030}
.cf-sws{flex:0 0 auto;display:flex;justify-content:center;gap:10px;margin-top:11px}
.cf-sw{width:52px;cursor:pointer;text-align:center}
.cf-sw span{display:block;width:46px;height:46px;margin:0 auto;border-radius:50%;
  background-size:cover;background-position:50% 50%;
  box-shadow:0 0 0 1.5px rgba(49,48,48,.18);transition:box-shadow .2s,transform .2s}
.cf-sw.on span{box-shadow:0 0 0 2px #8E282B,0 0 0 4.5px rgba(142,40,43,.22);
  transform:translateY(-2px)}
.cf-sw b{display:block;margin-top:6px;font-weight:600;font-size:9.5px;line-height:12px;
  letter-spacing:.08em;text-transform:uppercase;color:#A09E99}
.cf-sw.on b{color:#8E282B}
.cf-count{flex:0 0 auto;margin:10px auto auto;text-align:center;font-weight:600;font-size:10px;
  line-height:13px;letter-spacing:.12em;text-transform:uppercase;color:#A09E99}
</style>
</head>

<script>

function cfOpen(){
  var u = (typeof clickTag !== 'undefined' && clickTag) ? clickTag : null;
  /* MRAID written out by name: the upload scan reads an aliased guard as unguarded. */
  if (typeof window.mraid !== 'undefined' && window.mraid &&
      typeof window.mraid.open === 'function') {
    try { if (u) { window.mraid.open(u); } else { window.mraid.open(); } return; } catch (e) {}
  }
  try { window.open(u || 'https://try.comfrt.com/presell/stress-x-clinicians-blanket', '_blank'); } catch (e) {}
}
document.getElementById('cta').addEventListener('click', function(ev){
  ev.preventDefault(); ev.stopPropagation(); cfOpen();
});
document.getElementById('hit').addEventListener('click', function(ev){
  ev.preventDefault(); cfOpen();
});

/* the viewer's own device date in the Today Only ribbon */
(function(){
  var q = new URLSearchParams(location.search).get('promo-date');
  var d = q ? new Date(q + 'T12:00:00') : new Date();
  var M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var el = document.getElementById('cf-date');
  if (el) { el.textContent = M[d.getMonth()] + ' ' + d.getDate(); }
})();

var CF_DONE = false;
function cfFinish(){
  if (CF_DONE) return; CF_DONE = true;
  var h = document.getElementById('hint');
  if (h && window.CF_DONE_HINT) { h.textContent = window.CF_DONE_HINT; }
  /* a beat later, so the completing tap is not re-dispatched onto #hit */
  window.setTimeout(function(){ document.documentElement.classList.add('done'); }, 420);
}

window.CF_DONE_HINT = "Tap to shop";


(function(){
  var sw=[].slice.call(document.querySelectorAll('.cf-sw')),
      hs=[].slice.call(document.querySelectorAll('.cf-cwhero img')),
      nm=document.getElementById('cf-cwnm'),
      c=document.getElementById('cf-count'), T='Seen %d of 4', seen={0:1};
  c.textContent=T.replace('%d','1');
  sw.forEach(function(s,i){
    s.addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      sw.forEach(function(o,j){ o.classList.toggle('on', j===i); });
      hs.forEach(function(h,j){ h.classList.toggle('on', j===i); });
      nm.textContent = s.querySelector('b').textContent;
      seen[i]=1; var n=Object.keys(seen).length;
      c.textContent=T.replace('%d', n);
      if(n>=sw.length){ c.textContent='Four plush colorways'; cfFinish(); }
    });
  });
})();

</script>
