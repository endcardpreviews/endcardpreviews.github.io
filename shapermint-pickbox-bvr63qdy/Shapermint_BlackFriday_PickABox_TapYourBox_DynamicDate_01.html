*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#292929;overflow:hidden}
body{font-family:'shmAvenir','Avenir Next','Helvetica Neue',Arial,sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased}
#shm-fit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--shm-s,1));
  transform-origin:50% 50%;width:360px;height:640px}
.shm-card{position:relative;width:360px;height:640px;overflow:hidden;
  background:radial-gradient(120% 60% at 50% 0%, #882A2B 0%, #292929 70%)}

.shm-logo{display:block;margin:0 auto;height:19px;width:auto;color:#fff}
.shm-top{position:absolute;left:0;right:0;top:15px;text-align:center;z-index:4}
.shm-pill{display:inline-block;margin-top:11px;background:#F7A08B;color:#292929;font-weight:900;
  font-size:11px;line-height:13px;letter-spacing:.02em;text-transform:uppercase;
  padding:5px 13px;border-radius:999px}
.shm-h1{margin-top:8px;font-weight:900;font-size:36px;line-height:38px;letter-spacing:-.015em;
  color:#F7A08B}
.shm-sub{margin-top:3px;font-weight:700;font-size:13px;line-height:16px;color:#fff}
.shm-rule{position:absolute;left:24px;right:24px;top:158px;z-index:4;display:flex;align-items:center;gap:9px}
.shm-rule i{flex:1 1 auto;height:1px;background:rgba(255,255,255,.3)}
.shm-rule span{flex:0 0 auto;font-weight:700;font-size:10.5px;line-height:13px;letter-spacing:.03em;
  color:#fff;white-space:nowrap}

/* the slot that holds the gift you win */
.shm-slot{position:absolute;left:50%;top:180px;transform:translateX(-50%);width:120px;height:132px;
  z-index:4;border-radius:10px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;overflow:hidden}
.shm-lock{display:flex;flex-direction:column;align-items:center;gap:7px;transition:opacity .2s ease}
.shm-lock svg{display:block;opacity:.85}
.shm-lock span{font-weight:700;font-size:11px;line-height:13px;color:rgba(255,255,255,.88)}
.shm-won{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;transform:scale(.9);transition:opacity .3s ease,transform .3s ease}
.shm-won img{width:88px;height:88px;object-fit:contain;display:block}
.shm-won .shm-cap{margin-top:3px;font-weight:700;font-size:11px;line-height:13px;text-align:center;
  color:#fff}
.shm-disc{position:absolute;right:5px;top:5px;width:52px;height:52px;border-radius:50%;
  background:#D3373C;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.shm-disc s{font-weight:700;font-size:9.5px;color:rgba(255,255,255,.9)}
.shm-disc b{font-weight:900;font-size:13px;color:#fff;letter-spacing:.01em}
html.shm-open .shm-lock{opacity:0}
html.shm-open .shm-won{opacity:1;transform:scale(1)}

/* the nine boxes */
.shm-grid{position:absolute;left:30px;right:30px;top:320px;z-index:4;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,62px);gap:6px}
.shm-box{position:relative;border:0;background:none;padding:0;cursor:pointer;display:block}
.shm-box i{position:absolute;inset:0;display:block;background-position:center;
  background-repeat:no-repeat;background-size:contain;
  filter:drop-shadow(0 4px 9px rgba(0,0,0,.4));transition:transform .18s ease,opacity .2s ease}

<script>
(function(){
  var CLICK = 'https://shapermint.com/pages/bf-pick-a-box-ebra-free-product';
  function openLP(){
    try{
      if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function'){
        window.mraid.open(CLICK); return;
      }
    }catch(e){}
    try{ window.open(CLICK, '_blank'); }catch(e){}
  }

  var fit = document.getElementById('shm-fit');
  function resize(){
    var w = window.innerWidth || 360, h = window.innerHeight || 640;
    fit.style.setProperty('--shm-s', Math.min(w / 360, h / 640));
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* ---- the campaign line, off the viewer's own device date ---- */
  var MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function pad(v){ return (v < 10 ? '0' : '') + v; }
  function promoDate(){
    var q = '', m;
    try{ m = /[?&]promo-date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); }catch(e){}
    if (m){ q = m[1]; }
    try{
      if (!q && typeof window.__PROMO_DATE === 'string' &&
          /^\d{4}-\d{2}-\d{2}$/.test(window.__PROMO_DATE)) { q = window.__PROMO_DATE; }
    }catch(e){}
    var dt;
    if (q){ var p = q.split('-'); dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0); }
    else { dt = new Date(); }
    if (isNaN(dt.getTime())) { dt = new Date(); }
    return dt;
  }
  function campaign(dt){
    var k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    if (k >= '2026-11-01' && k <= '2026-11-26') return 'Black Friday';
    if (k === '2026-11-27') return 'Black Friday';
    if (k === '2026-11-28' || k === '2026-11-29') return 'Black Friday Weekend';
    if (k === '2026-11-30') return 'Cyber Monday';
    if (k >= '2026-12-01' && k <= '2026-12-02') return 'Cyber Week';
    return 'Limited Time Offer';
  }
  (function(){
    var dt = promoDate();
    document.getElementById('shm-date').innerHTML =
      '\u2728 ' + campaign(dt) + ' \u00B7 ' + MONS[dt.getMonth()] + ' ' + dt.getDate() + ' \u2728';
  })();

  /* ---- confetti, as the page does on a pick ---- */
  var COLORS = ['#F7A08B','#D3373C','#FFD166','#8FD9C4','#FFFFFF','#F4A5C7'];
  function burst(){
    var host = document.getElementById('shm-conf');
    for (var i = 0; i < 34; i++){
      var el = document.createElement('i');
      el.style.left = (4 + Math.random() * 92) + '%';
      el.style.background = COLORS[i % COLORS.length];
      el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      el.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
      el.style.animation = 'shmFall ' + (1.5 + Math.random() * 1.1).toFixed(2) +
                           's linear ' + (Math.random() * 0.35).toFixed(2) + 's 1 forwards';
      host.appendChild(el);
    }
    window.setTimeout(function(){ host.innerHTML = ''; }, 3200);
  }

  /* ---- the pick ---- */
  var boxes = [].slice.call(document.querySelectorAll('.shm-box'));
  var picked = false;
  function pick(ev){
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    if (picked) return;
    picked = true;
    var el = this;
    el.classList.add('shm-picked');
    burst();
    document.documentElement.classList.add('shm-open');
    document.getElementById('shm-ctat').textContent = 'Claim your free gift';
    document.getElementById('hint').textContent = 'Tap to claim';
    /* One pick is the whole game on the live page, so the card finishes here. The
       click-through is switched on a beat later: flipping it on inside the same tap
       let the browser re-dispatch that tap onto the layer and open the page. */
    window.setTimeout(function(){
      document.documentElement.classList.add('done');
    }, 420);
  }
  for (var k = 0; k < boxes.length; k++){ boxes[k].addEventListener('click', pick); }

  document.getElementById('cta').addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation(); openLP();
  });
  document.getElementById('hit').addEventListener('click', function(ev){
    ev.preventDefault(); openLP();
  });
})();
