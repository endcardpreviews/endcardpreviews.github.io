*{box-sizing:border-box;margin:0;padding:0}
:root{--u:min(1vw,.5625vh);--navy:#1B2D45;--sky:#E2F0FD;--red:#F50000;--ink:#0A0908}
html,body{width:100%;height:100%;overflow:hidden;background:var(--sky)}
body{font-family:Poppins,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.card{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--sky);overflow:hidden}
.band{flex:none;width:100%;height:calc(var(--u)*13);background:#fff;display:flex;align-items:center;justify-content:center;color:#1C2452}
.logo{height:calc(var(--u)*6.4);width:auto;display:block}
.label{flex:none;margin-top:calc(var(--u)*4.5);font-weight:600;font-size:calc(var(--u)*5.4);line-height:1.1;color:var(--red);text-transform:uppercase;white-space:nowrap}
h1{font-weight:900;font-size:calc(var(--u)*7);line-height:1.12;letter-spacing:-.01em}
.pouch{display:block;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*3) rgba(27,45,69,.28));pointer-events:none}
#hint{flex:none;margin-top:calc(var(--u)*3);padding:.55em 1.1em;border-radius:999px;background:var(--navy);color:#fff;font-weight:600;font-size:calc(var(--u)*3.6);line-height:1;white-space:nowrap;pointer-events:none}
html.done #hint{visibility:hidden}
.foot{flex:none;width:100%;padding:calc(var(--u)*3.5) calc(var(--u)*7) calc(var(--u)*7);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4)}
#cta{position:relative;z-index:6;width:100%;height:calc(var(--u)*14);border:0;border-radius:calc(var(--u)*1.6);background:var(--navy);color:#fff;font:700 calc(var(--u)*4.6)/1 Poppins,Helvetica,Arial,sans-serif;letter-spacing:.01em;cursor:pointer}
#cta:active{filter:brightness(1.25)}
.legal{font-weight:600;font-size:max(9px,calc(var(--u)*2.2));line-height:1.3;color:#4A5A6C;max-width:46em}
#hit{position:absolute;left:0;right:0;top:33.4%;bottom:0;z-index:5;pointer-events:none}
html.done #hit{pointer-events:auto;cursor:pointer}
html.done [data-qa]{pointer-events:none}

:root{--navy:#0E1A2A;--navy2:#1B2D45;--gold:#D8BC84;--gold2:#B8935A;--ink:#F4EFE6}
html,body{background:#0E1A2A}
.card{background:radial-gradient(120% 70% at 50% 38%,#24405F 0%,#16263A 48%,#0E1A2A 100%);color:var(--ink)}
.band{background:transparent;color:#fff;height:calc(var(--u)*15);position:relative}
.band::after{content:"";position:absolute;left:50%;bottom:0;width:calc(var(--u)*14);height:1px;margin-left:calc(var(--u)*-7);background:var(--gold)}
.logo{height:calc(var(--u)*6.8)}
.label{margin-top:calc(var(--u)*4.2);font-weight:600;font-size:calc(var(--u)*3.3);letter-spacing:.24em;color:var(--gold);padding-left:.24em}
h1{font-weight:600;letter-spacing:-.015em;color:#fff;font-size:calc(var(--u)*6.6);line-height:1.16}
.pouch{filter:drop-shadow(0 calc(var(--u)*3) calc(var(--u)*6) rgba(0,0,0,.5))}
#hint{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(216,188,132,.55);font-size:calc(var(--u)*2.9);letter-spacing:.2em;text-transform:uppercase;padding:.7em 1.2em .7em 1.4em}
#cta{border-radius:999px;background:linear-gradient(#EAD3A0,#C29E62);color:#0E1A2A;font-weight:700;font-size:calc(var(--u)*3.9);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 calc(var(--u)*1.5) calc(var(--u)*5) rgba(0,0,0,.35)}
.legal{color:#8E9DB0;font-weight:600}

.head{flex:none;padding:calc(var(--u)*3) calc(var(--u)*7) 0}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*5);padding:calc(var(--u)*2) calc(var(--u)*7) 0}
.stage .pouch{height:min(100%,calc(var(--u)*66));width:auto;max-width:44%;object-fit:contain}
.tk{position:relative;flex:none;width:calc(var(--u)*42);height:calc(var(--u)*42);border-radius:calc(var(--u)*5);overflow:hidden;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:.95}
.tk small{font-weight:700;font-size:calc(var(--u)*4.2);letter-spacing:.04em}
.tk b{font-weight:900;font-size:calc(var(--u)*13.5);letter-spacing:-.03em}
.tk span{font-weight:900;font-size:calc(var(--u)*8)}
.tk canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .35s}
html.done .tk canvas{opacity:0}

.tk{background:#0E1A2A;box-shadow:inset 0 0 0 1px var(--gold),0 calc(var(--u)*3) calc(var(--u)*6) rgba(0,0,0,.4);color:#fff;border-radius:calc(var(--u)*4)}
.tk small{font-weight:600;font-size:calc(var(--u)*3);letter-spacing:.28em;color:var(--gold);padding-left:.28em;margin-bottom:calc(var(--u)*1.5)}
