:root{--cream:#FCF7F3;--sand:#F7E3D0;--ink:#382E2E;--orange:#E88C3B;--tan:#E8C9A6;
 --cocoa:#6A5039;--night:#1A1412;--line:rgba(56,46,46,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
 font-family:HG,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* ---------- the Black Friday banner: logo, offer, one live line ---------- */
.ob{flex:none;position:relative;background:var(--night);color:var(--cream);padding:9px 13px 10px;
 text-align:center;overflow:hidden}
.ob:before{content:"";position:absolute;inset:0;
 background:radial-gradient(130% 150% at 50% -20%,rgba(232,140,59,.22),transparent 62%)}
.ob .lg{position:relative;display:block;width:112px;height:auto;margin:0 auto 7px}
.ob .big{position:relative;font-family:FR;font-weight:600;font-size:31px;line-height:.98;
 letter-spacing:-.01em;color:var(--cream)}
.ob .big em{font-style:normal;color:var(--orange)}
.ob .cd{position:relative;margin-top:7px;display:flex;align-items:center;justify-content:center;gap:7px;
 font-family:HG;font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--cream)}
.ob .cd b{font-family:FR;font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--orange);
 font-variant-numeric:tabular-nums}
.ob .cd i{font-style:normal;opacity:.5}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* ---------- panel ---------- */
.pan{flex:none;padding:10px 15px 12px;text-align:center;background:var(--cream);border-top:1px solid var(--line)}
.ttl{font-family:FR;font-weight:600;font-size:19px;line-height:1.06;letter-spacing:-.01em;color:var(--ink)}
.ttl em{font-style:normal;color:var(--cocoa)}
.note{margin-top:5px;font-family:HG;font-weight:600;font-size:10px;letter-spacing:.07em;
 text-transform:uppercase;color:#8A7A72}
.prc{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 1px}
.prc s{font-family:HG;font-weight:600;font-size:12px;color:#A3948C}
.prc b{font-family:FR;font-weight:600;font-size:25px;line-height:1}
.prc u{text-decoration:none;padding:2px 7px;border-radius:999px;background:var(--orange);color:#fff;
 font-family:HG;font-weight:700;font-size:9px;letter-spacing:.09em;text-transform:uppercase}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;
 width:100%;height:46px;margin-top:9px;border-radius:999px;background:var(--orange);color:#fff;
 font-family:HG;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
 cursor:pointer;overflow:hidden}
.cta span{position:relative;z-index:1}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);animation:sh 3s ease-in-out infinite 1.1s}
@keyframes sh{0%{left:-40%}45%,100%{left:120%}}
/* ---------- click layer + hint ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 10px;border-radius:999px;
 background:var(--ink);color:var(--cream);font-family:HG;font-weight:700;font-size:10px;letter-spacing:.08em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(56,46,46,.55);
 animation:cp 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:13px;height:13px}
html.done .chip{opacity:0;animation:none}
@keyframes cp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
/* ---------- shared stage furniture ---------- */
.gw{position:absolute;inset:0;display:flex;flex-direction:column}
.hl{flex:none;padding:9px 13px 3px;text-align:center;font-family:FR;font-weight:600;font-size:17px;
 line-height:1.06;letter-spacing:-.01em;color:var(--ink)}
.hl em{font-style:normal;color:var(--cocoa)}
.hs{flex:none;padding:0 14px 3px;text-align:center;font-family:HG;font-weight:600;font-size:10px;
 letter-spacing:.07em;text-transform:uppercase;color:#8A7A72}

.gr{flex:1;min-height:0;display:grid;gap:6px;padding:8px 11px 34px}
.tl{position:relative;perspective:720px;cursor:pointer}
.tf{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1,.4,1)}
.tl.open .tf{transform:rotateY(180deg)}
.fc,.bc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 border-radius:10px;overflow:hidden}
.fc{background:#fff;border:1.5px solid rgba(56,46,46,.14);transform:rotateY(0deg);transition:opacity .12s .22s}
.tl.open .fc{opacity:0}
.bc{background:var(--ink);color:var(--cream);transform:rotateY(180deg)}
.fc .im{width:100%;flex:1;min-height:0;background:no-repeat center/cover;border-radius:6px}
.fc b{flex:none;margin-top:5px;font-family:HG;font-weight:700;font-size:10px;letter-spacing:.06em;
 text-transform:uppercase;color:var(--ink)}
.bc i{font-style:normal;font-family:FR;font-weight:600;font-size:15px;line-height:1.04;color:var(--orange)}
.bc u{text-decoration:none;margin-top:5px;font-family:HG;font-weight:600;font-size:10px;line-height:1.4;
 color:#D8CCC4}
.tl.open{animation:pop .4s ease}
@keyframes pop{40%{transform:scale(1.035)}}
</style>
</head>

<script>
(function(){
  var cv=document.getElementById('cv'), R=document.documentElement;
  function fit(){ var W=innerWidth,H=innerHeight,s=Math.min(W/360,H/640); cv.style.height=(H/s)+'px';
    cv.style.transform='translate('+((W-360*s)/2)+'px,0) scale('+s+')'; window.__S=s;
    var y=0, st=[];
    [].forEach.call(cv.children,function(el){
      if(el.id==='hit') return;
      var h=el.offsetHeight*s; if(h<1) return;
      var c=el, bg=getComputedStyle(c).backgroundColor, n=0;
      while((!bg||/^rgba\(0, 0, 0, 0\)$|^transparent$/.test(bg)) && c.firstElementChild && n++<3){
        c=c.firstElementChild; bg=getComputedStyle(c).backgroundColor; }
      if(!bg||/^rgba\(0, 0, 0, 0\)$|^transparent$/.test(bg)) bg='#FCF7F3';
      st.push(bg+' '+Math.round(y)+'px '+Math.round(y+h)+'px'); y+=h; });
    if(st.length) document.body.style.background='linear-gradient(180deg,'+st.join(',')+')';
    if(window.__onfit) window.__onfit(); }
  window.__fit=fit; fit(); addEventListener('resize',fit);

  /* DynamicDate + countdown, both from the viewer's own clock.
     ?promo-date=YYYY-MM-DD previews any day. The site's own framing is
     "Sale ends in ..." / "This deal ends tonight", so the clock runs to local midnight. */
  var q=(location.search.match(/[?&]promo-date=(\d{4}-\d{2}-\d{2})/)||[])[1];
  var base=q?new Date(q+'T12:00:00'):new Date();
  var DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var y=base.getFullYear(), m=base.getMonth(), day=base.getDate();
  var n1=new Date(y,10,1).getDay(), BFD=1+((4-n1)+7)%7+22, CM=BFD+3;
  var lead = (m===10&&day<BFD) ? 'Black Friday starts now'
           : (m===10&&day===BFD) ? 'Black Friday \u2014 today'
           : (m===10&&day>BFD&&day<CM) ? 'Black Friday weekend'
           : (m===10&&day===CM) ? 'Cyber Monday'
           : (m===11&&day<=8) ? 'Final days'
           : 'Limited time offer';
  window.PROMO={date:base, lead:lead, stamp:DAY[base.getDay()]+' '+MON[m]+' '+day};
  [].forEach.call(document.querySelectorAll('[data-dd]'),function(e){ e.textContent=lead; });
  [].forEach.call(document.querySelectorAll('[data-dd-date]'),function(e){ e.textContent=window.PROMO.stamp; });
  function pad(n){ return (n<10?'0':'')+n; }
  function tick(){
    var now=q?new Date(base.getTime()+(Date.now()%86400000)):new Date();
    var end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0,0);
    var s=Math.max(0,Math.floor((end-now)/1000));
    var txt=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
    [].forEach.call(document.querySelectorAll('[data-cd]'),function(e){ e.textContent=txt; });
  }
  tick(); setInterval(tick,1000);

  /* click-through: the campaign click URL via MRAID; the browser fallback is preview only.
     MRAID is tested by name so the upload asset scan can see the guard. */
  var last=-1e9;
  window.OPEN=function(){ var t=Date.now(); if(t-last<250) return; last=t;
    var u=window.clickTag||window.clickTag1||'';
    if(typeof window.mraid!=='undefined' && window.mraid && typeof window.mraid.open==='function'){
      try{ if(u) window.mraid.open(u); else window.mraid.open(); return; }catch(e){}
    }
    window.open(u||'https://pelsbarn.org/pages/luxurious-sofa-bed-bogo-bfcm-gift','_blank'); };
  document.getElementById('cta').addEventListener('click',function(e){ e.stopPropagation(); OPEN(); });
  document.getElementById('hit').addEventListener('click',function(){ OPEN(); });
  var cbs=[]; window.ONDONE=function(f){ cbs.push(f); };
  window.FINISH=function(){ if(R.classList.contains('done')) return; R.classList.add('done');
    cbs.forEach(function(f){ try{f()}catch(e){} }); setTimeout(fit,500); };
  window.$=function(id){ return document.getElementById(id); };
  window.LOCAL=function(el,e){ var r=el.getBoundingClientRect(), k=el.offsetWidth/(r.width||1);
    return {x:(e.clientX-r.left)*k, y:(e.clientY-r.top)*k, w:el.offsetWidth, h:el.offsetHeight}; };
  window.SPARK=function(el,n){ var s=window.__S||1, a=el.getBoundingClientRect(), b=cv.getBoundingClientRect(),
      x=(a.left+a.width/2-b.left)/s, y=(a.top+a.height/2-b.top)/s, C=['#E88C3B','#F7E3D0','#6A5039','#382E2E'];
    for(var i=0;i<(n||16);i++){ var p=document.createElement('i'), t=Math.random()*Math.PI*2,
        v=44+Math.random()*70, z=4+Math.random()*6;
      p.className='cf'; p.style.left=x+'px'; p.style.top=y+'px'; p.style.width=p.style.height=z+'px';
      p.style.borderRadius='50%';
      p.style.setProperty('--dx',Math.cos(t)*v+'px'); p.style.setProperty('--dy',Math.sin(t)*v+'px');
      p.style.setProperty('--r',(Math.random()*360-180)+'deg'); p.style.background=C[i%C.length];
      cv.appendChild(p); (function(p){setTimeout(function(){p.remove()},1150)})(p); } };
  window.DRAG=function(el,h){ var on=false,x0=0,y0=0,dx=0,dy=0;
    el.addEventListener('pointerdown',function(e){ if(R.classList.contains('done')) return; on=true; x0=e.clientX; y0=e.clientY;
      dx=dy=0; try{el.setPointerCapture(e.pointerId)}catch(_){ } if(h.start) h.start(e); e.preventDefault(); });
    el.addEventListener('pointermove',function(e){ if(!on) return; var s=window.__S||1;
      dx=(e.clientX-x0)/s; dy=(e.clientY-y0)/s; if(h.move) h.move(dx,dy,e); });
    function up(e){ if(!on) return; on=false; if(h.end) h.end(dx,dy,e); }
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
    el.addEventListener('click',function(e){ e.stopPropagation(); }); };
  window.SCRATCH=function(c,o){ var x=c.getContext('2d'), GW=o.gw||16, GH=o.gh||8, cells={}, got=0, lp=null, started=false;
    function size(){ var w=c.offsetWidth,h=c.offsetHeight; if(!w||!h) return false;
      if(c.width!==w*2||c.height!==h*2){ c.width=w*2; c.height=h*2; } return true; }
    function paint(){ if(started||!size()) return; x.globalCompositeOperation='source-over';
      x.clearRect(0,0,c.width,c.height); o.paint(x,c.width,c.height); }
    function rub(e){ started=true; var q2=LOCAL(c,e), s=c.width/q2.w, X=q2.x*s, Y=q2.y*s;
      x.globalCompositeOperation='destination-out'; x.lineCap='round'; x.lineJoin='round'; x.lineWidth=(o.brush||48);
      x.beginPath(); if(lp){ x.moveTo(lp[0],lp[1]); x.lineTo(X,Y); } else { x.moveTo(X,Y); x.lineTo(X+.1,Y); }
      x.stroke(); lp=[X,Y];
      for(var a=-1;a<=1;a++) for(var b=-1;b<=1;b++){ var gx=Math.floor(X/c.width*GW)+a, gy=Math.floor(Y/c.height*GH)+b,
          k=gy*GW+gx; if(gx>=0&&gy>=0&&gx<GW&&gy<GH&&!cells[k]){ cells[k]=1; got++; } }
      if(got/(GW*GH)>(o.done||.5)) FINISH(); }
    DRAG(c,{ start:function(e){ lp=null; rub(e); }, move:function(dx,dy,e){ rub(e); }, end:function(){ lp=null; } });
    return {paint:paint}; };
})();
