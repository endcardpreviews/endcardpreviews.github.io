:root{--cream:#FCF7F3;--sand:#F7E3D0;--ink:#382E2E;--orange:#E88C3B;--tan:#E8C9A6;
 --cocoa:#6A5039;--night:#1A1412;--line:rgba(56,46,46,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
 font-family:HG,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
 -webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none}
#cv{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;display:flex;flex-direction:column;
 overflow:hidden;background:var(--cream)}
/* ---------- the Black Friday banner: logo, offer, one live line ---------- */
.ob{flex:none;position:relative;background:var(--night);color:var(--cream);padding:9px 13px 10px;
 text-align:center;overflow:hidden}
.ob:before{content:"";position:absolute;inset:0;
 background:radial-gradient(130% 150% at 50% -20%,rgba(232,140,59,.22),transparent 62%)}
.ob .lg{position:relative;display:block;width:112px;height:auto;margin:0 auto 7px}
.ob .big{position:relative;font-family:FR;font-weight:600;font-size:31px;line-height:.98;
 letter-spacing:-.01em;color:var(--cream)}
.ob .big em{font-style:normal;color:var(--orange)}
.ob .cd{position:relative;margin-top:7px;display:flex;align-items:center;justify-content:center;gap:7px;
 font-family:HG;font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--cream)}
.ob .cd b{font-family:FR;font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--orange);
 font-variant-numeric:tabular-nums}
.ob .cd i{font-style:normal;opacity:.5}
/* ---------- stage ---------- */
.ph{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
/* ---------- panel ---------- */
.pan{flex:none;padding:10px 15px 12px;text-align:center;background:var(--cream);border-top:1px solid var(--line)}
.ttl{font-family:FR;font-weight:600;font-size:19px;line-height:1.06;letter-spacing:-.01em;color:var(--ink)}
.ttl em{font-style:normal;color:var(--cocoa)}
.note{margin-top:5px;font-family:HG;font-weight:600;font-size:10px;letter-spacing:.07em;
 text-transform:uppercase;color:#8A7A72}
.prc{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 1px}
.prc s{font-family:HG;font-weight:600;font-size:12px;color:#A3948C}
.prc b{font-family:FR;font-weight:600;font-size:25px;line-height:1}
.prc u{text-decoration:none;padding:2px 7px;border-radius:999px;background:var(--orange);color:#fff;
 font-family:HG;font-weight:700;font-size:9px;letter-spacing:.09em;text-transform:uppercase}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;
 width:100%;height:46px;margin-top:9px;border-radius:999px;background:var(--orange);color:#fff;
 font-family:HG;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
 cursor:pointer;overflow:hidden}
.cta span{position:relative;z-index:1}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:26%;
 background:linear-gradient(100deg,transparent,rgba(255,255,255,.34),transparent);animation:sh 3s ease-in-out infinite 1.1s}
@keyframes sh{0%{left:-40%}45%,100%{left:120%}}
/* ---------- click layer + hint ---------- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:20;pointer-events:none;
 display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px 0 10px;border-radius:999px;
 background:var(--ink);color:var(--cream);font-family:HG;font-weight:700;font-size:10px;letter-spacing:.08em;
 text-transform:uppercase;white-space:nowrap;box-shadow:0 5px 14px -5px rgba(56,46,46,.55);
 animation:cp 1.9s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:13px;height:13px}
html.done .chip{opacity:0;animation:none}
@keyframes cp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.cf{position:absolute;z-index:90;width:6px;height:6px;pointer-events:none;
 animation:cf 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
/* ---------- shared stage furniture ---------- */
.gw{position:absolute;inset:0;display:flex;flex-direction:column}
.hl{flex:none;padding:9px 13px 3px;text-align:center;font-family:FR;font-weight:600;font-size:17px;
 line-height:1.06;letter-spacing:-.01em;color:var(--ink)}
.hl em{font-style:normal;color:var(--cocoa)}
.hs{flex:none;padding:0 14px 3px;text-align:center;font-family:HG;font-weight:600;font-size:10px;
 letter-spacing:.07em;text-transform:uppercase;color:#8A7A72}

.sc{position:absolute;inset:0;background:var(--cream)}
.sc .pl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:12px}
.sc .pl .im{width:100%;flex:1;min-height:0;background:no-repeat center/contain;margin-bottom:7px}
.sc .pl i{font-style:normal;font-family:HG;font-weight:700;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--cocoa)}
.sc .pl b{display:block;margin-top:4px;font-family:FR;font-weight:600;font-size:26px;line-height:1.02;
 letter-spacing:-.01em;color:var(--ink)}
.sc .pl b em{font-style:normal;color:var(--orange)}
.sc .pl .pz{margin-top:7px;display:flex;align-items:baseline;gap:9px}
.sc .pl .pz s{font-family:HG;font-weight:600;font-size:13px;color:#A3948C}
.sc .pl .pz u{text-decoration:none;font-family:FR;font-weight:600;font-size:30px;line-height:1;color:var(--ink)}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
html.done .sc canvas{opacity:0;transition:opacity .4s;pointer-events:none}
</style>
</head>
