.ws-pm1{display:block;font-weight:600;font-size:11.5px;line-height:14px;letter-spacing:.04em;
  color:#fff;text-transform:uppercase;white-space:nowrap}
.ws-pm2{display:block;font-weight:400;font-size:11px;line-height:13px;letter-spacing:.04em;
  color:#fff;text-transform:uppercase;white-space:nowrap}

.ws-top{position:absolute;left:0;right:0;top:48px;text-align:center;z-index:4}
.ws-logo{display:block;margin:0 auto;height:15px;width:auto}
.ws-hl{font-weight:700;font-size:21px;line-height:23px;letter-spacing:-.01em;margin-top:9px;
  height:46px;text-transform:uppercase;color:#0B0B0C}
.ws-hl.ws-hl1{font-size:24px;line-height:26px;padding-top:10px}

.ws-stage{position:absolute;left:12px;right:12px;top:124px;height:432px;z-index:3}

/* 2x2 catalog grid */
.ws-grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:8px}
.ws-cell{position:relative;border:1px solid #E4E5E9;border-radius:10px;background:#fff;
  overflow:hidden;padding:0;cursor:pointer;display:flex;flex-direction:column;
  transition:border-color .16s ease,box-shadow .16s ease}
.ws-cell.ws-on{border-color:#5F39A4;box-shadow:0 0 0 2px #5F39A4 inset}
.ws-shot{position:relative;flex:1 1 auto;min-height:0;background:#fff}
.ws-shot img{width:100%;height:100%;object-fit:contain;display:block}
.ws-chip{position:absolute;left:6px;top:6px;z-index:2;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.ws-chip b{display:block;background:#0B0B0C;color:#fff;font-weight:600;font-size:9px;line-height:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:2px}
.ws-chip b.ws-new{background:#5F39A4}
.ws-meta{flex:0 0 auto;padding:5px 7px 7px;text-align:left;background:#fff}
.ws-nm{display:block;font-weight:600;font-size:9.5px;line-height:11px;letter-spacing:.03em;
  text-transform:uppercase;color:#0B0B0C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-pr{display:block;margin-top:2px;font-weight:700;font-size:13px;line-height:15px;color:#0B0B0C}
.ws-pr s{font-weight:400;font-size:10px;color:#8E9198;margin-left:4px}

/* category board */
.ws-flip{position:relative;border:0;padding:0;background:none;cursor:pointer;height:100%;width:100%;
  perspective:640px;-webkit-perspective:640px}
.ws-flip .ws-face{position:absolute;inset:0;border-radius:10px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .42s ease,opacity .12s ease;border:1px solid #E4E5E9;background:#fff}
.ws-flip .ws-front{transform:rotateY(0deg);display:flex;flex-direction:column}
.ws-flip .ws-back{transform:rotateY(180deg);background:#5F39A4;border-color:#5F39A4;
  color:#fff;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  padding:7px;text-align:left}
.ws-flip.ws-open .ws-front{transform:rotateY(-180deg);opacity:0;
  transition:transform .42s ease,opacity .12s .24s}
.ws-flip.ws-open .ws-back{transform:rotateY(0deg)}

/* THE BACK OF A TILE IS A DEAL CARD, NOT A PARAGRAPH (Emily, 2026-11-24).
   The product it sells stays on the face, the price lockup is the hero, and the
   one line of words is a phrase, not a sentence. */
.ws-dealTop{position:relative;flex:1 1 auto;min-height:0;border-radius:7px;overflow:hidden;
  background-color:#fff;background-repeat:no-repeat;background-position:50% 50%;display:block}
.ws-dealTop.ws-fitC{background-size:contain}
.ws-dealTop.ws-fitX{background-size:cover}
.ws-dealChip{position:absolute;left:5px;top:5px;z-index:2;font-weight:700;font-size:9px;
  line-height:11px;letter-spacing:.08em;text-transform:uppercase;color:#5F39A4;
  background:#fff;padding:2px 5px;border-radius:2px;box-shadow:0 1px 4px rgba(11,11,12,.2)}
.ws-dealPrice{display:block;flex:0 0 auto;margin-top:6px;font-weight:700;font-size:19px;
  line-height:21px;letter-spacing:-.015em;color:#fff}
.ws-dealPrice s{font-weight:400;font-size:11px;letter-spacing:0;margin-left:5px;
  color:rgba(255,255,255,.66)}
.ws-dealLine{display:block;flex:0 0 auto;margin-top:2px;font-weight:600;font-size:9.5px;
  line-height:12px;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.88)}
.ws-dealGo{display:flex;flex:0 0 auto;align-items:center;justify-content:center;gap:4px;
  margin-top:6px;height:19px;border-radius:3px;background:#fff;color:#5F39A4;
  font-weight:700;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}

/* NO-FLIP TILES (Emily, 2026-11-24: "some designs don't need to be flipped, and it just
   shows the products"). The packshot never turns over or gets covered: the tap rings the
   tile, lifts the product and drops a purple saving bar in under the price. */
html.ws-reveal .ws-flip{perspective:none;-webkit-perspective:none}
html.ws-reveal .ws-flip .ws-back{display:none}
html.ws-reveal .ws-flip .ws-front{transition:box-shadow .18s ease,border-color .18s ease}
html.ws-reveal .ws-flip.ws-open .ws-front{transform:rotateY(0deg);opacity:1;
  border-color:#5F39A4;box-shadow:0 0 0 2px #5F39A4 inset}
html.ws-reveal .ws-shot img,html.ws-reveal .ws-tileFace img{transition:transform .26s ease}
html.ws-reveal .ws-flip.ws-open .ws-shot img,
html.ws-reveal .ws-flip.ws-open .ws-tileFace img{transform:scale(1.06)}
.ws-revBar{display:block;overflow:hidden;max-height:0;opacity:0;
  transition:max-height .26s ease,opacity .2s ease,margin-top .26s ease}
.ws-flip.ws-open .ws-revBar{max-height:22px;opacity:1;margin-top:4px}
.ws-revBar b{display:block;background:#5F39A4;color:#fff;font-weight:700;font-size:9px;
  line-height:16px;letter-spacing:.04em;text-transform:uppercase;text-align:center;
  border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A board tile is too short to stack a bar under its name plate without squeezing the
   packshot below the 120px floor (card 08's tiles are 164x138), so the name plate itself
   becomes the price plate: same strip, same height, nothing newly over the product. */
.ws-tileFace .ws-lblAlt{position:absolute;left:0;right:0;bottom:0;z-index:3;
  background:#5F39A4;color:#fff;font-weight:700;font-size:9px;line-height:12px;
  letter-spacing:.04em;text-transform:uppercase;padding:5px 4px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;
  transition:opacity .22s ease}
.ws-tileFace .ws-lbl{transition:opacity .22s ease}
.ws-flip.ws-open .ws-tileFace .ws-lbl{opacity:0}
.ws-flip.ws-open .ws-tileFace .ws-lblAlt{opacity:1}
.ws-board{position:absolute;inset:0;display:grid;gap:8px}
.ws-tileBtn{position:relative;border:1px solid #E4E5E9;border-radius:10px;overflow:hidden;
  background:#fff;padding:0;cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease}
.ws-tileBtn.ws-on{border-color:#5F39A4;box-shadow:0 0 0 2px #5F39A4 inset}
.ws-tileBtn img{width:100%;height:100%;object-fit:cover;display:block}
.ws-board.ws-fitContain .ws-tileFace img{object-fit:contain;background:#fff}
.ws-tileFace{padding:0}
/* the row treatment: the product sits on a tinted panel beside its own label and price */
/* .ws-flip .ws-front sets flex-direction:column and outranks a single class, which
   pushed the row's text out of the tile entirely — match its specificity here. */
.ws-flip .ws-front.ws-rowFace{display:flex;flex-direction:row;align-items:center;gap:10px;
  padding:0 12px 0 0;background:linear-gradient(90deg,#F2ECFB 0%,#FBFAFE 62%)}
.ws-rowFace .ws-rimg{flex:0 0 auto;width:120px;height:100%;display:block;object-fit:contain;
  background:#fff;border-right:1px solid #E4E5E9}
.ws-rowTxt{flex:1 1 auto;min-width:0;text-align:left}
.ws-rowTxt .ws-rk{display:block;font-weight:700;font-size:9.5px;line-height:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#5F39A4}
.ws-rowTxt .ws-rn{display:block;margin-top:2px;font-weight:700;font-size:15px;line-height:17px;
  letter-spacing:-.005em;text-transform:uppercase;color:#0B0B0C}
.ws-rowTxt .ws-rp{display:block;margin-top:3px;font-weight:600;font-size:11px;line-height:13px;
  color:rgba(11,11,12,.66)}
.ws-rowTxt .ws-rgo{display:inline-block;margin-top:5px;font-weight:700;font-size:9.5px;line-height:11px;
  letter-spacing:.1em;text-transform:uppercase;color:#fff;background:#5F39A4;
  padding:3px 7px;border-radius:3px}
/* the row's back keeps the packshot exactly where it was, so turning the tile over
   changes the panel beside the product rather than hiding the product */
.ws-flip .ws-back.ws-rowBack{flex-direction:row;align-items:center;gap:10px;padding:0 12px 0 0}
.ws-rowBack .ws-rimg{flex:0 0 auto;width:120px;height:100%;display:block;
  background-color:#fff;background-size:contain;background-repeat:no-repeat;
  background-position:50% 50%;border-right:1px solid #5F39A4}
.ws-rowBack .ws-rbTxt{flex:1 1 auto;min-width:0;text-align:left}
.ws-rowBack .ws-rbk{display:block;font-weight:700;font-size:9px;line-height:11px;letter-spacing:.11em;
  text-transform:uppercase;color:rgba(255,255,255,.8)}
.ws-rowBack .ws-rbp{display:block;margin-top:1px;font-weight:700;font-size:21px;line-height:23px;
  letter-spacing:-.015em;color:#fff}
.ws-rowBack .ws-rbl{display:block;margin-top:2px;font-weight:600;font-size:9.5px;line-height:12px;
  letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.86)}
.ws-rowBack .ws-rbgo{display:inline-block;margin-top:6px;font-weight:700;font-size:9.5px;
  line-height:11px;letter-spacing:.11em;text-transform:uppercase;color:#5F39A4;background:#fff;
  padding:3px 8px;border-radius:3px}
.ws-tileFace img{width:100%;height:100%;object-fit:cover;display:block}
.ws-tileFace .ws-lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);
  font-weight:700;font-size:10px;line-height:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 4px;color:#0B0B0C;text-align:center}
.ws-tileBtn .ws-lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);
  font-weight:700;font-size:10px;line-height:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 4px;color:#0B0B0C;text-align:center}

/* video carousel — a real track, so the next clip peeks in at both edges */
.ws-reel{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;gap:10px}
.ws-vwrap{position:relative;width:100%;height:300px;flex:0 0 auto;overflow:hidden}
.ws-vtrack{position:absolute;left:0;top:0;height:100%;display:flex;gap:12px;
  transition:transform .40s cubic-bezier(.22,.61,.36,1)}
.ws-slide{position:relative;width:214px;height:100%;flex:0 0 auto;border-radius:14px;
  overflow:hidden;background:#111;transform:scale(.90);opacity:.42;
  transition:transform .40s cubic-bezier(.22,.61,.36,1),opacity .34s ease,box-shadow .34s ease}
.ws-slide.ws-vis{transform:scale(1);opacity:1;box-shadow:0 10px 26px rgba(11,11,12,.22)}
.ws-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* the clip's own frame furniture: a counter pill and a bottom scrim with the shade name */
.ws-num{position:absolute;left:9px;top:9px;z-index:3;display:flex;align-items:center;gap:5px;
  height:19px;padding:0 8px;border-radius:10px;background:rgba(11,11,12,.62);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  font-weight:700;font-size:9.5px;line-height:19px;letter-spacing:.1em;color:#fff;
  opacity:0;transition:opacity .3s ease}
.ws-slide.ws-vis .ws-num{opacity:1}
.ws-num i{display:block;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9}
.ws-slide .ws-scrim{position:absolute;left:0;right:0;bottom:0;height:62px;z-index:2;
  background:linear-gradient(0deg,rgba(11,11,12,.72) 0%,rgba(11,11,12,0) 100%)}
.ws-slide .ws-cap{position:absolute;left:10px;right:10px;bottom:8px;z-index:3;text-align:left;
  font-weight:600;font-size:10px;line-height:12px;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;opacity:0;transition:opacity .3s ease}
.ws-slide.ws-vis .ws-cap{opacity:1}
/* the product card under the reel */
.ws-pcards{flex:0 0 auto;width:100%;position:relative;height:62px}
.ws-pcard{position:absolute;inset:0;display:flex;align-items:stretch;border:1px solid #E4E5E9;
  border-radius:12px;background:#fff;overflow:hidden;opacity:0;
  transition:opacity .22s ease;box-shadow:0 3px 12px rgba(11,11,12,.06)}
.ws-pcard.ws-vis{opacity:1}
.ws-pcard .ws-pthumb{flex:0 0 auto;width:62px;height:100%;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#F2ECFB 0%,#FBFAFE 100%);
  border-right:1px solid #E4E5E9}
.ws-pcard .ws-pthumb img{width:54px;height:54px;object-fit:contain;display:block}
.ws-pcard .ws-ptxt{flex:1 1 auto;min-width:0;text-align:left;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:center}
.ws-pcard .ws-prow{display:flex;align-items:center;gap:6px;min-width:0}
.ws-pcard .ws-poff{flex:0 0 auto;font-weight:700;font-size:9px;
  line-height:11px;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:#5F39A4;
  padding:2px 5px;border-radius:2px}
.ws-pcard .ws-pgo{flex:0 0 auto;width:30px;display:flex;align-items:center;justify-content:center;
  color:#5F39A4;font-weight:700;font-size:15px;line-height:1}
/* a segmented progress bar reads as a reel; plain dots read as a slideshow */
.ws-dots{flex:0 0 auto;display:flex;gap:5px;justify-content:center;width:100%;padding:0 2px}
.ws-dot{flex:1 1 0;height:3px;border-radius:2px;background:#E4E5E9;border:0;padding:0;cursor:pointer;
  position:relative;overflow:hidden;transition:background .2s ease}
.ws-dot:after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:#5F39A4;
  transition:width .36s ease}
.ws-dot.ws-seen:after{width:100%;background:#B9BCC2}
.ws-dot.ws-on:after{width:100%;background:#5F39A4}
.ws-pcard .ws-ptxt .ws-nm{font-size:10.5px;line-height:12px}
.ws-pcard .ws-ptxt .ws-pr{margin-top:3px;font-size:15px;line-height:17px}
.ws-pcard .ws-ptxt .ws-pr s{font-size:11px;margin-left:5px}

/* hero */
.ws-heroWrap{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 85% at 18% 22%, #7E57C2 0%, #5F39A4 38%, #3C2168 72%, #241140 100%)}
.ws-heroWrap img{position:absolute;left:0;right:0;bottom:0;width:100%;height:262px;
  object-fit:cover;object-position:50% 18%;display:block}
.ws-spark{position:absolute;border-radius:50%;background:#fff;opacity:.55}
.ws-disc{position:absolute;left:50%;top:150px;transform:translate(-50%,-50%);
  width:96px;height:96px;border-radius:50%;background:#5F39A4;color:#fff;border:0;cursor:pointer;
  font-weight:700;font-size:13px;line-height:15px;letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;text-align:center;z-index:5;
  box-shadow:0 6px 18px rgba(11,11,12,.3);transition:transform .2s ease}
.ws-disc.ws-on{transform:translate(-50%,-50%) scale(1.08)}
.ws-stamp{position:absolute;left:30px;right:30px;top:250px;z-index:5;text-align:center;
  opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease}
.ws-stamp.ws-vis{opacity:1;transform:translateY(0)}
.ws-stamp .ws-s1{display:block;font-weight:600;font-size:12px;line-height:14px;letter-spacing:.14em;
  text-transform:uppercase;color:#fff}
.ws-stamp .ws-s2{display:block;font-weight:700;font-size:27px;line-height:29px;letter-spacing:-.02em;
  text-transform:uppercase;
  /* the banner's own headline is a brushed-silver fill, not flat white */
  background:linear-gradient(176deg,#FFFFFF 6%,#E7E4EE 34%,#A79FB8 56%,#F3F1F7 78%,#CFC9DB 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}

.ws-chiprow{position:absolute;left:12px;right:12px;top:560px;height:18px;z-index:5}
.ws-hint{position:absolute;left:50%;top:0;transform:translateX(-50%);height:18px;padding:0 11px;
  border-radius:9px;background:#0B0B0C;color:#fff;font-weight:600;font-size:9.5px;line-height:18px;
  letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}


.ws-cta{position:absolute;left:12px;right:12px;top:588px;height:40px;z-index:7;border:0;
  border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#5F39A4;color:#fff}
.ws-hit{position:absolute;left:0;right:0;top:213.34px;bottom:0;z-index:6;background:transparent;
  pointer-events:none}
html.done .ws-hit{pointer-events:auto}
html.done .ws-cell,html.done .ws-tileBtn,html.done .ws-dot,html.done .ws-disc{pointer-events:none}

    }catch(e){}
    try{ window.open(CLICK, '_blank'); }catch(e){}
  }

  /* ---- fit the 360x640 stage into the ad slot ---- */
  var fit = document.getElementById('ws-fit');
  function resize(){
    var w = window.innerWidth || 360, h = window.innerHeight || 640;
    fit.style.setProperty('--ws-s', Math.min(w / 360, h / 640));
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* ---- dynamic date ---- */
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function pad(v){ return (v < 10 ? '0' : '') + v; }
  function promoDate(){
    var q = '', m;
    try{ m = /[?&]promo-date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); }catch(e){}
    if (m){ q = m[1]; }
    try{
      if (!q && typeof window.__PROMO_DATE === 'string' &&
          /^\d{4}-\d{2}-\d{2}$/.test(window.__PROMO_DATE)) { q = window.__PROMO_DATE; }
    }catch(e){}
    var dt;
    if (q){
      var p = q.split('-');
      dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    } else { dt = new Date(); }
    if (isNaN(dt.getTime())) { dt = new Date(); }
    return dt;
  }
  function campaign(dt){
    var k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    if (k >= '2026-11-01' && k <= '2026-11-26') return 'Black Friday Sale';
    if (k === '2026-11-27') return 'Black Friday';
    if (k === '2026-11-28' || k === '2026-11-29') return 'Black Friday Weekend';
    if (k === '2026-11-30') return 'Cyber Monday';
    if (k >= '2026-12-01' && k <= '2026-12-02') return 'Cyber Week';
    return 'Limited Time Offer';
  }
  (function(){
    var dt = promoDate();
    var line = campaign(dt) + ' \u00B7 ' + DAYS[dt.getDay()] + ', ' + MONS[dt.getMonth()] + ' ' + dt.getDate();
    document.getElementById('ws-date').textContent = line;
  })();

  /* ---- panel ---- */
  var title = document.getElementById('ws-ptitle');
  var bodyEl = document.getElementById('ws-pbody');
  /* The words used to swap in place with no transition, which read as nothing
     happening. Now the panel drops its text, widens its accent edge and brings
     the new text back up. */
  var swapT = null;
  var hasPanel = !!(title && bodyEl);
  function write(o){ title.textContent = o.t; bodyEl.textContent = o.b; }
  function show(o, animate){
    var root = document.documentElement;
    if (!hasPanel){ return; }   /* on-product cards carry no bottom panel */
    if (!animate){ write(o); return; }
    if (swapT){ window.clearTimeout(swapT); }
    root.classList.add('ws-sw');
    swapT = window.setTimeout(function(){
      write(o);
      root.classList.remove('ws-sw');
      swapT = null;
    }, 140);
  }
  show(DATA.intro);

  /* ---- video reel ---- */
  var vids  = [].slice.call(document.querySelectorAll('.ws-vid'));
  var stamp = document.querySelector('.ws-stamp');
  var pcards= [].slice.call(document.querySelectorAll('.ws-pcard'));
  var slides= [].slice.call(document.querySelectorAll('.ws-slide'));
  var track = document.getElementById('ws-track');

  /* the reel is a track, not a stack: centre the chosen clip and let its neighbours
     peek in at both edges, which is what tells the viewer there is more to swipe. */
  function centre(idx){
    if (!track || !slides.length) return;
    var port = track.parentNode.offsetWidth || 336;
    var sw = slides[0].offsetWidth || 214;
    var gap = 12;
    track.style.transform = 'translateX(' + ((port - sw) / 2 - idx * (sw + gap)) + 'px)';
  }
  centre(0);
  window.addEventListener('resize', function(){
    for (var i = 0; i < slides.length; i++){
      if (slides[i].classList.contains('ws-vis')){ centre(i); return; }
    }
  });

  function playOnly(idx){
    for (var i = 0; i < vids.length; i++){
      if (i === idx){
        vids[i].classList.add('ws-vis');
        try{ vids[i].muted = true; var pr = vids[i].play(); if (pr && pr.catch){ pr.catch(function(){}); } }catch(e){}
      } else {
        vids[i].classList.remove('ws-vis');
        try{ vids[i].pause(); }catch(e){}
      }
    }
    for (var s = 0; s < slides.length; s++){
      if (s === idx){ slides[s].classList.add('ws-vis'); }
      else { slides[s].classList.remove('ws-vis'); }
    }
    centre(idx);
  }
  /* EC checklist item 5: a creative that carries video must stop it when the slot is
     not viewable and start it again when it is. */
  function setPaused(paused){
    for (var i = 0; i < vids.length; i++){
      if (!vids[i].classList.contains('ws-vis')) continue;
      try{ if (paused){ vids[i].pause(); } else { vids[i].muted = true; vids[i].play(); } }catch(e){}
    }
  }
  try{
    if (typeof window.mraid !== 'undefined' && window.mraid &&
        typeof window.mraid.addEventListener === 'function'){
      window.mraid.addEventListener('viewableChange', function(viewable){ setPaused(!viewable); });
    }
  }catch(e){}
  document.addEventListener('visibilitychange', function(){ setPaused(document.hidden); });

  /* ---- interaction ---- */
  var nodes = [].slice.call(document.querySelectorAll('[data-qa="tap"][data-i]'));
  var seen = [], total = nodes.length, count = 0, finished = false;
  for (var i = 0; i < total; i++){ seen.push(false); }

  function pick(ev){
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    var el = this, idx = Number(el.getAttribute('data-i'));
    /* On a flip card only one tile is ever face-down, so a product stays on screen
       throughout. On a no-flip card nothing is hidden in the first place, so every
       tile keeps what it revealed and the finished state shows all of them. */
    var keepAll = document.documentElement.classList.contains('ws-reveal');
    for (var j = 0; j < nodes.length; j++){
      nodes[j].classList.remove('ws-on');
      if (!keepAll && nodes[j] !== this){ nodes[j].classList.remove('ws-open'); }
      if (seen[j]) { nodes[j].classList.add('ws-seen'); }
    }
    el.classList.remove('ws-seen');
    el.classList.add('ws-on');
    /* a tile turns over where it stands and stays over */
    if (el.className.indexOf('ws-flip') > -1){ el.classList.add('ws-open'); }
    if (vids.length){
      playOnly(idx);
      for (var q = 0; q < pcards.length; q++){
        if (q === idx){ pcards[q].classList.add('ws-vis'); }
        else { pcards[q].classList.remove('ws-vis'); }
      }
    }
    if (stamp){ stamp.classList.add('ws-vis'); }
    if (!seen[idx]){
      seen[idx] = true;
      count++;
    }
    show(DATA.items[idx], true);
    if (count >= total && !finished){
      finished = true;
      document.getElementById('hint').textContent = 'Tap to shop';
      window.setTimeout(function(){
        show(DATA.done, true);
        document.documentElement.classList.add('done');
      }, 420);
    }
  }
  for (var k = 0; k < nodes.length; k++){
    nodes[k].addEventListener('click', pick);
  }

  var reel = document.querySelector('.ws-vwrap');
  if (reel && nodes.length){
    var sx = null, cur = 0, lastTouch = 0;
    function step(dir){
      cur = (cur + (dir > 0 ? 1 : nodes.length - 1)) % nodes.length;
      nodes[cur].click();
    }
    reel.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
    reel.addEventListener('touchend', function(e){
      if (document.documentElement.classList.contains('done')) return;
      lastTouch = Date.now();
      var dx = (sx === null) ? 0 : e.changedTouches[0].clientX - sx;
      sx = null;
      /* a touch that does not travel is a tap: advance it too, because a touch-only
         tap never produces a click in headless playback */
      step(dx < -24 ? 1 : (dx > 24 ? -1 : 1));
    });
    reel.addEventListener('click', function(e){
      if (document.documentElement.classList.contains('done')) return;
      e.preventDefault(); e.stopPropagation();
      if (Date.now() - lastTouch < 700) return;   /* the browser's synthesized click */
      step(1);
    });
  }

  document.getElementById('cta').addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation(); openLP();
  });
  document.getElementById('hit').addEventListener('click', function(ev){
    ev.preventDefault(); openLP();
  });
})();
</script>
</body>
</html>
