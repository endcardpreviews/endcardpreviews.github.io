.ws-pm1{display:block;font-weight:700;font-size:12px;line-height:14px;letter-spacing:.06em;
  color:#fff;text-transform:uppercase;white-space:nowrap}
.ws-pm2{display:block;font-weight:400;font-size:11px;line-height:13px;letter-spacing:.03em;
  color:#fff;text-transform:uppercase;white-space:nowrap}

.ws-top{position:absolute;left:0;right:0;top:48px;text-align:center;z-index:4}
.ws-logo{display:block;margin:0 auto;height:15px;width:auto}
.ws-hl{font-weight:700;font-size:21px;line-height:23px;letter-spacing:-.01em;margin-top:9px;
  height:46px;text-transform:uppercase;color:#0B0B0C}
.ws-hl.ws-hl1{font-size:24px;line-height:26px;padding-top:10px}

.ws-stage{position:absolute;left:12px;right:12px;top:124px;height:432px;z-index:3}

/* 2x2 catalog grid */
.ws-grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:8px}
.ws-cell{position:relative;border:1px solid #E4E5E9;border-radius:10px;background:#fff;
  overflow:hidden;padding:0;cursor:pointer;display:flex;flex-direction:column;
  transition:border-color .16s ease,box-shadow .16s ease}
.ws-cell.ws-on{border-color:#5F39A4;box-shadow:0 0 0 2px #5F39A4 inset}
.ws-shot{position:relative;flex:1 1 auto;min-height:0;background:#fff}
.ws-shot img{width:100%;height:100%;object-fit:contain;display:block}
.ws-chip{position:absolute;left:6px;top:6px;z-index:2;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.ws-chip b{display:block;background:#0B0B0C;color:#fff;font-weight:600;font-size:9px;line-height:11px;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:2px}
.ws-chip b.ws-new{background:#5F39A4}
.ws-meta{flex:0 0 auto;padding:5px 7px 7px;text-align:left;background:#fff}
.ws-nm{display:block;font-weight:600;font-size:9.5px;line-height:11px;letter-spacing:.03em;
  text-transform:uppercase;color:#0B0B0C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-pr{display:block;margin-top:2px;font-weight:700;font-size:13px;line-height:15px;color:#0B0B0C}
.ws-pr s{font-weight:400;font-size:10px;color:#8E9198;margin-left:4px}

/* category board */
.ws-board{position:absolute;inset:0;display:grid;gap:8px}
.ws-tileBtn{position:relative;border:1px solid #E4E5E9;border-radius:10px;overflow:hidden;
  background:#fff;padding:0;cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease}
.ws-tileBtn.ws-on{border-color:#5F39A4;box-shadow:0 0 0 2px #5F39A4 inset}
.ws-tileBtn img{width:100%;height:100%;object-fit:cover;display:block}
.ws-board.ws-fitContain .ws-tileBtn img{object-fit:contain;background:#fff}
.ws-tileBtn .ws-lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);
  font-weight:700;font-size:10px;line-height:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 4px;color:#0B0B0C;text-align:center}

/* video carousel */
.ws-reel{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;gap:8px}
.ws-vwrap{position:relative;width:216px;height:300px;border-radius:12px;overflow:hidden;
  background:#111;flex:0 0 auto;box-shadow:0 6px 20px rgba(11,11,12,.18)}
.ws-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transition:opacity .22s ease}
.ws-vid.ws-vis{opacity:1}
.ws-pcards{flex:0 0 auto;width:100%;position:relative;height:52px}
.ws-pcard{position:absolute;inset:0;display:flex;align-items:center;gap:8px;border:1px solid #E4E5E9;
  border-radius:10px;background:#fff;padding:6px 8px;opacity:0;transition:opacity .2s ease}
.ws-pcard.ws-vis{opacity:1}
.ws-pcard img{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
.ws-pcard .ws-ptxt{flex:1 1 auto;min-width:0;text-align:left}
.ws-dots{flex:0 0 auto;display:flex;gap:6px;justify-content:center}
.ws-dot{width:26px;height:4px;border-radius:2px;background:#E4E5E9;border:0;padding:0;cursor:pointer}
.ws-dot.ws-on{background:#5F39A4}

/* hero */
.ws-heroWrap{position:absolute;inset:0;border-radius:12px;overflow:hidden;
  background:radial-gradient(120% 85% at 18% 22%, #7E57C2 0%, #5F39A4 38%, #3C2168 72%, #241140 100%)}
.ws-heroWrap img{position:absolute;left:0;right:0;bottom:0;width:100%;height:262px;
  object-fit:cover;object-position:50% 18%;display:block}
.ws-spark{position:absolute;border-radius:50%;background:#fff;opacity:.55}
.ws-disc{position:absolute;left:50%;top:150px;transform:translate(-50%,-50%);
  width:96px;height:96px;border-radius:50%;background:#5F39A4;color:#fff;border:0;cursor:pointer;
  font-weight:700;font-size:13px;line-height:15px;letter-spacing:.02em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;text-align:center;z-index:5;
  box-shadow:0 6px 18px rgba(11,11,12,.3);transition:transform .2s ease}
.ws-disc.ws-on{transform:translate(-50%,-50%) scale(1.08)}
.ws-stamp{position:absolute;left:12px;right:12px;top:250px;z-index:5;text-align:center;
  opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease}
.ws-stamp.ws-vis{opacity:1;transform:translateY(0)}
.ws-stamp .ws-s1{display:block;font-weight:600;font-size:12px;line-height:14px;letter-spacing:.14em;
  text-transform:uppercase;color:#fff}
.ws-stamp .ws-s2{display:block;font-weight:700;font-size:34px;line-height:34px;letter-spacing:-.02em;
  text-transform:uppercase;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}

.ws-chiprow{position:absolute;left:12px;right:12px;top:560px;height:18px;z-index:5}
.ws-hint{position:absolute;left:50%;top:0;transform:translateX(-50%);height:18px;padding:0 11px;
  border-radius:9px;background:#0B0B0C;color:#fff;font-weight:600;font-size:9.5px;line-height:18px;
  letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}


.ws-cta{position:absolute;left:12px;right:12px;top:588px;height:40px;z-index:7;border:0;
  border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#5F39A4;color:#fff}
.ws-hit{position:absolute;left:0;right:0;top:213.34px;bottom:0;z-index:6;background:transparent;
  pointer-events:none}
html.done .ws-hit{pointer-events:auto}
html.done .ws-cell,html.done .ws-tileBtn,html.done .ws-dot,html.done .ws-disc{pointer-events:none}
@media (max-aspect-ratio:9/16){#ws-fit{top:50%}}
</style>
</head>

  <div class="ws-chiprow"><div class="ws-hint" id="hint">Tap all three</div></div>
  <div class="ws-cta" id="cta" role="button" tabindex="0">Shop the Sale</div>
  <div class="ws-hit" id="hit"></div>
</div></div>
<script>
(function(){
  var DATA = {"items": [{"t": "Lips", "b": "", "n": "Lips · from $10.20", "now": "", "was": ""}, {"t": "Eyes", "b": "", "n": "Eyes · from $12.60", "now": "", "was": ""}, {"t": "Face", "b": "", "n": "Face · from $18.00", "now": "", "was": ""}], "intro": {"t": "", "b": ""}, "done": {"t": "", "b": ""}, "url": "https://wonderskin.com/collections/offers"};
  var CLICK = DATA.url;
  function openLP(){
    try{
      if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function'){
        window.mraid.open(CLICK); return;
      }
    }catch(e){}
    try{ window.open(CLICK, '_blank'); }catch(e){}
  }

  /* ---- fit the 360x640 stage into the ad slot ---- */
  var fit = document.getElementById('ws-fit');
  function resize(){
    var w = window.innerWidth || 360, h = window.innerHeight || 640;
    fit.style.setProperty('--ws-s', Math.min(w / 360, h / 640));
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* ---- dynamic date ---- */
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function pad(v){ return (v < 10 ? '0' : '') + v; }
  function promoDate(){
    var q = '', m;
    try{ m = /[?&]promo-date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); }catch(e){}
    if (m){ q = m[1]; }
    try{
      if (!q && typeof window.__PROMO_DATE === 'string' &&
          /^\d{4}-\d{2}-\d{2}$/.test(window.__PROMO_DATE)) { q = window.__PROMO_DATE; }
    }catch(e){}
    var dt;
    if (q){
      var p = q.split('-');
      dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    } else { dt = new Date(); }
    if (isNaN(dt.getTime())) { dt = new Date(); }
    return dt;
  }
  function campaign(dt){
    var k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    if (k >= '2026-11-01' && k <= '2026-11-26') return 'Black Friday Sale';
    if (k === '2026-11-27') return 'Black Friday';
    if (k === '2026-11-28' || k === '2026-11-29') return 'Black Friday Weekend';
    if (k === '2026-11-30') return 'Cyber Monday';
    if (k >= '2026-12-01' && k <= '2026-12-02') return 'Cyber Week';
    return 'Limited Time Offer';
  }
  (function(){
    var dt = promoDate();
    var line = campaign(dt) + ' \u00B7 ' + DAYS[dt.getDay()] + ', ' + MONS[dt.getMonth()] + ' ' + dt.getDate();
    document.getElementById('ws-date').textContent = line;
  })();

  /* ---- panel ---- */
  var title = document.getElementById('ws-ptitle');
  var bodyEl = document.getElementById('ws-pbody');
  /* The words used to swap in place with no transition, which read as nothing
     happening. Now the panel drops its text, widens its accent edge and brings
     the new text back up. */
  var swapT = null;
  var hasPanel = !!(title && bodyEl);
  function write(o){ title.textContent = o.t; bodyEl.textContent = o.b; }
  function show(o, animate){
    var root = document.documentElement;
    if (!hasPanel){ return; }   /* on-product cards carry no bottom panel */
    if (!animate){ write(o); return; }
    if (swapT){ window.clearTimeout(swapT); }
    root.classList.add('ws-sw');
    swapT = window.setTimeout(function(){
      write(o);
      root.classList.remove('ws-sw');
      swapT = null;
    }, 140);
  }
  show(DATA.intro);

  /* ---- video reel ---- */
  var vids  = [].slice.call(document.querySelectorAll('.ws-vid'));
  var stamp = document.querySelector('.ws-stamp');
  var pcards= [].slice.call(document.querySelectorAll('.ws-pcard'));

  function playOnly(idx){
    for (var i = 0; i < vids.length; i++){
      if (i === idx){
        vids[i].classList.add('ws-vis');
        try{ vids[i].muted = true; var pr = vids[i].play(); if (pr && pr.catch){ pr.catch(function(){}); } }catch(e){}
      } else {
        vids[i].classList.remove('ws-vis');
        try{ vids[i].pause(); }catch(e){}
      }
    }
  }
  /* EC checklist item 5: a creative that carries video must stop it when the slot is
     not viewable and start it again when it is. */
  function setPaused(paused){
    for (var i = 0; i < vids.length; i++){
      if (!vids[i].classList.contains('ws-vis')) continue;
      try{ if (paused){ vids[i].pause(); } else { vids[i].muted = true; vids[i].play(); } }catch(e){}
    }
  }
  try{
    if (typeof window.mraid !== 'undefined' && window.mraid &&
        typeof window.mraid.addEventListener === 'function'){
      window.mraid.addEventListener('viewableChange', function(viewable){ setPaused(!viewable); });
    }
  }catch(e){}
  document.addEventListener('visibilitychange', function(){ setPaused(document.hidden); });

  /* ---- interaction ---- */
  var nodes = [].slice.call(document.querySelectorAll('[data-qa="tap"][data-i]'));
  var seen = [], total = nodes.length, count = 0, finished = false;
  for (var i = 0; i < total; i++){ seen.push(false); }

  function pick(ev){
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    var el = this, idx = Number(el.getAttribute('data-i'));
    for (var j = 0; j < nodes.length; j++){
      nodes[j].classList.remove('ws-on');
      if (seen[j]) { nodes[j].classList.add('ws-seen'); }
    }
    el.classList.remove('ws-seen');
    el.classList.add('ws-on');
    if (vids.length){
      playOnly(idx);
      for (var q = 0; q < pcards.length; q++){
        if (q === idx){ pcards[q].classList.add('ws-vis'); }
        else { pcards[q].classList.remove('ws-vis'); }
      }
    }
    if (stamp){ stamp.classList.add('ws-vis'); }
    if (!seen[idx]){
      seen[idx] = true;
      count++;
    }
    show(DATA.items[idx], true);
    if (count >= total && !finished){
      finished = true;
      document.getElementById('hint').textContent = 'Tap to shop';
      window.setTimeout(function(){
        show(DATA.done, true);
        document.documentElement.classList.add('done');
      }, 420);
    }
  }
  for (var k = 0; k < nodes.length; k++){
    nodes[k].addEventListener('click', pick);
  }

  var reel = document.querySelector('.ws-vwrap');
  if (reel && nodes.length){
    var sx = null, cur = 0, lastTouch = 0;
    function step(dir){
      cur = (cur + (dir > 0 ? 1 : nodes.length - 1)) % nodes.length;
      nodes[cur].click();
    }
    reel.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive:true});
    reel.addEventListener('touchend', function(e){
      if (document.documentElement.classList.contains('done')) return;
      lastTouch = Date.now();
      var dx = (sx === null) ? 0 : e.changedTouches[0].clientX - sx;
      sx = null;
      /* a touch that does not travel is a tap: advance it too, because a touch-only
         tap never produces a click in headless playback */
      step(dx < -24 ? 1 : (dx > 24 ? -1 : 1));
    });
    reel.addEventListener('click', function(e){
      if (document.documentElement.classList.contains('done')) return;
      e.preventDefault(); e.stopPropagation();
      if (Date.now() - lastTouch < 700) return;   /* the browser's synthesized click */
      step(1);
    });
  }

  document.getElementById('cta').addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation(); openLP();
  });
  document.getElementById('hit').addEventListener('click', function(ev){
    ev.preventDefault(); openLP();
  });
})();
</script>
