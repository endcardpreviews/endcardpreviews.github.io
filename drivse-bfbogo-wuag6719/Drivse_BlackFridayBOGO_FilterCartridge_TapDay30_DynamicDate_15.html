*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A <button> does not inherit font-family: Chrome's UA sheet hands it
   Arial 13.333px. Every tappable element in these cards is a button, so without
   this line the brand face applies to the headline and to nothing the user taps.
   (The bug that cost NOBL four revision rounds.) */
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;background:none;border:0}
html,body{height:100%;background:#14181A;overflow:hidden}
body{font-family:'dvB',"Helvetica Neue",Arial,sans-serif;color:#C9D2D4;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
#dv-fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dv-card{position:relative;width:360px;height:640px;overflow:hidden;display:flex;
  flex-direction:column;background:#14181A}

/* ---- offer bar: wordmark, the offer ONCE, and the device date ---- */
.dv-bar{flex:0 0 auto;padding:9px 14px 10px;text-align:center;
  background:linear-gradient(180deg,#0E1113 0%,#1C2225 100%);
  border-bottom:1px solid rgba(147,191,183,.30)}
.dv-bar .dv-wm{display:block;height:17px;margin:0 auto 7px}
.dv-bar .dv-of{display:block;font-family:'dvH';font-weight:700;font-size:15px;
  line-height:18px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.dv-bar .dv-of em{font-style:normal;color:#93BFB7}
.dv-bar .dv-dt{display:block;margin-top:4px;font-weight:600;font-size:10px;
  line-height:13px;letter-spacing:.08em;text-transform:uppercase;color:#8C999C}

/* ---- stage ---- */
.dv-stage{position:relative;flex:1 1 auto;min-height:0;display:flex;
  flex-direction:column;align-items:center;padding:0 16px;
  background:radial-gradient(120% 70% at 50% 18%,#232A2D 0%,#14181A 72%)}
.dv-h{flex:0 0 auto;margin-top:13px;text-align:center;font-family:'dvH';
  font-weight:700;font-size:21px;line-height:25px;letter-spacing:.01em;color:#fff}
.dv-h em{font-style:normal;color:#93BFB7}
.dv-sub{flex:0 0 auto;margin-top:5px;text-align:center;font-weight:400;
  font-size:11.5px;line-height:16px;letter-spacing:.01em;color:#8C999C}

/* ---- hint chip ---- */
.dv-hint{position:relative;z-index:9;flex:0 0 auto;align-self:center;
  margin:0 auto 9px;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(147,191,183,.34);
  font-weight:600;font-size:10px;line-height:13px;letter-spacing:.08em;
  text-transform:uppercase;color:#93BFB7;white-space:nowrap}

/* ---- CTA ---- */
.dv-cta{position:relative;z-index:9;flex:0 0 auto;display:block;width:100%;height:52px;
  font-family:'dvH';font-weight:700;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;color:#0E1113;cursor:pointer;
  background:linear-gradient(180deg,#B9DED7 0%,#93BFB7 52%,#6E9D95 100%)}

/* ---- the click layer over the bottom 2/3 ---- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.6%;z-index:8;
  pointer-events:none;background:transparent}
html.done #hit{pointer-events:auto}
html.done .dv-tap{pointer-events:none}

/* ---- chrome plate used behind products ---- */
.dv-plate{position:absolute;left:50%;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(147,191,183,.20) 0%,
  rgba(147,191,183,0) 68%)}


.ba{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;gap:8px;margin:10px 0 9px}
.ba-tile{position:relative;flex:1 1 auto;min-width:0;border-radius:12px;overflow:hidden;background:#DDE5E1;
  box-shadow:0 0 0 1px rgba(45,62,64,.14),0 16px 28px -20px rgba(45,62,64,.6)}
.ba-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s ease}
.ba-tile img.af{opacity:0}
.ba-tile.is-after img.af{opacity:1}
.ba-tile.cut{background:linear-gradient(180deg,#FFFFFF 0%,#E9F1EC 100%)}
.ba-tile.cut img{object-fit:contain;padding:46px 12% 64px}
.ba-tile.cut .ba-lab{top:0;padding:9px 6px;background:rgba(45,62,64,.86)}
.ba-tile.cut img{padding:62px 12% 60px;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent 84%);mask-image:linear-gradient(180deg,#000 60%,transparent 84%)}
.ba-lab{position:absolute;left:0;right:0;top:38%;padding:8px 6px;text-align:center;
  background:rgba(40,38,36,.38);color:#fff;font-family:'dvB';font-weight:400;font-size:13px;
  line-height:17px;letter-spacing:.04em;text-transform:uppercase}
.ba-tg{position:absolute;left:10px;right:10px;bottom:10px;height:36px;border-radius:999px;display:flex;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ba-tg i{position:absolute;left:3px;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:999px;
  background:#2D3E40;transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.ba-tile.is-after .ba-tg i{transform:translateX(100%)}
.ba-tg button{position:relative;flex:1 1 0;cursor:pointer;font-family:'dvB';font-weight:400;font-size:10.5px;
  letter-spacing:.17em;text-transform:uppercase;padding-left:.17em;color:#2D3E40;transition:color .3s}
.ba-tile:not(.is-after) .ba-tg .b0,.ba-tile.is-after .ba-tg .b1{color:#fff}
.ba-pr{position:relative;flex:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ba-pr img{display:block;max-width:100%;height:auto;max-height:228px;filter:drop-shadow(0 14px 16px rgba(45,62,64,.22))}
.ba-pr span{margin-top:8px;font-family:'dvB';font-weight:700;font-size:9.5px;line-height:12px;letter-spacing:.1em;
  text-transform:uppercase;color:#4F7F77;text-align:center}
/* grid of four (card 14) */
.ba.grid{gap:7px}
.ba.grid .ba-pr{flex-basis:70px}
.ba.grid .ba-pr img{max-height:196px}
.ba-g{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px}
.ba-g .ba-tile{border-radius:10px}
.ba-g .ba-lab{top:30%;font-size:9px;line-height:11px;padding:5px 3px;letter-spacing:.03em}
.ba-g .ba-tg{left:5px;right:5px;bottom:5px;height:26px}
.ba-g .ba-tg button{font-size:9px;letter-spacing:.08em;padding-left:.08em}
/* ===== drivse.com rebrand (2026-11-25) ===== */
html,body{background:#F2F8F4}
body{color:#3B4A4C}
.dv-card{background:#F2F8F4}
.dv-bar{background:#F2F8F4;border-bottom:1px solid rgba(79,127,119,.22);padding:12px 14px 10px}

.dv-stage{background:radial-gradient(120% 70% at 50% 22%,#FFFFFF 0%,#F2F8F4 70%)}
.dv-h{font-family:'Lora',Georgia,serif;font-weight:400;font-size:24px;line-height:28px;letter-spacing:.01em;color:#2D3E40}
.dv-h em{color:#4F7F77}
.dv-sub{color:#61706F}
.dv-hint{background:#fff;border:1px solid rgba(79,127,119,.32);color:#4F7F77;
  box-shadow:0 6px 14px -10px rgba(45,62,64,.45)}
.dv-cta{width:auto;margin:0 16px 14px;height:48px;border-radius:9px;background:#2D3E40;color:#fff;
  font-family:'dvB';font-weight:400;font-size:14px;letter-spacing:.2em;
  box-shadow:0 12px 22px -14px rgba(29,34,36,.7)}
.dv-plate{background:radial-gradient(circle,rgba(147,191,183,.28) 0%,rgba(147,191,183,0) 68%)}


/* ===== Black Friday ticker + fit-to-width (2026-11-25) ===== */
.dv-tk{position:relative;height:34px;overflow:hidden;display:flex;align-items:center;
  background:linear-gradient(180deg,#D22A33 0%,#B3161F 50%,#8F0E16 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px -10px rgba(90,0,8,.7)}
.dv-tk::before,.dv-tk::after{content:'';position:absolute;left:0;right:0;height:1px;background:rgba(255,215,215,.38)}
.dv-tk::before{top:3px}.dv-tk::after{bottom:3px}
.dv-tkm{position:relative;flex:1 1 auto;min-width:0;height:100%;overflow:hidden;display:flex;align-items:center;
  }
.dv-tm{position:relative;height:26px;display:flex;align-items:center;justify-content:center;gap:1px;
  background:#2D3E40;color:#fff;border-bottom:2px solid #B3161F}
.dv-tm small{font-family:'dvB','Montserrat',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#C9DCD8;margin-right:10px;padding-right:10px;border-right:1px solid rgba(255,255,255,.25);line-height:12px}
.dv-tm b{font-family:'dvB','Montserrat',sans-serif;font-weight:700;font-size:14px;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;min-width:18px;text-align:center}
.dv-tm i{font-style:normal;font-family:'dvB','Montserrat',sans-serif;font-size:11px;line-height:1;color:#93BFB7;margin-top:-2px}
.dv-tkr{display:flex;flex:0 0 auto;white-space:nowrap;will-change:transform;animation:dvtk 16s linear infinite}
.dv-tkr span{display:inline-flex;align-items:center;font-family:'dvB','Montserrat',sans-serif;font-weight:700;
  font-size:12.5px;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:#fff;padding-left:.16em}
.dv-tkr span b{display:inline-block;width:5px;height:5px;border-radius:50%;background:#FFD9DB;margin:0 14px 0 12px}
.dv-tkr span em{font-style:normal;color:#FFE3A3}
.dv-tkr span strong{font-weight:700;font-size:16px;letter-spacing:.14em}
.dv-tkr span em{font-size:12px}
@keyframes dvtk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.dv-tkr{animation-duration:48s}}

.dv-bar{padding:10px 0 0}
.dv-bar .dv-wm{margin-bottom:8px}
.dv-card{transform-origin:50% 50%}

<script>

/* ---------- click-through contract ---------- */
function dvOpen(){
  var u = (typeof clickTag !== 'undefined' && clickTag) ? clickTag : null;
  /* MRAID tested BY NAME: the team's upload scan reads an aliased guard as
     unguarded, so write window.mraid out in full. */
  if (typeof window.mraid !== 'undefined' && window.mraid &&
      typeof window.mraid.open === 'function') {
    try { if (u) { window.mraid.open(u); } else { window.mraid.open(); } return; } catch (e) {}
  }
  try { window.open(u || 'https://try.mydrivse.com/appcv1011', '_blank'); } catch (e) {}
}
document.getElementById('cta').addEventListener('click', function(ev){
  ev.preventDefault(); ev.stopPropagation(); dvOpen();
});
document.getElementById('hit').addEventListener('click', function(ev){
  ev.preventDefault(); dvOpen();
});


/* ---------- finish: switch the click layer a beat AFTER the last action ----------
   Setting html.done inside the handler lets the browser re-dispatch that same tap
   onto the now-live #hit layer, so the winning tap itself opens the LP. */
var DV_DONE = false;
function dvFinish(){
  if (DV_DONE) return; DV_DONE = true;
  var h = document.getElementById('hint');
  if (h && window.DV_DONE_HINT) { h.textContent = window.DV_DONE_HINT; }
  window.setTimeout(function(){ document.documentElement.classList.add('done'); }, 420);
}

window.DV_DONE_HINT = "Tap to shop";

(function(){
  var tiles=[].slice.call(document.querySelectorAll('.ba-tile')), n=0;
  tiles.forEach(function(t){
    t.querySelector('.b0').addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); });
    t.querySelector('.b1').addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      if (t.classList.contains('is-after')) return;
      t.classList.add('is-after'); n++;
      if (n >= tiles.length) dvFinish();
    });
  });
})();

</script>

<script>
/* Black Friday ticker: campaign name from the device date (?promo-date=YYYY-MM-DD to preview) */
(function(){
  var q = new URLSearchParams(location.search).get('promo-date');
  var d = (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) ? new Date(q + 'T12:00:00') : new Date();
  var m = d.getMonth(), day = d.getDate();
  var camp = (m === 10 && day <= 29) ? 'Black Friday'
           : ((m === 10 && day === 30) || (m === 11 && day <= 2)) ? 'Cyber Monday' : 'Limited Time Offer';
  var unit = '<span><strong>' + camp + '</strong><b></b><em>Buy 1 Get 2 Free</em><b></b></span>';
  var r = document.getElementById('dv-tkr');
  if (r) { r.innerHTML = unit + unit + unit + unit + unit + unit; }
  /* countdown: starts at 03:50:10 each time the card opens */
  var left = 3 * 3600 + 50 * 60 + 10, H = document.getElementById('tH'), Mi = document.getElementById('tM'), S = document.getElementById('tS');
  function p2(v){ return (v < 10 ? '0' : '') + v; }
  function tick(){ if (!H) return; H.textContent = p2(Math.floor(left / 3600)); Mi.textContent = p2(Math.floor(left / 60) % 60);
    S.textContent = p2(left % 60); if (left > 0) left--; }
  tick(); window.setInterval(tick, 1000);
})();

/* fit the 360x640 design to the slot: fills the width on any 9:16-or-taller frame */
(function(){
  var c = document.querySelector('.dv-card');
  if (!c) return;
  function fit(){ var s = Math.min(window.innerWidth / 360, window.innerHeight / 640); c.style.transform = 'scale(' + s + ')'; }
  fit(); window.addEventListener('resize', fit);
})();

</script>
