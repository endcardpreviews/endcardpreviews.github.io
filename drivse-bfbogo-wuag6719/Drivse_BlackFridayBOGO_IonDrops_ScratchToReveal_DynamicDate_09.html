*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit}
html,body{width:100%;height:100%;overflow:hidden;background:#F2F8F4}
body{font-family:'Montserrat',sans-serif;color:#1D2224;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#wrap{width:360px;height:640px;flex:0 0 auto;position:relative}
#card{position:absolute;left:0;top:0;width:360px;height:640px;overflow:hidden;background:#F2F8F4;transform-origin:0 0}
#card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(260px 230px at 50% 300px,rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}
.logo{position:absolute;left:50%;top:22px;width:122px;transform:translateX(-50%);display:block}
.kicker{position:absolute;left:0;right:0;top:70px;text-align:center;font-weight:700;font-size:10.5px;
  letter-spacing:.2em;text-transform:uppercase;color:#4F7F77}
h1 span{display:inline-block}
h1{position:absolute;left:0;right:0;top:86px;text-align:center;font-family:'Lora',serif;font-weight:400;
  font-size:34px;line-height:1.1;letter-spacing:.01em;color:#1D2224;white-space:nowrap}
.sub{position:absolute;left:0;right:0;top:130px;text-align:center;font-size:14px;letter-spacing:.01em;color:#2A3033}
.hero{position:absolute;right:0;top:156px;width:262px;height:295px;display:block;pointer-events:none;
  filter:drop-shadow(0 16px 18px rgba(29,34,36,.16))}
#panel{position:absolute;left:42px;top:463px;width:276px;height:110px;border-radius:14px;overflow:hidden;
  background:#fff;box-shadow:inset 0 0 0 1px rgba(79,127,119,.28),0 14px 26px -18px rgba(29,34,36,.45)}
.win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px}
.win small{font-size:13px;letter-spacing:.01em;color:#2A3033}
.win strong{font-family:'Lora',serif;font-weight:400;font-size:31px;line-height:1.12;color:#1D2224;margin-top:2px;white-space:nowrap}
.win em{font-style:normal;font-size:11px;letter-spacing:.01em;color:rgba(29,34,36,.62);margin-top:3px}
#foil{position:absolute;inset:0;width:276px;height:110px;display:block;touch-action:none;cursor:pointer;
  transition:opacity .45s ease}
html.revealed #foil{opacity:0;pointer-events:none}
#hint{position:absolute;left:50%;top:452px;transform:translateX(-50%);z-index:4;height:22px;padding:0 13px 0 15px;
  border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(79,127,119,.30),0 6px 14px -8px rgba(29,34,36,.4);
  font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#4F7F77;
  display:flex;align-items:center;white-space:nowrap;pointer-events:none}
#cta{position:absolute;left:42px;top:586px;width:276px;height:42px;border:0;border-radius:9px;background:#2E3D40;
  color:#fff;font-size:15px;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;cursor:pointer;z-index:6;
  box-shadow:0 12px 22px -14px rgba(29,34,36,.7)}
html.revealed #cta{animation:pulse 1.6s ease-in-out .4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#hit{position:absolute;left:0;right:0;top:214px;bottom:0;z-index:5;pointer-events:none;cursor:pointer}
html.done #hit{pointer-events:auto}
html.done #foil{pointer-events:none}

/* ===== Black Friday ticker + fit-to-width (2026-11-25) ===== */
.dv-tk{position:relative;height:34px;overflow:hidden;display:flex;align-items:center;
  background:linear-gradient(180deg,#D22A33 0%,#B3161F 50%,#8F0E16 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 14px -10px rgba(90,0,8,.7)}
.dv-tk::before,.dv-tk::after{content:'';position:absolute;left:0;right:0;height:1px;background:rgba(255,215,215,.38)}
.dv-tk::before{top:3px}.dv-tk::after{bottom:3px}
.dv-tkm{position:relative;flex:1 1 auto;min-width:0;height:100%;overflow:hidden;display:flex;align-items:center;
  }
.dv-tm{position:relative;height:26px;display:flex;align-items:center;justify-content:center;gap:1px;
  background:#2D3E40;color:#fff;border-bottom:2px solid #B3161F}
.dv-tm small{font-family:'dvB','Montserrat',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#C9DCD8;margin-right:10px;padding-right:10px;border-right:1px solid rgba(255,255,255,.25);line-height:12px}
.dv-tm b{font-family:'dvB','Montserrat',sans-serif;font-weight:700;font-size:14px;line-height:1;color:#fff;

  fitHead(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHead);
})();

/* ---------- finish: click layer switches on a beat AFTER the last action ---------- */
var DV_DONE = false;
function dvFinish(){
  if (DV_DONE) return; DV_DONE = true;
  document.documentElement.classList.add('revealed');
  document.getElementById('hint').textContent = 'Tap to claim';
  window.setTimeout(function(){ document.documentElement.classList.add('done'); }, 420);
}

/* ---------- scratch foil ---------- */
(function(){
  var cv=document.getElementById('foil'), x=cv.getContext('2d'), W=cv.width, H=cv.height;
  function seeded(s){ return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
  function paint(){
    var r=seeded(20261125);
    var g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#33454A'); g.addColorStop(1,'#26363A');
    x.fillStyle=g; x.fillRect(0,0,W,H);
    for (var i=0;i<70;i++){                       /* mottled slate, like the pop-up's panel */
      var cx=r()*W, cy=r()*H, rad=30+r()*90, a=.03+r()*.05;
      var rg=x.createRadialGradient(cx,cy,0,cx,cy,rad);
      rg.addColorStop(0, r()>.5?'rgba(255,255,255,'+a+')':'rgba(0,0,0,'+(a*1.6)+')');
      rg.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=rg; x.fillRect(0,0,W,H);
    }
    x.save(); x.translate(W/2,H/2); x.rotate(-0.42);   /* three brushed scratch marks */
    for (var k=-1;k<=1;k++){
      x.fillStyle='rgba(225,232,230,.13)';
      x.beginPath(); x.roundRect ? x.roundRect(k*70-15,-130,30,260,14) : x.rect(k*70-15,-130,30,260); x.fill();
    }
    x.restore();
    x.fillStyle='rgba(212,218,216,.94)'; x.font='700 46px Montserrat'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText('SCRATCH HERE', W/2, H/2+2);
  }
  var ready = (document.fonts && document.fonts.load) ? document.fonts.load('700 46px Montserrat') : Promise.resolve();
  paint(); ready.then(paint, paint);

  var down=false, last=null, strokes=0;
  function pt(e){
    var b=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-b.left)*W/b.width, y:(t.clientY-b.top)*H/b.height};
  }
  function rub(p){
    x.globalCompositeOperation='destination-out'; x.lineCap='round'; x.lineJoin='round'; x.lineWidth=58;
    x.beginPath(); if (last) { x.moveTo(last.x,last.y); } else { x.moveTo(p.x-.1,p.y); } x.lineTo(p.x,p.y); x.stroke();
    x.globalCompositeOperation='source-over'; last=p;
    if (++strokes % 6 === 0) check();
  }
  function check(){
    if (DV_DONE) return;
    var d=x.getImageData(0,0,W,H).data, n=0, c=0;
    for (var i=3;i<d.length;i+=64){ n++; if (d[i]<40) c++; }
    if (c/n > .52) dvFinish();
  }
  function start(e){ if (DV_DONE) return; e.preventDefault(); down=true; last=null; rub(pt(e)); }
  function move(e){ if (!down || DV_DONE) return; e.preventDefault(); rub(pt(e)); }
  function end(){ if (down) { down=false; last=null; check(); } }
  cv.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',end); window.addEventListener('touchcancel',end);
})();
</script>

<script>
/* Black Friday ticker: campaign name from the device date (?promo-date=YYYY-MM-DD to preview) */
(function(){
  var q = new URLSearchParams(location.search).get('promo-date');
  var d = (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) ? new Date(q + 'T12:00:00') : new Date();
  var m = d.getMonth(), day = d.getDate();
  var camp = (m === 10 && day <= 29) ? 'Black Friday'
           : ((m === 10 && day === 30) || (m === 11 && day <= 2)) ? 'Cyber Monday' : 'Limited Time Offer';
  var unit = '<span><strong>' + camp + '</strong><b></b><em>Buy 1 Get 2 Free</em><b></b></span>';
  var r = document.getElementById('dv-tkr');
  if (r) { r.innerHTML = unit + unit + unit + unit + unit + unit; }
  /* countdown: starts at 03:50:10 each time the card opens */
  var left = 3 * 3600 + 50 * 60 + 10, H = document.getElementById('tH'), Mi = document.getElementById('tM'), S = document.getElementById('tS');
  function p2(v){ return (v < 10 ? '0' : '') + v; }
  function tick(){ if (!H) return; H.textContent = p2(Math.floor(left / 3600)); Mi.textContent = p2(Math.floor(left / 60) % 60);
    S.textContent = p2(left % 60); if (left > 0) left--; }
  tick(); window.setInterval(tick, 1000);
})();

</script>
