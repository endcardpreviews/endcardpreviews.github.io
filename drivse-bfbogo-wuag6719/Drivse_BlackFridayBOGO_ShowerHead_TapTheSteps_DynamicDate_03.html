*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* A <button> does not inherit font-family: Chrome's UA sheet hands it
   Arial 13.333px. Every tappable element in these cards is a button, so without
   this line the brand face applies to the headline and to nothing the user taps.
   (The bug that cost NOBL four revision rounds.) */
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;background:none;border:0}
html,body{height:100%;background:#14181A;overflow:hidden}
body{font-family:'dvB',"Helvetica Neue",Arial,sans-serif;color:#C9D2D4;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
#dv-fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dv-card{position:relative;width:360px;height:640px;overflow:hidden;display:flex;
  flex-direction:column;background:#14181A}

/* ---- offer bar: wordmark, the offer ONCE, and the device date ---- */
.dv-bar{flex:0 0 auto;padding:9px 14px 10px;text-align:center;
  background:linear-gradient(180deg,#0E1113 0%,#1C2225 100%);
  border-bottom:1px solid rgba(147,191,183,.30)}
.dv-bar .dv-wm{display:block;height:17px;margin:0 auto 7px}
.dv-bar .dv-of{display:block;font-family:'dvH';font-weight:700;font-size:15px;
  line-height:18px;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.dv-bar .dv-of em{font-style:normal;color:#93BFB7}
.dv-bar .dv-dt{display:block;margin-top:4px;font-weight:600;font-size:10px;
  line-height:13px;letter-spacing:.08em;text-transform:uppercase;color:#8C999C}

/* ---- stage ---- */
.dv-stage{position:relative;flex:1 1 auto;min-height:0;display:flex;
  flex-direction:column;align-items:center;padding:0 16px;
  background:radial-gradient(120% 70% at 50% 18%,#232A2D 0%,#14181A 72%)}
.dv-h{flex:0 0 auto;margin-top:13px;text-align:center;font-family:'dvH';
  font-weight:700;font-size:21px;line-height:25px;letter-spacing:.01em;color:#fff}
.dv-h em{font-style:normal;color:#93BFB7}
.dv-sub{flex:0 0 auto;margin-top:5px;text-align:center;font-weight:400;
  font-size:11.5px;line-height:16px;letter-spacing:.01em;color:#8C999C}

/* ---- hint chip ---- */
.dv-hint{position:relative;z-index:9;flex:0 0 auto;align-self:center;
  margin:0 auto 9px;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(147,191,183,.34);
  font-weight:600;font-size:10px;line-height:13px;letter-spacing:.08em;
  text-transform:uppercase;color:#93BFB7;white-space:nowrap}

/* ---- CTA ---- */
.dv-cta{position:relative;z-index:9;flex:0 0 auto;display:block;width:100%;height:52px;
  font-family:'dvH';font-weight:700;font-size:14px;letter-spacing:.08em;
  text-transform:uppercase;color:#0E1113;cursor:pointer;
  background:linear-gradient(180deg,#B9DED7 0%,#93BFB7 52%,#6E9D95 100%)}

/* ---- the click layer over the bottom 2/3 ---- */
#hit{position:absolute;left:0;right:0;bottom:0;height:66.6%;z-index:8;
  pointer-events:none;background:transparent}
html.done #hit{pointer-events:auto}
html.done .dv-tap{pointer-events:none}

/* ---- chrome plate used behind products ---- */
.dv-plate{position:absolute;left:50%;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(147,191,183,.20) 0%,
  rgba(147,191,183,0) 68%)}

.dv-st3{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;margin-top:7px}
.dv-stage3{position:relative;flex:0 0 auto;width:100%;height:218px;border-radius:10px;
  overflow:hidden;background:#1B2124}
.dv-stage3 img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s}
.dv-stage3 .a{object-fit:cover;object-position:50% 50%}
.dv-stage3 .b{object-fit:contain;padding:10px 0}
.dv-stage3 .b{opacity:0}
html.dv-fit .dv-stage3 .a{opacity:0}
html.dv-fit .dv-stage3 .b{opacity:1}
.dv-steps3{flex:0 0 auto;display:flex;gap:6px;width:100%;margin-top:10px}
.dv-s3{flex:1 1 0;padding:8px 4px 9px;border-radius:8px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.14);cursor:pointer;text-align:center;transition:all .24s}
.dv-s3 b{display:block;font-family:'dvH';font-weight:700;font-size:13px;line-height:15px;
  letter-spacing:.02em;color:#fff}
.dv-s3 em{display:block;margin-top:3px;font-style:normal;font-weight:600;font-size:9.5px;
  line-height:12px;letter-spacing:.04em;color:#8C999C}
.dv-s3.on{border-color:#93BFB7;background:rgba(147,191,183,.14)}
.dv-s3.on b{color:#93BFB7}
.dv-s3.on em{color:#D6DEDF}
.dv-n3{flex:0 0 auto;margin-top:9px;text-align:center;font-weight:600;font-size:11px;
  line-height:15px;letter-spacing:.01em;color:#8C999C}
html.dv-fit .dv-n3{color:#93BFB7}

<script>

/* ---------- click-through contract ---------- */
function dvOpen(){
  var u = (typeof clickTag !== 'undefined' && clickTag) ? clickTag : null;
  /* MRAID tested BY NAME: the team's upload scan reads an aliased guard as
     unguarded, so write window.mraid out in full. */
  if (typeof window.mraid !== 'undefined' && window.mraid &&
      typeof window.mraid.open === 'function') {
    try { if (u) { window.mraid.open(u); } else { window.mraid.open(); } return; } catch (e) {}
  }
  try { window.open(u || 'https://try.mydrivse.com/appcv1011', '_blank'); } catch (e) {}
}
document.getElementById('cta').addEventListener('click', function(ev){
  ev.preventDefault(); ev.stopPropagation(); dvOpen();
});
document.getElementById('hit').addEventListener('click', function(ev){
  ev.preventDefault(); dvOpen();
});

/* ---------- device-date campaign line ---------- */
(function(){
  var q = new URLSearchParams(location.search).get('promo-date');
  var d = q ? new Date(q + 'T12:00:00') : new Date();
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var el = document.getElementById('dv-dt');
  if (el) { el.textContent = 'Today only · ' + M[d.getMonth()] + ' ' + d.getDate(); }
})();

/* ---------- finish: switch the click layer a beat AFTER the last action ----------
   Setting html.done inside the handler lets the browser re-dispatch that same tap
   onto the now-live #hit layer, so the winning tap itself opens the LP. */
var DV_DONE = false;
function dvFinish(){
  if (DV_DONE) return; DV_DONE = true;
  var h = document.getElementById('hint');
  if (h && window.DV_DONE_HINT) { h.textContent = window.DV_DONE_HINT; }
  window.setTimeout(function(){ document.documentElement.classList.add('done'); }, 420);
}

window.DV_DONE_HINT = "Tap to shop";


(function(){
  var ss=[].slice.call(document.querySelectorAll('.dv-s3')), n=0,
      t=document.getElementById('dv-n3');
  ss.forEach(function(s){
    s.addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      if(s.classList.contains('on')) return;
      s.classList.add('on'); n++;
      if(n>=ss.length){ document.documentElement.classList.add('dv-fit');
        t.textContent='Fitted. Hand-tight, no plumber.'; dvFinish(); }
    });
  });
})();

</script>
