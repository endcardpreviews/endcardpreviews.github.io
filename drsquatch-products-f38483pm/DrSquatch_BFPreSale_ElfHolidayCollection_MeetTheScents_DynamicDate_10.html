*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0A0A0B;overflow:hidden}
body{font-family:'dsqAdrianna',"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#dsq-fit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--dsq-s,1));
  transform-origin:50% 50%;width:360px;height:640px}
.dsq-card{position:relative;width:360px;height:640px;overflow:hidden;background:#0A0A0B;color:#fff}
.dsq-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dsq-top{position:absolute;left:0;right:0;top:10px;text-align:center;z-index:4}
.dsq-logo{display:block;margin:0 auto;height:42px;width:auto}
.dsq-hl{font-family:'dsqWorker',"Arial Black",Impact,sans-serif;font-weight:800;font-size:20px;line-height:20px;
  letter-spacing:.01em;margin-top:6px;height:40px;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.dsq-hl.dsq-hl1{font-size:23px;line-height:23px;padding-top:9px}
.dsq-date{margin-top:4px;height:12px;font-weight:700;font-size:10px;line-height:12px;letter-spacing:.11em;
  color:#C05418;text-transform:uppercase}
.dsq-stage{position:absolute;left:12px;right:12px;top:116px;height:344px;z-index:3}
.dsq-heroWrap{position:absolute;left:0;right:0;top:0;height:100%;display:flex;align-items:center;justify-content:center}
.dsq-hero{max-width:100%;max-height:100%;width:auto;height:auto;display:block;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.dsq-heroPhoto{border-radius:9px;filter:none;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.dsq-pin{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  border:2px solid rgba(255,255,255,.92);background:rgba(10,10,11,.58);color:#fff;
  font-family:'dsqAdrianna',Arial,sans-serif;font-weight:700;font-size:11px;line-height:20px;text-align:center;
  cursor:pointer;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.5);animation:dsqPulse 2.2s ease-in-out infinite}
.dsq-pin.dsq-on{background:#C05418;border-color:#fff;animation:none}
.dsq-pin.dsq-seen{background:rgba(255,255,255,.92);color:#0A0A0B;border-color:rgba(255,255,255,.92);animation:none}
@keyframes dsqPulse{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 0 rgba(255,255,255,.34)}
  60%{box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 8px rgba(255,255,255,0)}}
.dsq-photo{position:absolute;left:0;right:0;top:0;height:126px;border-radius:8px;overflow:hidden;background:#000}
.dsq-photo img{width:100%;height:100%;object-fit:cover;display:block}
.dsq-tiles{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dsq-tiles.dsq-t3{grid-template-columns:1fr 1fr 1fr}
.dsq-tile{position:relative;min-height:42px;border-radius:7px;padding:6px 7px 7px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.085);border:1px solid rgba(255,255,255,.3);color:#fff;font-family:inherit;
  display:flex;flex-direction:column;justify-content:center;z-index:6}
.dsq-tile .dsq-tk{font-weight:700;font-size:9px;line-height:11px;letter-spacing:.09em;color:#C05418;
  text-transform:uppercase}
.dsq-tile .dsq-tn{font-weight:700;font-size:11px;line-height:13px;letter-spacing:.02em;text-transform:uppercase}
.dsq-tile.dsq-on{background:#C05418;border-color:#C05418}
.dsq-tile.dsq-on .dsq-tk{color:#FFFFFF}
.dsq-tile.dsq-on .dsq-tn{color:#FFFFFF}
.dsq-tile.dsq-seen{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
.dsq-chiprow{position:absolute;left:12px;right:12px;top:464px;height:18px;z-index:5}
.dsq-hint{position:absolute;left:50%;top:0;transform:translateX(-50%);height:18px;padding:0 10px;border-radius:9px;
  background:rgba(255,255,255,.93);color:#0A0A0B;font-weight:700;font-size:10px;line-height:18px;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dsq-dots{position:absolute;right:0;top:5px;display:flex;gap:4px}
.dsq-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.dsq-dot.dsq-on{background:#C05418}
.dsq-pricebar{position:absolute;left:12px;right:12px;top:484px;height:20px;z-index:4;display:flex;
  align-items:baseline;justify-content:center;gap:7px;white-space:nowrap}
.dsq-pname{font-weight:700;font-size:11px;line-height:14px;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(255,255,255,.88)}
.dsq-pnow{font-family:'dsqWorker',Arial,sans-serif;font-weight:800;font-size:15px;line-height:17px;color:#fff}
.dsq-pwas{font-weight:400;font-size:10px;line-height:13px;color:rgba(255,255,255,.6);text-decoration:line-through}
.dsq-ptag{font-weight:700;font-size:9px;line-height:12px;letter-spacing:.07em;text-transform:uppercase;
  color:#C05418}
.dsq-panel{position:absolute;left:12px;right:12px;top:508px;height:80px;z-index:4;border-radius:9px;
  background:rgba(14,14,16,.93);border:1px solid rgba(255,255,255,.16);padding:7px 11px;overflow:hidden}
.dsq-ptitle{font-weight:700;font-size:16px;line-height:18px;letter-spacing:.01em;text-transform:uppercase}
.dsq-pbody{margin-top:3px;font-weight:400;font-size:11px;line-height:14px;color:rgba(255,255,255,.88)}
.dsq-pbody b{font-weight:700;color:#fff}
.dsq-cta{position:absolute;left:12px;right:12px;top:596px;height:38px;z-index:7;border:0;border-radius:6px;
  font-family:'dsqWorker',"Arial Black",Impact,sans-serif;font-weight:800;font-size:15px;letter-spacing:.05em;
  text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#C05418;color:#FFFFFF}
.dsq-hit{position:absolute;left:0;right:0;top:213.34px;bottom:0;z-index:6;background:transparent;
  pointer-events:none}
html.done .dsq-hit{pointer-events:auto}
html.done .dsq-pin,html.done .dsq-tile{pointer-events:none}
html.done .dsq-pin{animation:none}
@media (max-aspect-ratio:9/16){#dsq-fit{top:50%}}
</style>
</head>

<script>
(function(){
  var DATA = {"items": [{"t": "Ninny Scrubbins", "b": "Each festive bar is packed with scents of frosted pine, spice, and berries, along with marshmallow root extract for a rich lather."}, {"t": "Mistletoe Magic", "b": "Bursting with scents of sweet frosted cranberries and creamy vanilla for a cozy, festive lather that’s sure to make spirits bright."}, {"t": "Ninny Freshins", "b": "Odor Squatching Deodorant with Arrowroot, Charcoal and Postbiotics. 72 hour odor protection, aluminum free."}, {"t": "Squatch sized lip balm", "b": "Nourishing lip care to keep you merry from head to mistletoe. Two Moisturizing Lip Balms in the collection."}], "intro": {"t": "Warm, sweet & whimsical", "b": "Four limited-edition favorites inspired by Elf. Tap each one to see what it smells like."}, "done": {"t": "Straight from the North Pole", "b": "Bring the magic of the North Pole to your shower and beyond. ELF and all related characters and elements © & ™ New Line Productions, Inc."}, "url": "https://www.drsquatch.com/products/elf-holiday-collection"};
  var CLICK = DATA.url;
  function openLP(){
    try{
      if (typeof window.mraid !== 'undefined' && window.mraid && typeof window.mraid.open === 'function'){
        window.mraid.open(CLICK); return;
      }
    }catch(e){}
    try{ window.open(CLICK, '_blank'); }catch(e){}
  }

  /* ---- fit the 360x640 stage into the ad slot ---- */
  var fit = document.getElementById('dsq-fit');
  function resize(){
    var w = window.innerWidth || 360, h = window.innerHeight || 640;
    fit.style.setProperty('--dsq-s', Math.min(w / 360, h / 640));
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  /* ---- dynamic date ---- */
  var DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var MONS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function pad(v){ return (v < 10 ? '0' : '') + v; }
  function promoDate(){
    var q = '', m;
    try{ m = /[?&]promo-date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || ''); }catch(e){}
    if (m){ q = m[1]; }
    try{
      if (!q && typeof window.__PROMO_DATE === 'string' &&
          /^\d{4}-\d{2}-\d{2}$/.test(window.__PROMO_DATE)) { q = window.__PROMO_DATE; }
    }catch(e){}
    var dt;
    if (q){
      var p = q.split('-');
      dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0);
    } else { dt = new Date(); }
    if (isNaN(dt.getTime())) { dt = new Date(); }
    return dt;
  }
  function campaign(dt){
    var k = dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
    if (k >= '2026-11-01' && k <= '2026-11-26') return 'Black Friday Pre-Sale';
    if (k === '2026-11-27') return 'Black Friday';
    if (k === '2026-11-28' || k === '2026-11-29') return 'Black Friday Weekend';
    if (k === '2026-11-30') return 'Cyber Monday';
    return 'Limited Time Offer';
  }
  (function(){
    var dt = promoDate();
    var line = campaign(dt) + ' \u00B7 ' + DAYS[dt.getDay()] + ', ' + MONS[dt.getMonth()] + ' ' + dt.getDate();
    document.getElementById('dsq-date').textContent = line;
  })();

  /* ---- panel ---- */
  var title = document.getElementById('dsq-ptitle');
  var bodyEl = document.getElementById('dsq-pbody');
  function show(o){ title.textContent = o.t; bodyEl.textContent = o.b; }
  show(DATA.intro);

  /* ---- interaction ---- */
  var nodes = [].slice.call(document.querySelectorAll('[data-qa="tap"][data-i]'));
  var dots = [].slice.call(document.querySelectorAll('#dsq-dots .dsq-dot'));
  var seen = [], total = nodes.length, count = 0, finished = false;
  for (var i = 0; i < total; i++){ seen.push(false); }

  function pick(ev){
    if (ev){ ev.preventDefault(); ev.stopPropagation(); }
    var el = this, idx = Number(el.getAttribute('data-i'));
    for (var j = 0; j < nodes.length; j++){
      nodes[j].classList.remove('dsq-on');
      if (seen[j]) { nodes[j].classList.add('dsq-seen'); }
    }
    el.classList.remove('dsq-seen');
    el.classList.add('dsq-on');
    if (!seen[idx]){
      seen[idx] = true;
      count++;
      if (dots[idx]) { dots[idx].classList.add('dsq-on'); }
    }
    show(DATA.items[idx]);
    if (count >= total && !finished){
      finished = true;
      document.getElementById('hint').textContent = 'Tap to shop';
      window.setTimeout(function(){
        show(DATA.done);
        document.documentElement.classList.add('done');
      }, 420);
    }
  }
  for (var k = 0; k < nodes.length; k++){
    nodes[k].addEventListener('click', pick);
  }

  document.getElementById('cta').addEventListener('click', function(ev){
    ev.preventDefault(); ev.stopPropagation(); openLP();
  });
  document.getElementById('hit').addEventListener('click', function(ev){
    ev.preventDefault(); openLP();
  });
})();
</script>
</body>
