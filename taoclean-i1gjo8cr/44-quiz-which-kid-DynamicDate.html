:root{--navy:#133A4A;--slate:#2C4651;--teal:#0E424F;--red:#C8202F;--orange:#E8700F;--orange2:#B9580A;--peach:#FFF3E6;--cream:#F6F1E7;--sage:#ADC8BE;--salmon:#EB9678;--ink:#0A0A0A;--mute:#5E6A70;--line:#E6E2DA}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#0A0A0A 50%,#fff 50%);font-family:"Sofia","Outfit",Helvetica,Arial,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
img{display:block;-webkit-user-drag:none;pointer-events:none}
#cv{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.bar{flex:none;height:96px;background:#0A0A0A;color:var(--cream);padding:9px 10px 0;text-align:center}
.bar .r1{display:flex;align-items:center;justify-content:center}
.bf{font-family:"PlayfairI",Georgia,serif;font-style:italic;font-weight:700;font-size:23px;line-height:1;letter-spacing:-.005em}
.ea{font:600 9.5px/1 "Outfit",sans-serif;letter-spacing:.22em;color:var(--sage);border-left:1px solid rgba(246,241,231,.35);padding:5px 0 5px 10px;margin-left:10px}
.bar .r2{font:400 15px/1 "Outfit",sans-serif;margin-top:7px;white-space:nowrap}
.bar .r2 em{font-style:normal;font-weight:800;color:var(--salmon)}.bar .r2 strong{font-weight:700}
.bar .r3{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px}
.bar .ends{font:600 9.5px/1 "Outfit",sans-serif;letter-spacing:.18em;color:var(--sage)}
.tm{display:flex;align-items:center;gap:3px}
.tm .u{display:flex;align-items:baseline;gap:3px;background:#262626;border:1px solid rgba(246,241,231,.18);border-radius:6px;padding:4px 6px 3px}
.tm b{font:400 19px/1 "Adlinnaka",sans-serif;font-variant-numeric:tabular-nums;min-width:19px;text-align:center;color:#fff}
.tm i{font:600 7.5px/1 "Outfit",sans-serif;letter-spacing:.1em;color:var(--sage);font-style:normal}
.tm .c{font:400 16px/1 "Adlinnaka";color:var(--sage)}
.top{flex:none;display:flex;justify-content:center;padding:9px 0 0}
.logo{height:19px;width:auto}
.logo path,.logo circle,.logo rect,.logo polygon,.logo polyline{fill:var(--navy)}
.logo .st0{fill:#fff}
.hl{flex:none;font-weight:700;font-size:21px;line-height:1.08;letter-spacing:-.015em;text-align:center;padding:6px 20px 0;text-wrap:balance}
.hl em{font-style:normal;color:var(--red)}
.sub{flex:none;font:400 15px/1.1 "Adlinnaka",sans-serif;color:var(--slate);text-align:center;margin-top:3px}
.stage{flex:1 1 auto;min-height:0;position:relative;margin:8px 14px 0;padding-bottom:32px}
.press{flex:none;display:flex;align-items:center;justify-content:center;gap:13px;margin:6px 14px 0;padding-top:7px;border-top:1px solid var(--line)}
.press small{font:600 8px/1 "Sofia";letter-spacing:.16em;color:#8A9095;padding-right:12px;border-right:1px solid var(--line)}
.press img{height:13px;width:auto;filter:grayscale(1);opacity:.6}
.press img.pv{height:11px}.press img.pa{height:14px}
.foot{flex:none;padding:8px 14px 9px}
.cta{position:relative;z-index:60;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:50px;border:0;border-radius:14px;background:var(--orange);box-shadow:0 3px 0 var(--orange2);color:#fff;font:600 17px/1 "Sofia",sans-serif;cursor:pointer;overflow:hidden;animation:ctaP 2.4s ease-in-out infinite 1.6s}
.cta .pill{display:inline-flex;align-items:baseline;gap:6px;background:rgba(0,0,0,.16);border-radius:999px;padding:5px 11px 4px}
.cta .pill s{font-size:14px;font-weight:600;color:#FFE3C9;text-decoration-thickness:1.6px}
.cta .pill b{font-size:17px;font-weight:700}
.cta svg{width:20px;height:20px}
.cta:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:24%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);animation:shine 3s ease-in-out infinite 1.4s}
@keyframes ctaP{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes shine{0%{left:-40%}45%,100%{left:120%}}
.fine{font:400 12.5px/1 "Adlinnaka",sans-serif;color:var(--mute);text-align:center;margin-top:8px}
#hit{position:absolute;left:0;right:0;bottom:0;height:66.667%;z-index:50;cursor:pointer;pointer-events:none}
html.done #hit{pointer-events:auto}
.ix{position:relative;z-index:70;touch-action:none;cursor:pointer}
html.done .ix{pointer-events:none}
.chip{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);z-index:75;pointer-events:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 13px;border-radius:999px;background:var(--navy);color:#fff;font:600 10.5px/1 "Sofia";letter-spacing:.04em;white-space:nowrap;animation:chipP 1.8s ease-in-out infinite;transition:opacity .3s}
.chip svg{width:14px;height:14px}
html.done .chip{opacity:0;animation:none}
@keyframes chipP{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
.tag{display:inline-block;background:var(--red);color:#fff;font:700 9.5px/1 "Sofia";letter-spacing:.02em;border-radius:6px;padding:4px 6px 3px}
.reveal{opacity:0;transform:scale(.85);transition:opacity .35s,transform .5s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
html.done .reveal{opacity:1;transform:none}
.hide-done{transition:opacity .3s}html.done .hide-done{opacity:0}
.pop{animation:pp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:sh .45s}
@keyframes sh{0%,100%{translate:0}20%{translate:-7px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}
.cf{position:absolute;z-index:90;width:6px;height:9px;pointer-events:none;animation:cf 1.25s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.ctr{font:600 10px/1 "Sofia";letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.prod{filter:drop-shadow(0 14px 14px rgba(19,58,74,.22))}
.stars{display:inline-flex;gap:1px;color:#F2A93B}.stars svg{width:13px;height:13px;fill:currentColor}

.bar{position:relative;overflow:hidden}
.bar>div{position:relative;z-index:1}
.snow{position:absolute;inset:0;z-index:0;pointer-events:none}
.snow i{position:absolute;top:-8px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.55;animation:snw linear infinite}
@keyframes snw{to{transform:translate(var(--sx,10px),110px)}}
.eb{flex:none;text-align:center;margin-top:7px;font:600 9.5px/1 "Sofia";letter-spacing:.16em;color:var(--orange);text-transform:uppercase}
.eb b{color:var(--navy);font-weight:700}
.hl{padding-top:4px}
.fine{font-size:12px}
.bow{display:block;filter:drop-shadow(0 3px 3px rgba(80,10,15,.28))}
.rib{position:absolute;pointer-events:none;z-index:2}
.rib .v{position:absolute;top:0;bottom:0;right:22px;width:11px;background:linear-gradient(90deg,#A11A26,#C8202F 35%,#DE2E3E 55%,#C8202F)}
.rib .h{position:absolute;left:0;right:0;top:22px;height:11px;background:linear-gradient(180deg,#A11A26,#C8202F 35%,#DE2E3E 55%,#C8202F)}
.rib .bow{position:absolute;right:-5px;top:2px;width:64px;height:auto}

.qv{position:relative;flex:none;height:var(--vh,46%);border-radius:16px;overflow:hidden;background:var(--peach)}
.qv .vis{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.qv .vis img.p{height:92%;width:auto}
.qv .vis img.c{width:100%;height:100%;object-fit:cover}
.ans{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:#fff;border-radius:12px;padding:8px 10px 8px;box-shadow:0 6px 16px rgba(19,58,74,.18);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .35s cubic-bezier(.2,1.3,.4,1)}
.ans.on{opacity:1;transform:none}
.qv.side .vis{justify-content:flex-start;padding-left:10px}
.qv.top .ans{top:8px;bottom:auto}
.qv.side .ans{left:40%;right:8px;top:50%;bottom:auto;transform:translateY(-40%)}.qv.side .ans.on{transform:translateY(-50%)}
.ans small{display:block;font:600 8.5px/1 "Sofia";letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
.ans p{font:600 13.5px/1.2 "Sofia";color:var(--navy);margin-top:4px}
.fin{position:absolute;inset:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px}
.fin img{height:94%;width:auto;flex:none}
.fin .ft{display:flex;flex-direction:column;gap:6px}
.fin .k{font:600 9px/1 "Sofia";letter-spacing:.14em;color:var(--sage);text-transform:uppercase}
.fin .h{font:700 17px/1.12 "Sofia"}
.fin .pr{display:inline-flex;align-items:baseline;gap:6px;font:700 20px/1 "Sofia"}.fin .pr s{font-size:14px;font-weight:600;color:#9FB3BB}
.fin .tag{align-self:flex-start;background:var(--red);color:#fff;font:700 9.5px/1 "Sofia";border-radius:6px;padding:4px 6px 3px}
.ops{display:grid;grid-template-columns:var(--cols,1fr);gap:6px;margin-top:8px}
