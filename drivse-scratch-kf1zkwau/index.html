<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Drivse · Black Friday endcard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
button,input,select,textarea{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#E9EFEB;color:#1D2224}
#app{display:flex;height:100%}
aside{width:340px;flex:0 0 340px;padding:32px 28px;overflow:auto;border-right:1px solid rgba(29,34,36,.08);background:#F6FAF7}
aside h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
aside p{font-size:13px;line-height:1.5;color:#55605F;margin-top:8px}
ul{list-style:none;margin-top:22px}
li button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:#fff;border-radius:12px;padding:14px;cursor:pointer;
  box-shadow:0 0 0 1px rgba(29,34,36,.08)}
li button.on{box-shadow:0 0 0 2px #2E3D40}
li b{font-size:12px;color:#4F7F77} li span{font-size:14px;font-weight:600}
li small{display:block;font-weight:400;font-size:12px;color:#55605F;margin-top:4px;line-height:1.45}
label{display:block;margin-top:22px;font-size:12px;color:#55605F}
label input{display:block;margin-top:6px;padding:7px 9px;border:1px solid rgba(29,34,36,.18);border-radius:8px;background:#fff;font-size:13px}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;min-width:0}
#dev{border-radius:28px;overflow:hidden;background:#F2F8F4;box-shadow:0 0 0 9px #1D2224,0 30px 60px -20px rgba(0,0,0,.45);flex:0 0 auto}
#dev iframe{border:0;display:block;width:100%;height:100%}
#bar{display:none}
@media (max-width:760px){
  aside{display:none} #stage{padding:0;gap:0}
  #dev{border-radius:0;box-shadow:none;width:100vw!important;height:100%!important;flex:1}
  #bar{display:flex;position:fixed;left:0;right:0;bottom:0;justify-content:space-between;align-items:center;padding:8px 10px;pointer-events:none}
  #bar button{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(29,34,36,.75);color:#fff;font-size:18px}
  #bar button[disabled]{opacity:.25}
  #bar span{font-size:11px;color:#55605F;background:rgba(255,255,255,.8);padding:4px 8px;border-radius:999px}
}
</style></head><body>
<div id="app">
<aside>
  <h1>Drivse &middot; Black Friday</h1>
  <p>1 endcard. Scratch the slate panel on the IonDrops 2.0 card to reveal the Black Friday offer, then tap Claim.</p>
  <ul id="list"><li><button type="button" data-i="0"><b>01</b><span>Scratch to reveal<small>Black Friday take on the drivse.com Early Access pop-up: scratch the slate panel to reveal Buy 1 Get 2 Free.</small></span></button></li></ul>
  <label>Preview the campaign line on a date<input type="date" id="pd"></label>
</aside>
<main id="stage"><div id="dev"><iframe id="fr" title="Endcard"></iframe></div></main>
</div>
<div id="bar"><button id="prev" type="button" aria-label="Back">&#8249;</button><span id="ct"></span><button id="next" type="button" aria-label="Next">&#8250;</button></div>
<script>
var F=["Drivse_BlackFriday_IonDrops_ScratchToReveal_DynamicDate_01.html"], cur=0, fr=document.getElementById('fr'), dev=document.getElementById('dev'), st=document.getElementById('stage');
function src(i){ var d=document.getElementById('pd').value; return F[i]+(d?('?promo-date='+d):''); }
function show(i){ if(F.length<2) document.getElementById('bar').style.visibility='hidden';
  cur=Math.max(0,Math.min(F.length-1,i)); fr.src=src(cur);
  [].forEach.call(document.querySelectorAll('#list button'),function(b,k){b.classList.toggle('on',k===cur);});
  document.getElementById('prev').disabled=cur===0; document.getElementById('next').disabled=cur===F.length-1;
  document.getElementById('ct').textContent=(cur+1)+' / '+F.length;
  if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
}
function size(){
  if (window.innerWidth<=760){ dev.style.width=''; dev.style.height=''; return; }
  var pad=parseFloat(getComputedStyle(st).paddingTop)||0, gap=parseFloat(getComputedStyle(st).rowGap)||0, chrome=0;
  [].forEach.call(st.children,function(c){ if(c!==dev&&getComputedStyle(c).display!=='none') chrome+=c.getBoundingClientRect().height+gap; });
  var availH=st.clientHeight-pad*2-chrome-18, availW=st.clientWidth-pad*2-18;
  var s=Math.max(1,Math.min(availH/640,availW/360,1.3));
  dev.style.width=(360*s)+'px'; dev.style.height=(640*s)+'px';
}
document.getElementById('list').addEventListener('click',function(e){var b=e.target.closest('button'); if(b) show(+b.dataset.i);});
document.getElementById('prev').onclick=function(){show(cur-1);};
document.getElementById('next').onclick=function(){show(cur+1);};
document.getElementById('pd').onchange=function(){show(cur);};
window.addEventListener('resize',size);
window.addEventListener('hashchange',function(){var n=parseInt(location.hash.slice(1),10); if(n) show(n-1);});
size(); var n=parseInt(location.hash.slice(1),10); show(n?n-1:0);
</script></body></html>
